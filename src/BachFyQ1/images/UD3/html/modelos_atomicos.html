<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Modelos atómicos</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 1120px; } .card h2 { font-size: 18px; } .card .y { font-size: 14px; color: #C0392B; font-weight: 700; } .card .t { font-size: 13px; } </style>
</head>
<body>
<div class="canvas">
    <div class="row">
        <div class="card"><h2>Dalton</h2><div class="y">1808</div><svg id="a" width="180" height="180"></svg><div class="t">Esfera maciza e indivisible</div></div>
        <div class="card"><h2>Thomson</h2><div class="y">1904</div><svg id="b" width="180" height="180"></svg><div class="t">Esfera positiva con electrones incrustados</div></div>
        <div class="card"><h2>Rutherford</h2><div class="y">1911</div><svg id="c" width="180" height="180"></svg><div class="t">Núcleo diminuto y electrones girando</div></div>
        <div class="card"><h2>Bohr</h2><div class="y">1913</div><svg id="d" width="180" height="180"></svg><div class="t">Órbitas circulares de energía fija</div></div>
        <div class="card"><h2>Mecanocuántico</h2><div class="y">1926</div><svg id="e" width="180" height="180"></svg><div class="t">Orbitales: zonas de probabilidad</div></div>
    </div>
</div>
<script src="fig.js"></script>
<script>
    // Dalton
    let A = svgAdder('a'); bead(A, 90, 90, 62, '#5D6D7E');
    // Thomson
    A = svgAdder('b'); bead(A, 90, 90, 70, '#F1948A');
    [[60, 55], [110, 50], [140, 95], [95, 90], [50, 110], [85, 135], [125, 130], [70, 80], [115, 72]].forEach(([x, y]) => {
        bead(A, x, y, 9, '#F4D03F'); label(A, x, y + 4, '−', { 'font-size': 13 });
    });
    label(A, 30, 40, '+', { fill: '#922B21', 'font-size': 20 }); label(A, 152, 150, '+', { fill: '#922B21', 'font-size': 20 });
    // Rutherford
    A = svgAdder('c');
    [0, 60, 120].forEach(g => add_orbit(A, 90, 90, 78, 26, g));
    function add_orbit(add, cx, cy, rx, ry, g) { add('ellipse', { cx, cy, rx, ry, fill: 'none', stroke: '#2E86C1', 'stroke-width': 1.8, transform: `rotate(${g} ${cx} ${cy})` }); }
    bead(A, 90, 90, 7, '#C0392B');
    [[0, 0.6], [60, 2.5], [120, 4.2]].forEach(([g, t]) => {
        const x = 78 * Math.cos(t), y = 26 * Math.sin(t), a = g * Math.PI / 180;
        bead(A, 90 + x * Math.cos(a) - y * Math.sin(a), 90 + x * Math.sin(a) + y * Math.cos(a), 6, '#2E86C1');
    });
    // Bohr
    A = svgAdder('d');
    [30, 52, 76].forEach((r, i) => { A('circle', { cx: 90, cy: 90, r, fill: 'none', stroke: '#2E86C1', 'stroke-width': 1.8 }); label(A, 90 + r * 0.38 + 4, 90 - r * 0.92 - 3, 'n=' + (i + 1), { 'font-size': 11, fill: '#1F618D' }); });
    bead(A, 90, 90, 12, '#C0392B');
    [[30, 3.6], [30, 0.5], [52, 1.9], [52, 4.4], [52, 5.6], [76, 2.6], [76, 4.9]].forEach(([r, t]) => bead(A, 90 + r * Math.cos(t), 90 + r * Math.sin(t), 5.5, '#2E86C1'));
    // Mecanocuántico
    A = svgAdder('e');
    cloud(A, 90, 90, 82, 82, 2600, '#2E86C1', 7);
    bead(A, 90, 90, 5, '#C0392B');
</script>
</body>
</html>

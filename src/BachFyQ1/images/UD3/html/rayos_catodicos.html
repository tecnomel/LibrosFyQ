<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rayos catódicos</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 960px; } </style>
</head>
<body>
<div class="canvas">
    <svg id="s" width="910" height="330"></svg>
</div>
<script src="fig.js"></script>
<script>
    const A = svgAdder('s');
    // tubo de vidrio
    A('path', { d: 'M80 150 Q80 120 110 120 L560 120 Q640 120 720 70 Q790 40 800 60 L800 260 Q790 280 720 250 Q640 200 560 200 L110 200 Q80 200 80 170 Z', fill: '#EBF5FB', stroke: '#5D6D7E', 'stroke-width': 3 });
    // pantalla fluorescente
    A('path', { d: 'M800 60 L800 260', stroke: '#27AE60', 'stroke-width': 8 });
    // cátodo y ánodo
    A('rect', { x: 92, y: 140, width: 18, height: 40, fill: '#34495E' });
    A('rect', { x: 230, y: 125, width: 10, height: 26, fill: '#7F8C8D' }); A('rect', { x: 230, y: 169, width: 10, height: 26, fill: '#7F8C8D' });
    // placas deflectoras
    A('rect', { x: 420, y: 126, width: 120, height: 9, fill: '#C0392B' }); A('rect', { x: 420, y: 185, width: 120, height: 9, fill: '#2E86C1' });
    label(A, 480, 120, '+', { fill: '#C0392B', 'font-size': 22 }); label(A, 480, 215, '−', { fill: '#2E86C1', 'font-size': 24 });
    // haz
    A('path', { d: 'M110 160 L420 160 Q500 160 545 145 L800 95', fill: 'none', stroke: '#17A589', 'stroke-width': 6, opacity: 0.85 });
    A('path', { d: 'M420 160 L800 160', fill: 'none', stroke: '#17A589', 'stroke-width': 2, 'stroke-dasharray': '7 6', opacity: 0.7 });
    A('circle', { cx: 800, cy: 95, r: 10, fill: '#58D68D' });
    // electrones en el haz
    [150, 200, 300, 360].forEach(x => { bead(A, x, 160, 6, '#F4D03F'); label(A, x, 164, '−', { 'font-size': 11 }); });
    // circuito
    A('path', { d: 'M101 140 L101 40 L180 40', fill: 'none', stroke: '#23373B', 'stroke-width': 2 });
    A('path', { d: 'M235 125 L235 40 L210 40', fill: 'none', stroke: '#23373B', 'stroke-width': 2 });
    A('line', { x1: 182, y1: 25, x2: 182, y2: 55, stroke: '#23373B', 'stroke-width': 3 });
    A('line', { x1: 205, y1: 32, x2: 205, y2: 48, stroke: '#23373B', 'stroke-width': 5 });
    label(A, 175, 20, '−', { 'font-size': 18 }); label(A, 215, 20, '+', { 'font-size': 18 });
    label(A, 290, 30, 'Alto voltaje', { 'font-size': 15, 'text-anchor': 'start' });
    // rótulos
    const L = (x, y, x2, y2, t, anchor = 'middle') => { A('line', { x1: x, y1: y, x2, y2, stroke: '#7F8C8D', 'stroke-width': 1.2 }); label(A, x2, y2 + (y2 > y ? 18 : -6), t, { 'font-size': 14, 'text-anchor': anchor }); };
    L(100, 182, 70, 260, 'Cátodo (−)');
    L(236, 196, 236, 260, 'Ánodo perforado (+)');
    L(480, 196, 480, 280, 'Placas deflectoras');
    L(330, 160, 340, 100, 'Rayos catódicos (electrones)');
    L(800, 230, 820, 300, 'Pantalla fluorescente', 'end');
    label(A, 640, 175, 'sin campo', { 'font-size': 12, fill: '#7F8C8D' });
    label(A, 600, 62, 'se desvía hacia la placa +', { 'font-size': 13, fill: '#117A65' });
</script>
</body>
</html>

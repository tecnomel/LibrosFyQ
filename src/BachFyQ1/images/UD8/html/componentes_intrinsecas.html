<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Componentes intrínsecas de la aceleración</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 860px; } </style>
</head>
<body>
<div class="canvas">
    <div class="row">
        <div class="card"><h2>Vectores unitarios tangente y normal</h2><svg id="a" width="380" height="280"></svg>
            <div class="t">El tangente apunta en el sentido del movimiento;<br>el normal, hacia el centro de curvatura (parte cóncava).</div></div>
        <div class="card"><h2>Aceleración tangencial y normal</h2><svg id="b" width="380" height="280"></svg>
            <div class="t">Aquí la rapidez aumenta: la aceleración tangencial tiene el sentido de la velocidad.</div></div>
    </div>
</div>
<script src="fig.js"></script>
<script>
    // trayectoria: arco de circunferencia de centro C y radio R
    function escena(add, conA) {
        const C = [190, 250], R = 190;
        const f = t => [C[0] + R * Math.cos(t), C[1] - R * Math.sin(t)];
        curve(add, f, Math.PI * 0.12, Math.PI * 0.95, '#1E8449', 3);
        // la trayectoria se recorre de derecha a izquierda (ángulo creciente)
        const th = Math.PI * 0.36, P = f(th);
        const ut = [-Math.sin(th), -Math.cos(th)], un = [-Math.cos(th), Math.sin(th)];
        dashed(add, P[0], P[1], C[0], C[1], '#7F8C8D', 1.2);
        dot(add, C[0], C[1], '#7F8C8D', 3.5); label(add, C[0] + 2, C[1] + 20, 'centro de curvatura', { 'font-size': 12, fill: '#7F8C8D' });
        label(add, (P[0] + C[0]) / 2 + 22, (P[1] + C[1]) / 2 + 30, 'R', { 'font-size': 14, fill: '#7F8C8D', 'font-style': 'italic' });
        label(add, 100, 215, 'trayectoria', { 'font-size': 13, fill: '#1E8449' });
        if (!conA) {
            dashed(add, P[0] - 150 * ut[0], P[1] - 150 * ut[1], P[0] + 160 * ut[0], P[1] + 160 * ut[1], '#2471A3', 1.2);
            label(add, P[0] + 135 * ut[0] + 10, P[1] + 135 * ut[1] - 12, 'eje tangente', { 'font-size': 12, fill: '#2471A3' });
            arrow(add, P[0], P[1], P[0] + 70 * ut[0], P[1] + 70 * ut[1], '#2471A3', 3.5, 12);
            arrow(add, P[0], P[1], P[0] + 70 * un[0], P[1] + 70 * un[1], '#C0392B', 3.5, 12);
            vlab(add, P[0] + 62 * ut[0] + 4, P[1] + 62 * ut[1] - 12, 'u', 't', '#2471A3');
            vlab(add, P[0] + 62 * un[0] + 22, P[1] + 62 * un[1] + 2, 'u', 'n', '#C0392B');
        } else {
            const at = 80, an = 95;
            const At = [P[0] + at * ut[0], P[1] + at * ut[1]], An = [P[0] + an * un[0], P[1] + an * un[1]];
            const Aa = [P[0] + at * ut[0] + an * un[0], P[1] + at * ut[1] + an * un[1]];
            arrow(add, P[0], P[1], P[0] + 140 * ut[0], P[1] + 140 * ut[1], '#23373B', 2, 11);
            vlab(add, P[0] + 140 * ut[0] - 4, P[1] + 140 * ut[1] - 10, 'v', '', '#23373B');
            dashed(add, At[0], At[1], Aa[0], Aa[1], '#8E44AD', 1.2); dashed(add, An[0], An[1], Aa[0], Aa[1], '#8E44AD', 1.2);
            arrow(add, P[0], P[1], At[0], At[1], '#2471A3', 4, 13);
            arrow(add, P[0], P[1], An[0], An[1], '#C0392B', 4, 13);
            arrow(add, P[0], P[1], Aa[0], Aa[1], '#8E44AD', 4, 13);
            vlab(add, P[0] + 45 * ut[0] + 20 * un[0] + 4, P[1] + 45 * ut[1] + 20 * un[1] + 8, 'a', 't', '#2471A3');
            vlab(add, An[0] + 24, An[1] + 2, 'a', 'n', '#C0392B');
            vlab(add, Aa[0] - 16, Aa[1] + 4, 'a', '', '#8E44AD');
        }
        dot(add, P[0], P[1], '#23373B', 5.5);
        label(add, P[0] + 14, P[1] - 8, 'P', { 'font-size': 14 });
    }
    escena(svgAdder('a'), false);
    escena(svgAdder('b'), true);
</script>
</body>
</html>

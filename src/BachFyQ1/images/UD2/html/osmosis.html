<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ósmosis y presión osmótica</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 1000px; } .card .t { font-size: 14px; } </style>
</head>
<body>
<div class="canvas">
    <div class="row">
        <div class="card"><h2>1. Situación inicial</h2><svg id="a" width="270" height="300"></svg><div class="t">Agua pura (izquierda) y disolución (derecha) separadas por una membrana semipermeable.</div></div>
        <div class="card"><h2>2. Ósmosis</h2><svg id="b" width="270" height="300"></svg><div class="t">El disolvente pasa hacia la disolución, cuyo nivel sube hasta una altura h.</div></div>
        <div class="card"><h2>3. Presión osmótica</h2><svg id="c" width="270" height="300"></svg><div class="t">La presión π que hay que aplicar para impedir el paso neto de disolvente.</div></div>
    </div>
</div>
<script src="fig.js"></script>
<script>
    const AG = '#AED6F1', DI = '#5DADE2';
    // Tubo en U: brazos de anchura w; nivel izquierdo yl, derecho yr
    function tuboU(add, yl, yr, seed) {
        const xl = 55, xr = 175, w = 44, yb = 240, top = 24;
        // líquidos (izquierda agua, derecha disolución), unidos en el codo
        add('path', { d: `M${xl} ${yl} L${xl + w} ${yl} L${xl + w} ${yb - 10} L${(xl + xr + w) / 2} ${yb - 10} L${(xl + xr + w) / 2} ${yb + 34} L${xl + 20} ${yb + 34} Q${xl} ${yb + 34} ${xl} ${yb + 14} Z`, fill: AG });
        add('path', { d: `M${xr + w} ${yr} L${xr} ${yr} L${xr} ${yb - 10} L${(xl + xr + w) / 2} ${yb - 10} L${(xl + xr + w) / 2} ${yb + 34} L${xr + w - 20} ${yb + 34} Q${xr + w} ${yb + 34} ${xr + w} ${yb + 14} Z`, fill: DI });
        // vidrio
        add('path', { d: `M${xl} ${top} L${xl} ${yb + 14} Q${xl} ${yb + 34} ${xl + 20} ${yb + 34} L${xr + w - 20} ${yb + 34} Q${xr + w} ${yb + 34} ${xr + w} ${yb + 14} L${xr + w} ${top}`, fill: 'none', stroke: '#5D6D7E', 'stroke-width': 3 });
        add('path', { d: `M${xl + w} ${top} L${xl + w} ${yb - 10} L${xr} ${yb - 10} L${xr} ${top}`, fill: 'none', stroke: '#5D6D7E', 'stroke-width': 3 });
        // membrana
        const xm = (xl + xr + w) / 2;
        add('line', { x1: xm, y1: yb - 10, x2: xm, y2: yb + 34, stroke: '#A04000', 'stroke-width': 4, 'stroke-dasharray': '5 3' });
        // partículas de soluto en el brazo derecho
        const r = rng(seed);
        for (let k = 0; k < 16; k++) bead(add, xr + 8 + r() * (w - 16), Math.max(yr, 30) + 10 + r() * (yb - yr - 15), 5, '#C0392B');
        return { xl, xr, w, xm, yb };
    }
    let add = svgAdder('a');
    tuboU(add, 120, 120, 1);
    label(add, 77, 14, 'agua', { 'font-size': 14 });
    label(add, 197, 14, 'disolución', { 'font-size': 14 });
    label(add, 135, 296, 'membrana', { 'font-size': 13, 'font-weight': 400, fill: '#A04000' });
    add = svgAdder('b');
    const g = tuboU(add, 160, 80, 2);
    arrow(add, g.xm - 22, g.yb + 12, g.xm + 22, g.yb + 12, '#1F618D', 3, 11);
    add('line', { x1: 230, y1: 80, x2: 250, y2: 80, stroke: '#525252', 'stroke-width': 1.5 });
    add('line', { x1: 230, y1: 160, x2: 250, y2: 160, stroke: '#525252', 'stroke-width': 1.5 });
    add('line', { x1: 240, y1: 80, x2: 240, y2: 160, stroke: '#525252', 'stroke-width': 1.5 });
    add('line', { x1: 105, y1: 160, x2: 230, y2: 160, stroke: '#525252', 'stroke-width': 1, 'stroke-dasharray': '4 3' });
    label(add, 254, 125, 'h', { 'font-size': 18, 'font-style': 'italic' });
    add = svgAdder('c');
    tuboU(add, 120, 120, 3);
    // émbolo sobre la disolución
    add('rect', { x: 177, y: 106, width: 40, height: 14, fill: '#85929E' });
    add('rect', { x: 191, y: 40, width: 12, height: 66, fill: '#85929E' });
    arrow(add, 197, 0, 197, 38, '#C0392B', 6, 16);
    label(add, 225, 30, 'π', { 'font-size': 22, fill: '#C0392B' });
</script>
</body>
</html>

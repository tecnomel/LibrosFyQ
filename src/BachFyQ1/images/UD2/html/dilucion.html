<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Preparación de una disolución por dilución</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 960px; } .card h2 { font-size: 17px; } .card .t { font-size: 13px; } </style>
</head>
<body>
<div class="canvas">
    <div class="row">
        <div class="card"><h2>Disolución concentrada</h2><svg id="a" width="200" height="250"></svg><div class="t">Se toma con la pipeta el volumen V₁ calculado (concentración c₁).</div></div>
        <div class="card"><h2>Trasvasar</h2><svg id="b" width="200" height="250"></svg><div class="t">Se vierte en el matraz aforado, que ya tiene algo de agua destilada.</div></div>
        <div class="card"><h2>Disolución diluida</h2><svg id="c" width="200" height="250"></svg><div class="t">Se enrasa hasta el volumen V₂: concentración c₂ &lt; c₁.</div></div>
    </div>
    <div class="note" style="text-align:center; margin-top:8px; font-size:18px; color:#23373B">
        Los moles de soluto no cambian: <b>c₁ · V₁ = c₂ · V₂</b>
    </div>
</div>
<script src="fig.js"></script>
<script>
    // pipeta: cx = eje, y0 = arriba, nivel del líquido en el tubo
    function pipeta(add, cx, y0, liq, col) {
        add('rect', { x: cx - 3, y: liq, width: 6, height: y0 + 170 - liq, fill: col });
        add('path', { d: `M${cx - 4} ${y0} L${cx - 4} ${y0 + 175} L${cx} ${y0 + 190} L${cx + 4} ${y0 + 175} L${cx + 4} ${y0}`, fill: 'none', stroke: '#5D6D7E', 'stroke-width': 2 });
        add('rect', { x: cx - 9, y: y0 - 26, width: 18, height: 28, rx: 7, fill: '#C0392B' });
    }
    // a) botella / vaso con la disolución concentrada y pipeta
    let add = svgAdder('a');
    beaker(add, 45, 110, 110, 125, { fill: 0.6, color: '#2E86C1' });
    pipeta(add, 100, 30, 70, '#2E86C1');
    label(add, 100, 248, 'c₁', { 'font-size': 18 });
    // b) pipeta vaciándose en el matraz
    add = svgAdder('b');
    flask(add, 100, 75, 42, { level: 0.25, color: '#D6EAF8' });
    pipeta(add, 100, 10, 150, '#2E86C1');
    // c) matraz enrasado, más claro
    add = svgAdder('c');
    const f = flask(add, 100, 60, 42, { level: 'aforo', color: '#85C1E9', stopper: true });
    label(add, 100, 248, 'c₂, V₂', { 'font-size': 18 });
</script>
</body>
</html>

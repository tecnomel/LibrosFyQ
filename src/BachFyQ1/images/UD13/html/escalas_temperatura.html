<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Escalas Celsius y Kelvin</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 700px; } </style>
</head>
<body>
<div class="canvas">
    <svg id="a" width="660" height="400"></svg>
</div>
<script src="fig.js"></script>
<script>
    const A = svgAdder('a');
    // escala vertical: -273,15 °C (y = 350) ... 100 °C (y = 60)
    const yOf = c => 350 - (c + 273.15) / 373.15 * 290;
    function termo(x, nombre, unidad, col) {
        label(A, x, 22, nombre, { 'font-size': 16, fill: col });
        label(A, x, 40, unidad, { 'font-size': 14, fill: '#525252', 'font-weight': 400 });
        A('rect', { x: x - 9, y: 50, width: 18, height: 315, rx: 9, fill: '#FBFCFC', stroke: '#5D6D7E', 'stroke-width': 2 });
        const g = A('defs', {});
        g.innerHTML = `<linearGradient id="col${x}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2E86C1"/><stop offset=".55" stop-color="#58D68D"/><stop offset=".8" stop-color="#F4D03F"/><stop offset="1" stop-color="#E74C3C"/></linearGradient>`;
        A('rect', { x: x - 4, y: 56, width: 8, height: 300, rx: 4, fill: `url(#col${x})` });
        A('circle', { cx: x, cy: 372, r: 15, fill: '#2E86C1', stroke: '#5D6D7E', 'stroke-width': 2 });
    }
    const xK = 120, xC = 270;
    termo(xK, 'Kelvin', '(K)', '#6C3483');
    termo(xC, 'Celsius', '(°C)', '#B9770E');
    const marcas = [
        [100, '373,15', '100', 'el agua hierve (1 atm)', '#C0392B'],
        [37, '310,15', '37', 'temperatura corporal', '#B9770E'],
        [0, '273,15', '0', 'el agua se congela (1 atm)', '#2471A3'],
        [-273.15, '0', '−273,15', 'cero absoluto', '#23373B'],
    ];
    for (const [c, k, cc, txt, col] of marcas) {
        const y = yOf(c);
        A('line', { x1: xK - 30, y1: y, x2: 640, y2: y, stroke: col, 'stroke-width': 1.5, 'stroke-dasharray': '5 4' });
        label(A, xK - 36, y + 5, k, { 'font-size': 15, 'text-anchor': 'end', fill: '#6C3483' });
        label(A, xC + 18, y - 5, cc, { 'font-size': 15, 'text-anchor': 'start', fill: '#B9770E' });
        label(A, 640, y - 6, txt, { 'font-size': 15, 'text-anchor': 'end', fill: col, 'font-weight': 600 });
    }
    // fórmula
    A('rect', { x: 380, y: 210, width: 250, height: 70, rx: 10, fill: '#F4ECF7', stroke: '#6C3483', 'stroke-width': 1.5 });
    rich(A, 505, 238, '*T* (K) = *t* (°C) + 273,15', { 'font-size': 17 });
    rich(A, 505, 266, 'Δ*T* (K) = Δ*t* (°C)', { 'font-size': 16, 'font-weight': 600 });
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tiro horizontal y caída libre</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 700px; } </style>
</head>
<body>
<div class="canvas">
    <svg id="s" width="660" height="360"></svg>
</div>
<script src="fig.js"></script>
<script>
    const add = svgAdder('s');
    const x0 = 110, yT = 40, yS = 320, v = 62, g = 34;   // escala de dibujo; t en «intervalos»
    // torre / mesa
    add('rect', { x: 20, y: yT + 8, width: x0 - 30, height: yS - yT - 8, fill: '#E5E8E8', stroke: '#B3B6B7' });
    add('line', { x1: 10, y1: yS, x2: 640, y2: yS, stroke: '#23373B', 'stroke-width': 2 });
    const n = 5;
    const pos = k => [x0 + v * k, yT + g * k * k / 2];
    curve(add, t => [x0 + v * t, yT + g * t * t / 2], 0, 3.88, '#1E8449', 2, { 'stroke-dasharray': '6 5' });
    for (let k = 0; k < n; k++) {
        const [x, y] = pos(k);
        if (y > yS) break;
        dashed(add, x, y, x, yS, '#AEB6BF', 1); dashed(add, x0 - 30, y, x, y, '#AEB6BF', 1);
        // bola en caída libre (soltada a la vez)
        add('circle', { cx: x0 - 30, cy: y, r: 9, fill: '#5DADE2', stroke: '#2471A3', 'stroke-width': 1.5 });
        // bola lanzada horizontalmente
        add('circle', { cx: x, cy: y, r: 9, fill: '#F39C12', stroke: '#B9770E', 'stroke-width': 1.5 });
        dot(add, x, yS, '#1E8449', 5);
        label(add, x + 4, yS + 20, 't' + '₀₁₂₃₄'[k], { 'font-size': 13, fill: '#525252' });
    }
    arrow(add, x0, yT, x0 + 70, yT, '#C0392B', 3, 11); vlab(add, x0 + 52, yT - 10, 'v', '0', '#C0392B');
    label(add, 360, yS + 40, 'mismos desplazamientos horizontales en tiempos iguales (MRU)', { 'font-size': 13, fill: '#1E8449' });
    label(add, 22, 200, 'caída libre (MRUA)', { 'font-size': 13, fill: '#2471A3', transform: 'rotate(-90 14 200)' });
    // nota
    const T = ['La bola lanzada y la que se deja caer', 'están siempre a la misma altura:', 'llegan al suelo a la vez.'];
    T.forEach((s, i) => label(add, 420, 70 + i * 22, s, { 'font-size': 14, fill: '#23373B', 'text-anchor': 'start', 'font-weight': 600 }));
</script>
</body>
</html>

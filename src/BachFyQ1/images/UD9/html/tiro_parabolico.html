<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tiro parabólico: composición de un MRU y un MRUA</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 860px; } </style>
</head>
<body>
<div class="canvas">
    <svg id="s" width="820" height="400"></svg>
</div>
<script src="fig.js"></script>
<script>
    const add = svgAdder('s');
    const O = [50, 300], W = 640, H = 200;          // alcance y altura máxima en el dibujo
    const P = t => [O[0] + W * t, O[1] - 4 * H * t * (1 - t)];   // t de 0 a 1 (fracción del tiempo de vuelo)
    const V = t => [W, -4 * H * (1 - 2 * t)];                     // derivada (en el dibujo, y hacia abajo)
    const al = Math.atan2(4 * H, W), k = 0.1;
    axes(add, O[0], O[1], 740, 280, 'x', 'y');
    curve(add, P, 0, 1, '#1E8449', 2.5, { 'stroke-dasharray': '7 5' });
    const Pm = P(0.5), Pf = P(1);
    dashed(add, Pm[0], Pm[1], Pm[0], O[1], '#7F8C8D', 1.3);
    label(add, Pm[0] + 34, (Pm[1] + O[1]) / 2 + 20, 'y máx', { 'font-size': 14, fill: '#525252', 'font-style': 'italic' });
    arrow(add, O[0] + 10, O[1] + 40, Pf[0], O[1] + 40, '#525252', 1.3, 8); arrow(add, Pf[0] - 10, O[1] + 40, O[0], O[1] + 40, '#525252', 1.3, 8);
    label(add, (O[0] + Pf[0]) / 2, O[1] + 60, 'alcance, x máx', { 'font-size': 13, fill: '#525252' });
    [0, 0.2, 0.5, 0.8, 1].forEach((t, i) => {
        const [x, y] = P(t), [vx, vy] = V(t);
        if (Math.abs(vy) > 1) {
            arrow(add, x, y, x, y + vy * k, '#2471A3', 2.5, 10);
            dashed(add, x + vx * k, y, x + vx * k, y + vy * k, '#8E44AD', 1); dashed(add, x, y + vy * k, x + vx * k, y + vy * k, '#8E44AD', 1);
        }
        arrow(add, x, y, x + vx * k, y, '#E67E22', 2.5, 10);
        arrow(add, x, y, x + vx * k, y + vy * k, '#C0392B', 3.5, 12);
        add('circle', { cx: x, cy: y, r: 7, fill: '#F39C12', stroke: '#B9770E', 'stroke-width': 1.5 });
        if (i === 2) label(add, x, y - 16, 'v_y = 0', { 'font-size': 13, fill: '#2471A3' });
    });
    add('path', { d: `M${O[0] + 45} ${O[1]} A45 45 0 0 0 ${O[0] + 45 * Math.cos(al)} ${O[1] - 45 * Math.sin(al)}`, fill: 'none', stroke: '#525252', 'stroke-width': 1.5 });
    label(add, O[0] + 58, O[1] - 14, 'α', { 'font-size': 16, fill: '#525252' });
    vlab(add, O[0] + 96, O[1] - 66, 'v', '0', '#C0392B');
    vlab(add, O[0] - 22, O[1] - 46, 'v', '0y', '#2471A3', 15);
    vlab(add, O[0] + 40, O[1] + 18, 'v', '0x', '#E67E22', 15);
    arrow(add, 740, 70, 740, 130, '#23373B', 3, 12); vlab(add, 762, 108, 'g', '', '#23373B');
    const L = [['#E67E22', 'v_x = v₀ cos α: constante (MRU)'], ['#2471A3', 'v_y = v₀ sen α − g t: cambia (MRUA)'], ['#C0392B', 'v: tangente a la trayectoria']];
    L.forEach(([c, s], i) => label(add, 90, 30 + i * 22, s, { 'font-size': 14, fill: c, 'text-anchor': 'start', 'font-weight': 600 }));
</script>
</body>
</html>

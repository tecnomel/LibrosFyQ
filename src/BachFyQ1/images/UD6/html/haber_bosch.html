<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Síntesis industrial del amoníaco (Haber-Bosch)</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 960px; } </style>
</head>
<body>
<div class="canvas">
    <svg id="s" width="920" height="275"></svg>
</div>
<script src="fig.js"></script>
<script>
    const A = svgAdder('s');
    const box = (x, y, w, h, fill, t1, t2, t3) => {
        A('rect', { x, y, width: w, height: h, rx: 14, fill, stroke: '#23373B', 'stroke-width': 2 });
        label(A, x + w / 2, y + 30, t1, { 'font-size': 17 });
        if (t2) label(A, x + w / 2, y + 54, t2, { 'font-size': 14, 'font-weight': 400 });
        if (t3) label(A, x + w / 2, y + 74, t3, { 'font-size': 14, 'font-weight': 400 });
    };
    // Entrada
    chemText(A, 60, 112, 'N_2 + 3 H_2', { 'font-size': 18, fill: '#2E86C1' });
    label(A, 60, 134, '(1 : 3)', { 'font-size': 14, 'font-weight': 400 });
    arrow(A, 115, 125, 160, 125, '#2E86C1', 3, 12);
    box(165, 80, 150, 95, '#D6EAF8', 'Compresor', 'hasta unas', '200 atm');
    arrow(A, 315, 125, 360, 125, '#2E86C1', 3, 12);
    box(365, 60, 180, 135, '#FDEBD0', 'Reactor', '400-500 °C', 'catalizador de Fe');
    chemText(A, 455, 175, 'N_2 + 3 H_2 ⇄ 2 NH_3', { 'font-size': 14, fill: '#A04000' });
    arrow(A, 545, 125, 590, 125, '#7D3C98', 3, 12);
    box(595, 80, 160, 95, '#E8DAEF', 'Condensador', 'el NH₃ se licúa;', 'N₂ y H₂ no');
    arrow(A, 675, 175, 675, 235, '#7D3C98', 3, 12);
    chemText(A, 675, 260, 'NH_3 líquido', { 'font-size': 17, fill: '#7D3C98' });
    // Recirculación
    A('path', { d: 'M755 110 L840 110 L840 30 L240 30 L240 70', fill: 'none', stroke: '#1E8449', 'stroke-width': 3, 'stroke-dasharray': '8 5' });
    arrow(A, 240, 55, 240, 78, '#1E8449', 3, 12);
    label(A, 540, 22, 'recirculación de N₂ y H₂ sin reaccionar', { 'font-size': 14, fill: '#1E8449' });
    // Calor
    label(A, 455, 225, 'la reacción es exotérmica: el calor', { 'font-size': 13, 'font-weight': 400, fill: '#525252' });
    label(A, 455, 243, 'se aprovecha para calentar los gases', { 'font-size': 13, 'font-weight': 400, fill: '#525252' });
</script>
</body>
</html>

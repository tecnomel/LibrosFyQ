<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Combustión del propano: modelo de bolas</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 940px; } </style>
</head>
<body>
<div class="canvas">
    <svg id="s" width="900" height="250"></svg>
</div>
<script src="fig.js"></script>
<script>
    const A = svgAdder('s');
    const r = 13;
    // Propano: C-C-C en zigzag con 8 H
    const C3H8 = [
        ['H', -2.9, 0], ['H', 2.9, 0], ['H', -1.6, -1.35], ['H', -1.6, 1.35], ['H', 0, -1.35], ['H', 0, 1.35],
        ['H', 1.6, -1.35], ['H', 1.6, 1.35],
        ['C', -1.6, 0], ['C', 0, 0], ['C', 1.6, 0],
    ];
    const cols = [60, 245, 470, 690];
    // Reactivos
    molecule(A, 70, 100, C3H8, 11);
    label(A, 133, 108, '+', { 'font-size': 30 });
    [[180, 55], [240, 55], [180, 110], [240, 110], [210, 160]].forEach(([x, y]) => molecule(A, x, y, MOL.O2, r));
    arrow(A, 285, 100, 355, 100, '#23373B', 3.5, 14);
    // Productos
    [[410, 50], [410, 105], [410, 160]].forEach(([x, y]) => molecule(A, x, y, MOL.CO2, r));
    label(A, 485, 108, '+', { 'font-size': 30 });
    [[545, 60], [610, 60], [545, 130], [610, 130]].forEach(([x, y]) => molecule(A, x, y, MOL.H2O, r));
    // Fórmulas
    chemText(A, 70, 205, '1 C_3H_8', { 'font-size': 18 });
    chemText(A, 210, 205, '5 O_2', { 'font-size': 18 });
    chemText(A, 410, 205, '3 CO_2', { 'font-size': 18 });
    chemText(A, 578, 205, '4 H_2O', { 'font-size': 18 });
    // Recuento de átomos
    A('rect', { x: 30, y: 220, width: 260, height: 26, rx: 8, fill: '#DFF3E6' });
    label(A, 160, 239, 'C: 3   ·   H: 8   ·   O: 10', { 'font-size': 15, fill: '#1E8449' });
    A('rect', { x: 370, y: 220, width: 270, height: 26, rx: 8, fill: '#DFF3E6' });
    label(A, 505, 239, 'C: 3   ·   H: 8   ·   O: 6 + 4 = 10', { 'font-size': 15, fill: '#1E8449' });
    // Leyenda de colores
    [['C', 'carbono'], ['H', 'hidrógeno'], ['O', 'oxígeno']].forEach(([el, t], i) => {
        bead(A, 715, 70 + i * 40, 11 * RAD[el], CPK[el]);
        label(A, 735, 76 + i * 40, t, { 'text-anchor': 'start', 'font-size': 15, 'font-weight': 400 });
    });
    label(A, 790, 205, 'mismo número de átomos', { 'font-size': 14, fill: '#525252', 'font-weight': 400 });
    label(A, 790, 225, 'a cada lado de la flecha', { 'font-size': 14, fill: '#525252', 'font-weight': 400 });
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Calorímetro</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 640px; } </style>
</head>
<body>
<div class="canvas">
    <svg id="s" width="600" height="325"></svg>
</div>
<script src="fig.js"></script>
<script>
    const A = svgAdder('s');
    const x0 = 150, y0 = 70, w = 210, h = 230;
    // Pared aislante (doble pared)
    A('rect', { x: x0 - 18, y: y0, width: w + 36, height: h + 18, rx: 16, fill: '#D5DBDB', stroke: '#5D6D7E', 'stroke-width': 2.5 });
    A('rect', { x: x0, y: y0 + 4, width: w, height: h, rx: 10, fill: '#FFFFFF', stroke: '#5D6D7E', 'stroke-width': 2.5 });
    // Agua
    A('rect', { x: x0 + 3, y: y0 + 60, width: w - 6, height: h - 63, rx: 8, fill: '#AED6F1', opacity: 0.9 });
    // Tapa
    A('rect', { x: x0 - 26, y: y0 - 18, width: w + 52, height: 22, rx: 6, fill: '#F39C12', stroke: '#B9770E', 'stroke-width': 2 });
    // Termómetro
    A('rect', { x: x0 + 52, y: y0 - 60, width: 12, height: 250, rx: 6, fill: '#FDFEFE', stroke: '#5D6D7E', 'stroke-width': 2 });
    A('rect', { x: x0 + 55, y: y0 + 40, width: 6, height: 145, fill: '#C0392B' });
    A('circle', { cx: x0 + 58, cy: y0 + 195, r: 11, fill: '#C0392B', stroke: '#5D6D7E', 'stroke-width': 2 });
    // Agitador
    A('line', { x1: x0 + 150, y1: y0 - 60, x2: x0 + 150, y2: y0 + 195, stroke: '#566573', 'stroke-width': 4 });
    A('line', { x1: x0 + 125, y1: y0 + 195, x2: x0 + 175, y2: y0 + 195, stroke: '#566573', 'stroke-width': 5 });
    A('rect', { x: x0 + 140, y: y0 - 72, width: 20, height: 14, rx: 3, fill: '#566573' });
    // Recipiente de reacción
    A('rect', { x: x0 + 85, y: y0 + 120, width: 40, height: 60, rx: 6, fill: '#F9E79F', stroke: '#B7950B', 'stroke-width': 2 });
    // Rótulos
    const L = (x, y, t, xa, ya, anchor = 'end') => {
        A('line', { x1: x, y1: y, x2: xa, y2: ya, stroke: '#7F8C8D', 'stroke-width': 1.2 });
        label(A, anchor === 'end' ? x - 5 : x + 5, y + 5, t, { 'text-anchor': anchor, 'font-size': 15, 'font-weight': 400 });
    };
    L(120, 20, 'termómetro', x0 + 52, y0 - 40);
    L(400, 20, 'agitador', x0 + 152, y0 - 55, 'start');
    L(400, 75, 'tapa aislante', x0 + w + 20, y0 - 8, 'start');
    L(400, 130, 'pared aislante', x0 + w + 16, y0 + 70, 'start');
    L(400, 200, 'agua (masa conocida)', x0 + w - 20, y0 + 160, 'start');
    L(120, 270, 'reactivos', x0 + 90, y0 + 170);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photosynthesis and respiration</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 1150px; } svg text { font-family: "Segoe UI", Arial, sans-serif; } </style>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1>Photosynthesis and respiration: two opposite reactions</h1>
    <svg width="1090" height="400" viewBox="0 0 1090 400">
        <defs><marker id="g" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1E8449"/></marker>
            <marker id="r" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#C0392B"/></marker></defs>
        <rect x="40" y="140" width="250" height="120" rx="18" fill="#EAF2F8" stroke="#2471A3" stroke-width="3"/>
        <text x="165" y="195" text-anchor="middle" font-size="28" font-weight="800" fill="#2471A3">CO₂ + H₂O</text>
        <text x="165" y="228" text-anchor="middle" font-size="16" fill="#23373B">carbon dioxide + water</text>
        <rect x="800" y="140" width="250" height="120" rx="18" fill="#FEF9E7" stroke="#B7950B" stroke-width="3"/>
        <text x="925" y="195" text-anchor="middle" font-size="28" font-weight="800" fill="#9A7D0A">C₆H₁₂O₆ + O₂</text>
        <text x="925" y="228" text-anchor="middle" font-size="16" fill="#23373B">glucose + oxygen</text>
        <path d="M300 150 C450 90 640 90 790 150" fill="none" stroke="#1E8449" stroke-width="6" marker-end="url(#g)"/>
        <path d="M790 250 C640 310 450 310 300 250" fill="none" stroke="#C0392B" stroke-width="6" marker-end="url(#r)"/>
        <text x="545" y="40" text-anchor="middle" font-size="24" font-weight="800" fill="#1E8449">🌱 PHOTOSYNTHESIS</text>
        <text x="545" y="68" text-anchor="middle" font-size="17" fill="#23373B">plants ABSORB light energy ☀️ and store it in glucose</text>
        <text x="545" y="355" text-anchor="middle" font-size="24" font-weight="800" fill="#C0392B">🫁 CELLULAR RESPIRATION</text>
        <text x="545" y="385" text-anchor="middle" font-size="17" fill="#23373B">living things RELEASE the energy of glucose ⚡</text>
        <text x="545" y="205" text-anchor="middle" font-size="18" fill="#525252">The products of one are the reactants of the other</text>
    </svg>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collision theory</title>
<link rel="stylesheet" href="style.css">
<style>
    body { width: 1150px; }
    .row { display: flex; gap: 20px; }
    .c { flex: 1; border-radius: 16px; padding: 10px; text-align: center; border: 3px solid; }
    .ok { border-color: var(--green); background: var(--green-soft); } .ok h2 { color: var(--green); }
    .ko { border-color: var(--red); background: var(--red-soft); } .ko h2 { color: var(--red); }
    h2 { font-size: 22px; }
    .t { font-size: 16px; margin-top: 4px; }
    svg text { font-family: "Segoe UI", Arial, sans-serif; }
</style>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1>How does a reaction happen? Particles must collide!</h1>
    <div class="row">
        <div class="c ok"><h2>✔ Effective collision</h2><svg id="a" width="500" height="250"></svg>
            <div class="t">Enough energy + right direction:<br>bonds break and atoms <b>rearrange</b> into new molecules.</div></div>
        <div class="c ko"><h2>✘ Ineffective collision</h2><svg id="b" width="500" height="250"></svg>
            <div class="t">Too slow or wrong direction:<br>the molecules just <b>bounce off</b>. No reaction.</div></div>
    </div>
</div>
<script>
    const NS = 'http://www.w3.org/2000/svg';
    const H = '#FDFEFE', O = '#E74C3C';
    function mk(id) { const s = document.getElementById(id); return (tag, a, t) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (t !== undefined) e.textContent = t; s.appendChild(e); }; }
    const at = (add, x, y, c, r) => add('circle', { cx: x, cy: y, r, fill: c, stroke: '#23373B', 'stroke-width': 2 });
    const mol = (add, x, y, c, r) => { at(add, x - r * .8, y, c, r); at(add, x + r * .8, y, c, r); };
    const arr = (add, x1, y1, x2, y2) => { add('line', { x1, y1, x2, y2, stroke: '#23373B', 'stroke-width': 3 }); add('circle', { cx: x2, cy: y2, r: 4, fill: '#23373B' }); };
    let add = mk('a');
    mol(add, 50, 40, H, 14); mol(add, 50, 105, H, 14); arr(add, 80, 70, 120, 105); mol(add, 50, 195, O, 18); arr(add, 80, 185, 120, 150);
    add('text', { x: 160, y: 135, 'font-size': 44 }, '💥');
    add('text', { x: 255, y: 135, 'font-size': 34, fill: '#23373B' }, '➜');
    // water molecules
    [[360, 70], [430, 180]].forEach(([x, y]) => { at(add, x, y, O, 18); at(add, x - 22, y + 18, H, 13); at(add, x + 22, y + 18, H, 13); });
    add = mk('b');
    mol(add, 70, 70, H, 14); arr(add, 100, 80, 160, 115); mol(add, 70, 190, O, 18); arr(add, 100, 180, 150, 140);
    add('text', { x: 200, y: 135, 'font-size': 30, fill: '#7F8C8D' }, '↯');
    add('text', { x: 255, y: 135, 'font-size': 34, fill: '#23373B' }, '➜');
    mol(add, 380, 60, H, 14); arr(add, 410, 55, 460, 30); mol(add, 380, 195, O, 18); arr(add, 415, 200, 465, 225);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Distillation</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 1150px; } svg text { font-family: "Segoe UI", Arial, sans-serif; } </style>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1>Distillation: separating alcohol and water</h1>
    <svg width="1090" height="500" viewBox="0 0 1090 500">
        <defs><marker id="m" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#C0392B"/></marker>
            <marker id="b" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2471A3"/></marker></defs>
        <!-- flask -->
        <circle cx="170" cy="300" r="85" fill="#FDFEFE" stroke="#5D6D7E" stroke-width="4"/>
        <path d="M92 330 Q170 400 248 330 Z" fill="#D2B4DE"/>
        <rect x="155" y="130" width="30" height="95" fill="#FDFEFE" stroke="#5D6D7E" stroke-width="4"/>
        <rect x="158" y="112" width="24" height="18" fill="#7F8C8D"/>
        <text x="20" y="118" font-size="16" fill="#23373B">thermometer: 78 °C</text>
        <!-- heat -->
        <text x="170" y="460" text-anchor="middle" font-size="54">🔥</text>
        <!-- vapour inside -->
        <g fill="#F9E79F" stroke="#B7950B"><circle cx="150" cy="270" r="6"/><circle cx="185" cy="250" r="6"/><circle cx="168" cy="200" r="6"/><circle cx="170" cy="160" r="6"/></g>
        <!-- condenser -->
        <path d="M185 160 L760 330" stroke="#5D6D7E" stroke-width="16" stroke-linecap="round"/>
        <path d="M185 160 L760 330" stroke="#F9E79F" stroke-width="8" stroke-linecap="round"/>
        <path d="M300 160 L700 278 L690 312 L290 194 Z" fill="#AED6F1" fill-opacity=".7" stroke="#2471A3" stroke-width="3"/>
        <path d="M690 300 L720 230" stroke="#2471A3" stroke-width="4" marker-end="url(#b)"/>
        <path d="M330 120 L300 180" stroke="#2471A3" stroke-width="4" marker-end="url(#b)"/>
        <text x="720" y="215" font-size="16" fill="#2471A3" font-weight="700">cold water out</text>
        <text x="270" y="110" font-size="16" fill="#2471A3" font-weight="700">cold water in</text>
        <!-- drops and collecting flask -->
        <g fill="#F4D03F"><ellipse cx="770" cy="360" rx="5" ry="8"/><ellipse cx="770" cy="385" rx="5" ry="8"/></g>
        <path d="M720 400 L720 470 Q720 480 730 480 L810 480 Q820 480 820 470 L820 400" fill="none" stroke="#5D6D7E" stroke-width="4"/>
        <rect x="722" y="440" width="96" height="38" fill="#F9E79F"/>
        <!-- step labels -->
        <g font-size="18">
            <rect x="20" y="20" width="250" height="60" rx="10" fill="#FDEDEC" stroke="#C0392B" stroke-width="2"/>
            <text x="35" y="45" font-weight="800" fill="#C0392B">① Heat the mixture</text><text x="35" y="68" font-size="15" fill="#23373B">alcohol boils first (78 °C)</text>
            <rect x="420" y="20" width="300" height="60" rx="10" fill="#EAF2F8" stroke="#2471A3" stroke-width="2"/>
            <text x="435" y="45" font-weight="800" fill="#2471A3">② The vapour cools down</text><text x="435" y="68" font-size="15" fill="#23373B">in the condenser and becomes liquid</text>
            <rect x="840" y="400" width="230" height="60" rx="10" fill="#FEF9E7" stroke="#B7950B" stroke-width="2"/>
            <text x="855" y="425" font-weight="800" fill="#9A7D0A">③ Collect it</text><text x="855" y="448" font-size="15" fill="#23373B">the DISTILLATE (alcohol)</text>
            <text x="20" y="420" font-size="15" fill="#6C3483" font-weight="700">water stays</text><text x="20" y="440" font-size="15" fill="#6C3483" font-weight="700">in the flask</text>
        </g>
    </svg>
</div>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ejemplo resuelto 1</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="steps.css">
<script src="lab_es.js"></script>
<style> .legend { margin-top: 12px; display: flex; justify-content: center; gap: 22px; font-size: 16px; } .legend span { display: inline-block; color: #fff; font-weight: 800; border-radius: 6px; padding: 1px 8px; margin-right: 6px; } </style>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1></h1>
    <div class="prop" id="prop"></div>
    <div class="row" id="row"></div>
    <div class="legend">
        <div><span style="background:#1E8449">✔ GUARDAR</span>lo que queremos obtener</div>
        <div><span style="background:#2471A3">→ SIGUIENTE</span>pasa al siguiente paso</div>
        <div><span style="background:#C0392B">✘ DESECHAR</span>no lo necesitamos</div>
    </div>
</div>
<script>
const sandP = rnd(30,75,185,160,182,9), saltP = rnd(18,75,185,150,182,4), fil = rnd(10,80,180,150,180,5);
buildSteps('Ejemplo resuelto 1: arena + sal + limaduras de hierro', 'obtener los <b>tres</b> componentes', 'arena, sal y limaduras de hierro', [
  [beaker(70,110,120,80,[[30,C.sand]]) + dots(saltP,3,C.salt,'#7F8C8D') + filings(fil) + magnet(100,20,0.8) + filings([[104,78],[140,78]]) +
   tag(205,40,'keep','✔ hierro'),
   '<b>Separación magnética</b>: el imán saca las limaduras de hierro.'],
  [beaker(70,60,120,130,[[30,C.sand],[60,C.water]]) + dots(rnd(10,80,180,110,150,2),2.5,'#fff','#2471A3') +
   `<line x1="150" y1="30" x2="120" y2="170" stroke="#7F8C8D" stroke-width="6" stroke-linecap="round"/>`,
   'Añade <b>agua</b> y remueve: la sal se <b>disuelve</b> y la arena no.'],
  [funnel(100,15,dots([[90,45],[102,52],[110,44],[98,40]],6,C.sandDark)) + `<ellipse cx="100" cy="132" rx="4" ry="7" fill="#5DADE2"/>` +
   beaker(55,145,90,60,[[30,C.water]]) + tag(200,45,'keep','✔ arena') + T(200,64,'residuo',{fs:12,fw:400}) +
   tag(200,170,'next','→ agua salada') + T(200,189,'filtrado',{fs:12,fw:400}),
   '<b>Filtración</b>: la arena (residuo) se queda en el papel; el agua salada (filtrado) sigue.'],
  [dish(130,90,150,'none', `<g fill="#fff" stroke="#7F8C8D" stroke-width="2"><rect x="100" y="102" width="14" height="14" transform="rotate(15 107 109)"/><rect x="125" y="108" width="14" height="14"/><rect x="150" y="102" width="14" height="14" transform="rotate(-20 157 109)"/></g>`) +
   vapour(100,70) + tag(130,165,'keep','✔ sal') + tag(130,195,'out','✘ agua (se evapora)'),
   '<b>Evaporación</b>: el agua se evapora y quedan los cristales de sal.'],
], 'Objetivo');
</script>
</body>
</html>

<meta charset="utf-8">
<title>Evaporation and crystallisation</title>

<link rel="stylesheet" href="steps.css">

<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1></h1>
    <div class="prop" id="prop"></div>
    <div class="row" id="row"></div>
</div>
<script>
buildSteps('How to separate by evaporation and crystallisation', 'the <b>boiling point</b>: the water evaporates, the salt does not', 'salt dissolved in water', [
  [`<g transform="rotate(-35 205 40)">${beaker(180,0,50,60,[[35,C.water]])}</g>` + arrowD(185,55,160,75) + dish(120,90,150,C.water) + T(110,160,'evaporating dish',{fs:13,fw:400}),
   'Pour the salt water into an <b>evaporating dish</b>.'],
  [dish(130,80,150,C.water2) + vapour(100,70) + tripod(130,110) + burner(130,150),
   '<b>Heat</b> it gently (or leave it in a sunny place): the water <b>evaporates</b>.'],
  [dish(130,80,150,'none', `<g fill="#fff" stroke="#7F8C8D" stroke-width="2"><rect x="100" y="92" width="14" height="14" transform="rotate(15 107 99)"/><rect x="125" y="98" width="14" height="14"/><rect x="150" y="92" width="14" height="14" transform="rotate(-20 157 99)"/></g>`) +
   tag(130,60,'keep','✔ salt crystals') + tag(130,170,'out','✘ the water is lost'),
   'The <b>salt crystals</b> remain in the dish. Slow evaporation gives bigger crystals.'],
]);
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Worked example 2</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="steps.css">
<script src="lab.js"></script>
<style> .legend { margin-top: 12px; display: flex; justify-content: center; gap: 22px; font-size: 16px; } .legend span { display: inline-block; color: #fff; font-weight: 800; border-radius: 6px; padding: 1px 8px; margin-right: 6px; } </style>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1></h1>
    <div class="prop" id="prop"></div>
    <div class="row" id="row"></div>
    <div class="legend">
        <div><span style="background:#1E8449">✔ KEEP</span>what we want to obtain</div>
        <div><span style="background:#2471A3">→ NEXT</span>goes on to the next step</div>
        <div><span style="background:#C0392B">✘ DISCARD</span>we do not need it</div>
    </div>
</div>
<script>
const sand = rnd(30,75,185,165,186,9);
buildSteps('Worked example 2: muddy, oily water (sand + oil + water)', 'to obtain <b>clean water</b>', 'sand, oil and water', [
  [beaker(70,60,120,130,[[22,C.sand],[60,C.water],[18,C.oil]]) + T(215,72,'oil',{c:'#B7950B',fs:13}) + T(215,125,'water',{c:C.blue,fs:13}) + T(215,178,'sand',{c:C.sandDark,fs:13}),
   'The mixture has <b>three</b> components: a solid and two liquids that do not mix.'],
  [funnel(110,15,dots([[100,45],[112,52],[120,44],[108,40]],6,C.sandDark)) + `<ellipse cx="110" cy="132" rx="4" ry="7" fill="#5DADE2"/>` +
   beaker(65,145,90,60,[[22,C.water],[12,C.oil]]) + tag(205,45,'out','✘ sand') + T(205,64,'residue',{fs:12,fw:400}) +
   tag(212,170,'next','→ oil + water') + T(205,189,'filtrate',{fs:12,fw:400}),
   '<b>Filtration</b> first: the sand stays on the paper. We do not need it.'],
  [sepFunnel(110,20,C.oil,C.water,40,62,false) + T(205,70,'oil',{c:'#B7950B'}) + T(205,120,'water',{c:C.blue}),
   'Pour the filtrate into a <b>separating funnel</b> and wait: two layers form.'],
  [sepFunnel(110,10,C.oil,C.water,40,24,true) + `<ellipse cx="110" cy="164" rx="4" ry="7" fill="#5DADE2"/>` + beaker(70,160,80,45,[[25,C.water]]) +
   tag(205,185,'keep','✔ water') + tag(205,40,'out','✘ oil') + T(205,60,'(recycling point)',{fs:12,fw:400}),
   '<b>Decantation</b>: the water comes out through the tap. The oil goes to a recycling point.'],
], 'Goal');
</script>
</body>
</html>

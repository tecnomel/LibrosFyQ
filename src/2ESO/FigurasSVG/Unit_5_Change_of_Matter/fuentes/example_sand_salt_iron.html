<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Worked example 1</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="steps.css">
<script src="lab.js"></script>
<style> .legend { margin-top: 12px; display: flex; justify-content: center; gap: 22px; font-size: 16px; } .legend span { display: inline-block; color: #fff; font-weight: 800; border-radius: 6px; padding: 1px 8px; margin-right: 6px; } </style>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1></h1>
    <div class="prop" id="prop"></div>
    <div class="row" id="row"></div>
    <div class="legend">
        <div><span style="background:#1E8449">✔ KEEP</span>what we want to obtain</div>
        <div><span style="background:#2471A3">→ NEXT</span>goes on to the next step</div>
        <div><span style="background:#C0392B">✘ DISCARD</span>we do not need it</div>
    </div>
</div>
<script>
const sandP = rnd(30,75,185,160,182,9), saltP = rnd(18,75,185,150,182,4), fil = rnd(10,80,180,150,180,5);
buildSteps('Worked example 1: sand + salt + iron filings', 'we want to obtain the <b>three</b> components', 'sand, salt and iron filings', [
  [beaker(70,110,120,80,[[30,C.sand]]) + dots(saltP,3,C.salt,'#7F8C8D') + filings(fil) + magnet(100,20,0.8) + filings([[104,78],[140,78]]) +
   tag(200,40,'keep','✔ iron'),
   '<b>Magnetic separation</b>: the magnet takes out the iron filings.'],
  [beaker(70,60,120,130,[[30,C.sand],[60,C.water]]) + dots(rnd(10,80,180,110,150,2),2.5,'#fff','#2471A3') +
   `<line x1="150" y1="30" x2="120" y2="170" stroke="#7F8C8D" stroke-width="6" stroke-linecap="round"/>`,
   'Add <b>water</b> and stir: the salt <b>dissolves</b>, the sand does not.'],
  [funnel(110,15,dots([[100,45],[112,52],[120,44],[108,40]],6,C.sandDark)) + `<ellipse cx="110" cy="132" rx="4" ry="7" fill="#5DADE2"/>` +
   beaker(65,145,90,60,[[30,C.water]]) + tag(205,45,'keep','✔ sand') + T(205,64,'residue',{fs:12,fw:400}) +
   tag(212,170,'next','→ salt water') + T(205,189,'filtrate',{fs:12,fw:400}),
   '<b>Filtration</b>: the sand (residue) stays on the paper; the salt water (filtrate) goes on.'],
  [dish(130,90,150,'none', `<g fill="#fff" stroke="#7F8C8D" stroke-width="2"><rect x="100" y="102" width="14" height="14" transform="rotate(15 107 109)"/><rect x="125" y="108" width="14" height="14"/><rect x="150" y="102" width="14" height="14" transform="rotate(-20 157 109)"/></g>`) +
   vapour(100,70) + tag(130,165,'keep','✔ salt') + tag(130,195,'out','✘ water (evaporates)'),
   '<b>Evaporation</b>: the water evaporates and the salt crystals remain.'],
], 'Goal');
</script>
</body>
</html>

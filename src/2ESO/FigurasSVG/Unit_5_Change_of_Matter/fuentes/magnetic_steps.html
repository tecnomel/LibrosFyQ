<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magnetic separation</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="steps.css">
<script src="lab.js"></script>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1></h1>
    <div class="prop" id="prop"></div>
    <div class="row" id="row"></div>
</div>
<script>
const fil = rnd(16,60,200,150,180,5), saw = rnd(16,60,200,150,182,11);
buildSteps('How to separate with a magnet', '<b>magnetism</b>: only some metals (iron, nickel, cobalt) are attracted', 'iron filings + sawdust', [
  [`<rect x="40" y="185" width="180" height="8" fill="#ECF0F1" stroke="#BDC3C7"/>` + chips(saw) + filings(fil) + T(130,120,'iron filings + sawdust'),
   'Spread the mixture on a sheet of paper.'],
  [`<rect x="40" y="185" width="180" height="8" fill="#ECF0F1" stroke="#BDC3C7"/>` + chips(saw) + filings(fil.slice(8)) +
   magnet(100,40) + `<rect x="95" y="35" width="70" height="95" rx="10" fill="none" stroke="#85929E" stroke-width="2" stroke-dasharray="5 3"/>` +
   filings([[103,108],[112,114],[150,108],[158,114]]) + arrowD(200,90,170,90) + T(205,70,'move it',{fs:13,fw:400,a:'start'}),
   'Pass a magnet (wrapped in a plastic bag) <b>over</b> the mixture, without touching it.'],
  [magnet(40,30,0.8) + filings([[42,92],[50,98],[78,92],[86,98],[60,100]]) + tag(70,130,'keep','✔ iron') +
   `<rect x="120" y="185" width="120" height="8" fill="#ECF0F1" stroke="#BDC3C7"/>` + chips(rnd(12,130,230,155,182,11)) + tag(180,140,'keep','✔ sawdust'),
   'The <b>iron</b> sticks to the magnet; the sawdust stays on the paper. Remove the bag to drop the iron.'],
]);
</script>
</body>
</html>

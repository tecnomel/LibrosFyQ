<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cambio químico</title>
<link rel="stylesheet" href="style.css">
<style>
    body { width: 900px; }
    .row { display: flex; gap: 22px; }
    .p { flex: 1; border-radius: 16px; padding: 12px 14px; border: 3px solid; }
    .ph { border-color: #2471A3; background: #EAF2F8; } .ph h2 { color: #2471A3; }
    .ch { border-color: var(--red); background: var(--red-soft); } .ch h2 { color: var(--red); }
    h2 { font-size: 23px; text-align: center; }
    .k { text-align: center; font-size: 16px; color: var(--grey); margin-bottom: 8px; }
    .ex { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .ex div { background: #fff; border-radius: 10px; padding: 6px; text-align: center; font-size: 15px; }
    .ex .ic { font-size: 36px; display: block; line-height: 1.2; }
</style>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <div class="row">
        <div class="p ch"><h2>Cambio químico</h2><div class="k">Aparecen sustancias NUEVAS (fórmula distinta)</div>
            <div class="ex"><div><span class="ic">🪵🔥</span>quemar madera</div><div><span class="ic">🔩🟤</span>un clavo que se oxida</div>
                <div><span class="ic">🍳</span>freír un huevo</div><div><span class="ic">🍞</span>hornear pan</div></div></div>
    </div>
</div>
</body>
</html>

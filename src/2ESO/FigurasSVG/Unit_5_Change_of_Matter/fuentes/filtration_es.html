<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Filtración</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 1100px; } svg text { font-family: "Segoe UI", Arial, sans-serif; } </style>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1>La filtración paso a paso</h1>
    <svg width="1040" height="500" viewBox="0 0 1040 500">
        <!-- stand -->
        <rect x="120" y="470" width="300" height="14" fill="#7F8C8D"/><rect x="140" y="40" width="12" height="440" fill="#7F8C8D"/><rect x="146" y="150" width="140" height="10" fill="#7F8C8D"/>
        <!-- beaker with mixture being poured -->
        <g transform="rotate(-35 360 70)"><rect x="330" y="20" width="80" height="100" fill="#D6EAF8" stroke="#5D6D7E" stroke-width="4"/><rect x="332" y="60" width="76" height="58" fill="#A9927D"/></g>
        <path d="M318 88 Q300 105 300 125" stroke="#A9927D" stroke-width="7" fill="none"/>
        <!-- funnel -->
        <path d="M200 130 L300 130 L262 220 L262 290 L238 290 L238 220 Z" fill="#FDFEFE" stroke="#5D6D7E" stroke-width="4"/>
        <path d="M210 136 L290 136 L252 215 L248 215 Z" fill="#FBEEE6" stroke="#B9770E" stroke-width="2" stroke-dasharray="6 4"/>
        <g fill="#A04000"><circle cx="240" cy="190" r="6"/><circle cx="256" cy="186" r="6"/><circle cx="248" cy="202" r="6"/><circle cx="232" cy="176" r="5"/><circle cx="264" cy="172" r="5"/></g>
        <!-- drops -->
        <g fill="#5DADE2"><ellipse cx="250" cy="310" rx="5" ry="8"/><ellipse cx="250" cy="340" rx="5" ry="8"/></g>
        <!-- collecting beaker -->
        <path d="M180 360 L180 460 L320 460 L320 360" fill="none" stroke="#5D6D7E" stroke-width="4"/><rect x="182" y="410" width="136" height="48" fill="#AED6F1"/>
        <!-- labels -->
        <g font-size="22" font-weight="800">
            <line x1="270" y1="180" x2="560" y2="160" stroke="#B9770E" stroke-width="2"/><text x="570" y="150" fill="#B9770E">Papel de filtro</text><text x="570" y="176" font-size="17" font-weight="400" fill="#23373B">tiene agujeros diminutos, como un tamiz muy fino</text>
            <line x1="258" y1="195" x2="560" y2="245" stroke="#A04000" stroke-width="2"/><text x="570" y="240" fill="#A04000">RESIDUO (sólido)</text><text x="570" y="266" font-size="17" font-weight="400" fill="#23373B">las partículas demasiado grandes para pasar</text><text x="570" y="288" font-size="17" font-weight="400" fill="#23373B">se quedan en el papel</text>
            <line x1="300" y1="430" x2="560" y2="400" stroke="#2471A3" stroke-width="2"/><text x="570" y="395" fill="#2471A3">FILTRADO (líquido)</text><text x="570" y="421" font-size="17" font-weight="400" fill="#23373B">el líquido atraviesa el papel y se recoge</text>
            <line x1="290" y1="140" x2="560" y2="80" stroke="#5D6D7E" stroke-width="2"/><text x="570" y="75" fill="#5D6D7E">Embudo</text>
        </g>
    </svg>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chemical change</title>
<link rel="stylesheet" href="style.css">
<style>
    body { width: 900px; }
    .row { display: flex; gap: 22px; }
    .p { flex: 1; border-radius: 16px; padding: 12px 14px; border: 3px solid; }
    .ph { border-color: #2471A3; background: #EAF2F8; } .ph h2 { color: #2471A3; }
    .ch { border-color: var(--red); background: var(--red-soft); } .ch h2 { color: var(--red); }
    h2 { font-size: 23px; text-align: center; }
    .k { text-align: center; font-size: 16px; color: var(--grey); margin-bottom: 8px; }
    .ex { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .ex div { background: #fff; border-radius: 10px; padding: 6px; text-align: center; font-size: 15px; }
    .ex .ic { font-size: 36px; display: block; line-height: 1.2; }
    h3 { font-size: 22px; color: var(--teal); margin: 16px 0 8px; text-align: center; }
    .signs { display: flex; gap: 12px; }
    .s { flex: 1; text-align: center; border-radius: 14px; padding: 8px; background: #FEF9E7; border: 2px solid #B7950B; font-size: 15px; }
    .s .ic { font-size: 40px; display: block; line-height: 1.2; }
    .s b { display: block; font-size: 16px; color: #7D6608; }
</style>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <div class="row">
        <div class="p ch"><h2>Chemical change</h2><div class="k">NEW substances appear (different formula)</div>
            <div class="ex"><div><span class="ic">🪵🔥</span>burning wood</div><div><span class="ic">🔩🟤</span>a nail rusting</div>
                <div><span class="ic">🍳</span>frying an egg</div><div><span class="ic">🍞</span>baking bread</div></div></div>
    </div>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Substances and mixtures with particles</title>
<link rel="stylesheet" href="style.css">
<style>
    body { width: 1150px; }
    .row { display: flex; gap: 20px; }
    .c { flex: 1; text-align: center; }
    .c h2 { font-size: 24px; color: var(--teal); }
    .leg { margin-top: 10px; text-align: center; font-size: 17px; }
    .dot { display: inline-block; width: 18px; height: 18px; border-radius: 50%; vertical-align: middle; margin: 0 4px 0 14px; border: 1.5px solid #23373B; }
</style>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1>Look at the particles!</h1>
    <div class="row">
        <div class="c"><h2>A</h2><svg id="a" width="330" height="250"></svg></div>
        <div class="c"><h2>B</h2><svg id="b" width="330" height="250"></svg></div>
        <div class="c"><h2>C</h2><svg id="c" width="330" height="250"></svg></div>
    </div>
    <div class="leg"><span class="dot" style="background:#F39C12"></span>nitrogen atom (N)<span class="dot" style="background:#58D68D"></span>chlorine atom (Cl)</div>
</div>
<script>
    const NS = 'http://www.w3.org/2000/svg';
    const N = '#F39C12', CL = '#58D68D';
    function frame(id) {
        const s = document.getElementById(id);
        const add = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); s.appendChild(e); };
        add('rect', { x: 8, y: 8, width: 314, height: 234, rx: 12, fill: '#FBFCFC', stroke: '#5D6D7E', 'stroke-width': 3 });
        return add;
    }
    const atom = (add, x, y, c, r) => add('circle', { cx: x, cy: y, r: r || 14, fill: c, stroke: '#23373B', 'stroke-width': 1.5 });
    const n2 = (add, x, y) => { atom(add, x - 12, y, N); atom(add, x + 12, y, N); };
    const cl2 = (add, x, y) => { atom(add, x - 13, y, CL, 15); atom(add, x + 13, y, CL, 15); };
    const ncl3 = (add, x, y) => { atom(add, x, y + 16, CL, 15); atom(add, x - 24, y - 10, CL, 15); atom(add, x + 24, y - 10, CL, 15); atom(add, x, y, N); };
    const pos = [[70, 60], [190, 50], [270, 110], [110, 140], [220, 190], [70, 205], [160, 95]];
    let add = frame('a'); pos.forEach(([x, y]) => n2(add, x, y));
    add = frame('b'); [[75, 65], [200, 60], [120, 160], [250, 170], [270, 110]].forEach(([x, y]) => ncl3(add, x, y));
    add = frame('c'); pos.forEach(([x, y], i) => (i % 2 ? cl2 : n2)(add, x, y));
</script>
</body>
</html>

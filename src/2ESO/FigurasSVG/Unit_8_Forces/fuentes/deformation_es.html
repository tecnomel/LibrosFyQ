<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fuerzas y deformación</title>
<link rel="stylesheet" href="style.css">
<style>
    body { width: 1150px; }
    .row { display: flex; gap: 14px; }
    .c { flex: 1; text-align: center; border-radius: 16px; padding: 10px; border: 2px solid var(--line); }
    .c .ic { font-size: 50px; line-height: 1.2; }
    .c h2 { font-size: 20px; color: var(--blue); }
    .c .t { font-size: 15px; color: var(--grey); }
    svg text { font-family: "Segoe UI", Arial, sans-serif; }
    .bot { display: flex; gap: 20px; margin-top: 14px; align-items: center; }
</style>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1>¿Cómo reaccionan los cuerpos ante una fuerza que los deforma?</h1>
    <div class="row">
        <div class="c"><div class="ic">🪨</div><h2>Rígidos</h2><div class="t">no se deforman (a no ser que se rompan)</div></div>
        <div class="c"><div class="ic">🏹 🧽</div><h2>Elásticos</h2><div class="t">se deforman y <b>recuperan</b> su forma</div></div>
        <div class="c"><div class="ic">🧱 🍡</div><h2>Plásticos</h2><div class="t">se deforman y <b>se quedan</b> deformados (arcilla, plastilina)</div></div>
    </div>
    <div class="bot">
        <svg id="sp" width="420" height="300"></svg>
        <svg id="gr" width="600" height="300"></svg>
    </div>
</div>
<script>
    const NS = 'http://www.w3.org/2000/svg';
    const mk = id => { const s = document.getElementById(id); return (tag, a, t) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (t !== undefined) e.textContent = t; s.appendChild(e); }; };
    let add = mk('sp');
    add('rect', { x: 20, y: 10, width: 380, height: 16, fill: '#7F8C8D' });
    function spring(x, len, w) {
        let d = `M${x} 26 L${x} 40`; const n = 10, step = (len - 30) / n;
        for (let i = 0; i < n; i++) d += ` L${x + (i % 2 ? -18 : 18)} ${40 + step * (i + .5)}`;
        d += ` L${x} ${len + 10} L${x} ${len + 26}`;
        add('path', { d, fill: 'none', stroke: '#2471A3', 'stroke-width': 3 });
        if (w) { add('rect', { x: x - 22, y: len + 26, width: 44, height: 34, rx: 4, fill: '#C0392B' }); add('text', { x, y: len + 49, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 800, fill: '#fff' }, w); }
    }
    spring(80, 110); spring(200, 160, '1 N'); spring(320, 210, '2 N');
    add('text', { x: 80, y: 160, 'text-anchor': 'middle', 'font-size': 14, fill: '#525252' }, 'L₀');
    add('text', { x: 210, y: 290, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 700, fill: '#23373B' }, 'doble fuerza → doble alargamiento');
    add = mk('gr');
    add('line', { x1: 70, y1: 250, x2: 560, y2: 250, stroke: '#23373B', 'stroke-width': 2.5 });
    add('line', { x1: 70, y1: 250, x2: 70, y2: 20, stroke: '#23373B', 'stroke-width': 2.5 });
    add('text', { x: 555, y: 280, 'text-anchor': 'end', 'font-size': 17, 'font-weight': 700 }, 'alargamiento ΔL');
    add('text', { x: 20, y: 18, 'font-size': 17, 'font-weight': 700 }, 'fuerza F');
    add('line', { x1: 70, y1: 250, x2: 380, y2: 80, stroke: '#2471A3', 'stroke-width': 5 });
    add('path', { d: 'M380 80 Q440 50 520 45', fill: 'none', stroke: '#C0392B', 'stroke-width': 5, 'stroke-dasharray': '10 6' });
    add('circle', { cx: 380, cy: 80, r: 8, fill: '#C0392B' });
    add('text', { x: 395, y: 112, 'text-anchor': 'start', 'font-size': 15, 'font-weight': 700, fill: '#C0392B' }, 'límite de elasticidad');
    add('text', { x: 95, y: 55, 'font-size': 24, 'font-weight': 800, fill: '#2471A3' }, 'F = k · ΔL');
    add('text', { x: 95, y: 80, 'font-size': 15, fill: '#23373B' }, 'Ley de Hooke: una línea recta');
</script>
</body>
</html>

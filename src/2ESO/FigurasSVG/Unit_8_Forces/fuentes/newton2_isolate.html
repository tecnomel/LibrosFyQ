<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Isolating m and a</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="isolate.css">
<script src="isolate.js"></script>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1></h1>
    <div class="grid" id="grid"></div>
    <div class="tip" id="tip"></div>
</div>
<script>
buildIsolate('Newton’s second law: how to isolate m and a in F = m · a', [
    { goal: 'm', steps: [
        ['Write the law.', `F = ${g('m')} · a`],
        [`<b>a</b> is <b>multiplying</b> ${g('m')}: divide <b>both sides</b> by a.`, `${f('F', o('a'))} = ${f(`${g('m')} · ${c('a')}`, o(c('a')))}`]],
      result: `${g('m')} = ${f('F', 'a')}` },
    { goal: 'a', steps: [
        ['Write the law.', `F = m · ${g('a')}`],
        [`<b>m</b> is <b>multiplying</b> ${g('a')}: divide <b>both sides</b> by m.`, `${f('F', o('m'))} = ${f(`${c('m')} · ${g('a')}`, o(c('m')))}`]],
      result: `${g('a')} = ${f('F', 'm')}` },
], '<b>Shortcut:</b> what is <b>multiplying</b> on one side goes to the other side <b>dividing</b>.');
</script>
</body>
</html>

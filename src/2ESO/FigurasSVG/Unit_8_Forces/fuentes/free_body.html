<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forces on a box</title>
<link rel="stylesheet" href="style.css">
<style>
    body { width: 1100px; }
    .row { display: flex; gap: 20px; align-items: center; }
    svg text { font-family: "Segoe UI", Arial, sans-serif; }
    .side { flex: 1; font-size: 17px; }
    .side div { border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; background: #F4F6F7; }
</style>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1>Forces acting on a box that is being pushed</h1>
    <div class="row">
        <svg width="600" height="460" viewBox="0 0 600 460">
            <defs>
                <marker id="r" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#C0392B"/></marker>
                <marker id="b" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2471A3"/></marker>
                <marker id="o" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#E67E22"/></marker>
                <marker id="v" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8E44AD"/></marker>
                <pattern id="h" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="16" stroke="#7F8C8D" stroke-width="3"/></pattern>
            </defs>
            <rect x="20" y="320" width="560" height="30" fill="url(#h)"/>
            <line x1="20" y1="320" x2="580" y2="320" stroke="#23373B" stroke-width="4"/>
            <rect x="200" y="200" width="200" height="120" rx="8" fill="#D7BDA6" stroke="#7E5109" stroke-width="3"/>
            <text x="300" y="250" text-anchor="middle" font-size="22" font-weight="700" fill="#7E5109">📦 box</text>
            <line x1="300" y1="320" x2="300" y2="430" stroke="#C0392B" stroke-width="6" marker-end="url(#r)"/>
            <text x="335" y="400" font-size="20" font-weight="800" fill="#C0392B">W (weight)</text>
            <line x1="300" y1="200" x2="300" y2="50" stroke="#2471A3" stroke-width="6" marker-end="url(#b)"/>
            <text x="335" y="100" font-size="20" font-weight="800" fill="#2471A3">N (normal force)</text>
            <line x1="400" y1="260" x2="560" y2="260" stroke="#E67E22" stroke-width="6" marker-end="url(#o)"/>
            <text x="420" y="235" font-size="20" font-weight="800" fill="#E67E22">F (push)</text>
            <line x1="200" y1="300" x2="70" y2="300" stroke="#8E44AD" stroke-width="6" marker-end="url(#v)"/>
            <text x="40" y="265" font-size="20" font-weight="800" fill="#8E44AD">f (friction)</text>
        </svg>
        <div class="side">
            <div><b style="color:#C0392B">W</b>: the Earth pulls the box down.</div>
            <div><b style="color:#2471A3">N</b>: the floor pushes the box up.</div>
            <div><b style="color:#E67E22">F</b>: we push the box.</div>
            <div><b style="color:#8E44AD">f</b>: friction always acts <b>against</b> the motion.</div>
            <div style="background:var(--green-soft)">If F = f, the net force is 0: the box moves at constant speed (or stays still).</div>
        </div>
    </div>
</div>
</body>
</html>

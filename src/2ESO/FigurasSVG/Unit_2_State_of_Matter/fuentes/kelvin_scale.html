<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Celsius and Kelvin</title>
<link rel="stylesheet" href="style.css">
<style>
    body { width: 1100px; }
    .row { display: flex; gap: 40px; align-items: center; }
    svg text { font-family: "Segoe UI", Arial, sans-serif; }
    .side { flex: 1; font-size: 20px; }
    .rule { border-radius: 14px; padding: 14px 18px; margin-bottom: 14px; background: var(--blue-soft); border: 2px solid var(--blue); text-align: center; }
    .rule .f { font-size: 30px; font-weight: 800; color: var(--blue); margin: 6px 0; }
    .ex { font-size: 18px; background: #F4F6F7; border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; }
    .warn { font-size: 17px; color: var(--red); font-weight: 700; }
</style>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1>Two temperature scales: Celsius and Kelvin</h1>
    <div class="row">
        <svg width="480" height="500" viewBox="0 0 480 500" id="t"></svg>
        <div class="side">
            <div class="rule">To change from °C to K:<div class="f">T(K) = T(°C) + 273</div></div>
            <div class="ex">🌡️ 20 °C → 20 + 273 = <b>293 K</b></div>
            <div class="ex">🧊 −10 °C → −10 + 273 = <b>263 K</b></div>
            <div class="warn">⚠ In the gas laws, temperature must ALWAYS be in kelvin.</div>
            <div class="note" style="margin-top:10px">0 K (−273 °C) is the <b>absolute zero</b>: the coldest possible temperature, where particles stop moving.</div>
        </div>
    </div>
</div>
<script>
    const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('t');
    const add = (tag, a, t) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (t !== undefined) e.textContent = t; svg.appendChild(e); return e; };
    // y for a Celsius value: 100 °C at y=60, -273 °C at y=440
    const y = c => 60 + (100 - c) * (380 / 373);
    function thermo(x, title, color, unit, off) {
        add('text', { x, y: 30, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 800, fill: color }, title);
        add('rect', { x: x - 14, y: 45, width: 28, height: 410, rx: 14, fill: '#fff', stroke: '#525252', 'stroke-width': 3 });
        add('rect', { x: x - 7, y: y(20), width: 14, height: 455 - y(20), fill: '#E74C3C' });
        add('circle', { cx: x, cy: 466, r: 22, fill: '#E74C3C', stroke: '#525252', 'stroke-width': 3 });
        [[100, '💧→♨️ water boils'], [20, '🌡️ room'], [0, '🧊 water freezes'], [-273, '❄️ absolute zero']].forEach(([c, lab]) => {
            add('line', { x1: x - 24, x2: x + 24, y1: y(c), y2: y(c), stroke: '#23373B', 'stroke-width': 2 });
            add('text', { x: x + off, y: y(c) + 7, 'text-anchor': off > 0 ? 'start' : 'end', 'font-size': 20, 'font-weight': 800, fill: color }, (unit === 'C' ? c : c + 273) + (unit === 'C' ? ' °C' : ' K'));
        });
    }
    thermo(140, 'Celsius', '#2471A3', 'C', -32);
    thermo(330, 'Kelvin', '#C0392B', 'K', 32);
    [[100, 'boils'], [20, 'room'], [0, 'freezes'], [-273, 'zero']].forEach(([c, lab]) => {
        add('line', { x1: 160, x2: 310, y1: y(c), y2: y(c), stroke: '#AAB7B8', 'stroke-width': 1.5, 'stroke-dasharray': '6 5' });
        add('text', { x: 235, y: y(c) - 6, 'text-anchor': 'middle', 'font-size': 14, fill: '#525252' }, { boils: '💧 water boils', room: 'room', freezes: '🧊 water freezes', zero: 'absolute zero' }[lab]);
    });
</script>
</body>
</html>

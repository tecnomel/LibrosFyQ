<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Despejar en la ley de Boyle-Mariotte</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="isolate.css">
<script src="isolate_es.js"></script>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1></h1>
    <div class="grid" id="grid"></div>
    <div class="tip" id="tip"></div>
</div>
<script>
const p1 = q('p', 1), V1 = q('V', 1), p2 = q('p', 2), V2 = q('V', 2);
const F = `${p1} · ${V1} = ${p2} · ${V2}`;
buildIsolate('Ley de Boyle-Mariotte: cómo despejar cada magnitud', [
    { goal: V2, steps: [
        ['Escribe la ley.', F],
        [`${p2} está <b>multiplicando</b> a ${g(V2)}: divide <b>los dos lados</b> entre ${p2}.`, `${f(`${p1} · ${V1}`, o(p2))} = ${f(`${c(p2)} · ${g(V2)}`, o(c(p2)))}`]],
      result: `${g(V2)} = ${f(`${p1} · ${V1}`, p2)}` },
    { goal: p2, steps: [
        ['Escribe la ley.', F],
        [`${V2} está <b>multiplicando</b> a ${g(p2)}: divide <b>los dos lados</b> entre ${V2}.`, `${f(`${p1} · ${V1}`, o(V2))} = ${f(`${g(p2)} · ${c(V2)}`, o(c(V2)))}`]],
      result: `${g(p2)} = ${f(`${p1} · ${V1}`, V2)}` },
    { goal: V1, steps: [
        ['Escribe la ley.', F],
        [`${p1} está <b>multiplicando</b> a ${g(V1)}: divide <b>los dos lados</b> entre ${p1}.`, `${f(`${c(p1)} · ${g(V1)}`, o(c(p1)))} = ${f(`${p2} · ${V2}`, o(p1))}`]],
      result: `${g(V1)} = ${f(`${p2} · ${V2}`, p1)}` },
    { goal: p1, steps: [
        ['Escribe la ley.', F],
        [`${V1} está <b>multiplicando</b> a ${g(p1)}: divide <b>los dos lados</b> entre ${V1}.`, `${f(`${g(p1)} · ${c(V1)}`, o(c(V1)))} = ${f(`${p2} · ${V2}`, o(V1))}`]],
      result: `${g(p1)} = ${f(`${p2} · ${V2}`, V1)}` },
], '<b>Truco:</b> lo que está <b>multiplicando</b> en un lado pasa al otro lado <b>dividiendo</b>.');
</script>
</body>
</html>

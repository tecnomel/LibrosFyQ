<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Unidades de velocidad</title>
<link rel="stylesheet" href="style.css">
<style>
    body { width: 1100px; }
    .row { display: flex; align-items: center; justify-content: center; gap: 30px; margin-top: 10px; }
    .u { width: 210px; height: 120px; border-radius: 18px; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 34px; font-weight: 800; }
    .u small { font-size: 16px; font-weight: 400; }
    .kmh { background: var(--blue); } .ms { background: var(--ocre); }
    .mid { text-align: center; font-size: 22px; font-weight: 800; }
    .mid .a { font-size: 44px; line-height: 1; color: var(--grey); }
    .top { color: var(--green); } .bot { color: var(--red); }
    .why { margin-top: 20px; text-align: center; font-size: 20px; }
    .why .frac { font-size: 20px; }
    .ex { display: flex; justify-content: center; gap: 30px; margin-top: 14px; font-size: 18px; color: var(--grey); }
    .ex span { background: #F4F6F7; border-radius: 10px; padding: 6px 12px; }
</style>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1>Unidades de velocidad: km/h y m/s</h1>
    <div class="row">
        <div class="u kmh">km/h<small>coches, trenes</small></div>
        <div class="mid"><div class="top">÷ 3,6</div><div class="a">⇄</div><div class="bot">× 3,6</div></div>
        <div class="u ms">m/s<small>unidad del SI</small></div>
    </div>
    <div class="why">¿Por qué 3,6?&nbsp; 1 <span class="frac"><span>km</span><span>h</span></span> = <span class="frac"><span>1000 m</span><span>3600 s</span></span> = <span class="frac"><span>1</span><span>3,6</span></span> <span class="frac"><span>m</span><span>s</span></span></div>
    <div class="ex"><span>🚗 90 km/h = 25 m/s</span><span>🚴 20 m/s = 72 km/h</span><span>🚶 1,4 m/s ≈ 5 km/h</span></div>
    <div class="note" style="text-align:center;margin-top:12px">Úsalo solo para <b>comprobar</b> el resultado: resuelve siempre con factores de conversión.</div>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Floating and sinking</title>
<link rel="stylesheet" href="style.css">
<style>
    body { width: 1100px; }
    .row { display: flex; gap: 40px; align-items: center; }
    svg text { font-family: "Segoe UI", Arial, sans-serif; }
    .rules { flex: 1; font-size: 20px; line-height: 1.5; }
    .rule { border-radius: 14px; padding: 12px 16px; margin-bottom: 14px; }
    .f { background: var(--green-soft); border: 2px solid var(--green); }
    .s { background: var(--red-soft); border: 2px solid var(--red); }
    .rule b { font-size: 22px; }
    .f b { color: var(--green); } .s b { color: var(--red); }
    .tip { font-size: 17px; color: var(--grey); }
</style>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1>Floating or sinking? Compare densities!</h1>
    <div class="row">
        <svg width="560" height="560" viewBox="0 0 560 560">
            <!-- glass -->
            <path d="M90 40 L90 520 Q90 540 110 540 L330 540 Q350 540 350 520 L350 40" fill="none" stroke="#525252" stroke-width="5"/>
            <!-- layers -->
            <rect x="93" y="400" width="254" height="137" fill="#E8A33D"/>   <!-- honey -->
            <rect x="93" y="250" width="254" height="150" fill="#9ED3F0"/>   <!-- water -->
            <rect x="93" y="120" width="254" height="130" fill="#F7DC6F"/>   <!-- oil -->
            <!-- objects -->
            <ellipse cx="160" cy="112" rx="36" ry="18" fill="#C69C6D" stroke="#7B5B3A" stroke-width="3"/>  <!-- cork -->
            <circle cx="270" cy="250" r="20" fill="#E74C3C" stroke="#922B21" stroke-width="3"/>             <!-- plastic bead -->
            <circle cx="160" cy="400" r="22" fill="#7D3C98" stroke="#4A235A" stroke-width="3"/>             <!-- grape -->
            <polygon points="250,515 290,515 300,535 240,535" fill="#7F8C8D" stroke="#424949" stroke-width="3"/> <!-- steel nut -->
            <!-- labels -->
            <g font-size="17" font-weight="700">
                <text x="365" y="190" fill="#9A7D0A">oil · 0.92</text>
                <text x="365" y="330" fill="#1F618D">water · 1.00</text>
                <text x="365" y="475" fill="#935116">honey · 1.42</text>
            </g>
            <g font-size="15" font-weight="700" fill="#23373B">
                <text x="160" y="80" text-anchor="middle">cork · 0.24</text>
                <text x="270" y="290" text-anchor="middle">plastic · 0.95</text>
                <text x="160" y="442" text-anchor="middle" fill="#fff">grape · 1.10</text>
                <text x="270" y="505" text-anchor="middle">steel · 7.85</text>
            </g>
            <text x="220" y="30" text-anchor="middle" font-size="15" fill="#525252">densities in g/mL</text>
        </svg>
        <div class="rules">
            <div class="rule f"><b>Floats ⬆</b><br>if its density is <u>lower</u> than the liquid's.</div>
            <div class="rule s"><b>Sinks ⬇</b><br>if its density is <u>higher</u> than the liquid's.</div>
            <div class="tip">Each object stops in the layer where the liquid below is denser and the liquid above is less dense than the object itself.</div>
        </div>
    </div>
</div>
</body>
</html>

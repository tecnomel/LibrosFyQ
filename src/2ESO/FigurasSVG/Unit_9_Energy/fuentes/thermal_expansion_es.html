<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dilatación térmica</title>
<link rel="stylesheet" href="style.css">
<style>
    body { width: 1150px; }
    .row { display: flex; gap: 14px; }
    .c { flex: 1; text-align: center; border-radius: 16px; padding: 10px; border: 2px solid var(--line); background: #FBFCFC; }
    .c h2 { font-size: 19px; color: var(--blue); }
    .c .t { font-size: 14px; color: var(--grey); }
    svg text { font-family: "Segoe UI", Arial, sans-serif; }
    .order { text-align: center; margin-top: 12px; font-size: 18px; }
</style>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1>Dilatación térmica: el calor hace que las cosas aumenten de tamaño</h1>
    <div class="row">
        <div class="c"><h2>Juntas de dilatación</h2><svg width="320" height="170">
            <rect x="10" y="80" width="140" height="30" fill="#7F8C8D"/><rect x="170" y="80" width="140" height="30" fill="#7F8C8D"/>
            <rect x="150" y="70" width="20" height="50" fill="none" stroke="#C0392B" stroke-width="3" stroke-dasharray="4 3"/>
            <text x="160" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#C0392B">hueco para el verano ☀️</text>
            <text x="160" y="50" text-anchor="middle" font-size="36">🌉</text></svg><div class="t">puentes y vías de tren</div></div>
        <div class="c"><h2>Tendidos eléctricos</h2><svg width="320" height="170">
            <rect x="20" y="20" width="10" height="140" fill="#5D6D7E"/><rect x="290" y="20" width="10" height="140" fill="#5D6D7E"/>
            <path d="M30 30 Q160 110 290 30" fill="none" stroke="#C0392B" stroke-width="3"/><text x="160" y="105" text-anchor="middle" font-size="14" fill="#C0392B">verano: más largos</text>
            <path d="M30 30 Q160 60 290 30" fill="none" stroke="#2471A3" stroke-width="3"/><text x="160" y="40" text-anchor="middle" font-size="14" fill="#2471A3">invierno: más cortos</text></svg><div class="t">los cables cuelgan algo destensados</div></div>
        <div class="c"><h2>Termómetros</h2><svg width="320" height="170">
            <rect x="110" y="10" width="40" height="130" rx="20" fill="#fff" stroke="#525252" stroke-width="3"/>
            <rect x="122" y="40" width="16" height="100" fill="#E74C3C"/><circle cx="130" cy="145" r="22" fill="#E74C3C" stroke="#525252" stroke-width="3"/>
            <text x="168" y="60" font-size="15" fill="#23373B">el líquido se dilata</text><text x="168" y="80" font-size="15" fill="#23373B">y sube ⬆</text></svg><div class="t">en su interior, alcohol o mercurio</div></div>
    </div>
    <div class="order">Los gases son los que más se dilatan 🎈 &gt; líquidos 💧 &gt; sólidos 🧱</div>
</div>
</body>
</html>

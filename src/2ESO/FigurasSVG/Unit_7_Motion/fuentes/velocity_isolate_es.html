<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Despejar x y t</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="isolate.css">
<script src="isolate_es.js"></script>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1></h1>
    <div class="grid" id="grid"></div>
    <div class="tip" id="tip"></div>
</div>
<script>
buildIsolate('Cómo despejar x y t en v = x / t', [
    { goal: 'x', steps: [
        ['Escribimos la fórmula.', `v = ${f(g('x'), 't')}`],
        [`<b>t</b> está <b>dividiendo</b> a ${g('x')}: multiplicamos <b>los dos lados</b> por t.`, `v ${o('· t')} = ${f(`${g('x')} ${o('· ' + c('t'))}`, c('t'))}`]],
      result: `${g('x')} = v · t` },
    { goal: 't', steps: [
        ['Partimos de x = v · t (tarjeta de la izquierda).', `x = v · ${g('t')}`],
        [`<b>v</b> está <b>multiplicando</b> a ${g('t')}: dividimos <b>los dos lados</b> entre v.`, `${f('x', o('v'))} = ${f(`${c('v')} · ${g('t')}`, o(c('v')))}`]],
      result: `${g('t')} = ${f('x', 'v')}` },
], '<b>Truco:</b> lo que está <b>dividiendo</b> pasa al otro lado <b>multiplicando</b>, y lo que está <b>multiplicando</b> pasa al otro lado <b>dividiendo</b>.');
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UARM graphs</title>
<link rel="stylesheet" href="style.css">
<style>
    body { width: 1150px; }
    .row { display: flex; gap: 16px; }
    .c { flex: 1; text-align: center; border: 2px solid var(--line); border-radius: 16px; padding: 8px; }
    .c h2 { font-size: 19px; color: var(--blue); }
    .t { font-size: 15px; }
    svg text { font-family: "Segoe UI", Arial, sans-serif; }
</style>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1>Graphs of uniformly accelerated rectilinear motion (UARM)</h1>
    <div class="row">
        <div class="c"><h2>Speed–time: starting from rest</h2><svg id="a" width="330" height="240"></svg><div class="t">area = triangle → <b>distance = <span class="frac"><span>v · t</span><span>2</span></span></b></div></div>
        <div class="c"><h2>Speed–time: with initial speed</h2><svg id="b" width="330" height="240"></svg><div class="t">area = rectangle + triangle</div></div>
        <div class="c"><h2>Position–time</h2><svg id="c" width="330" height="240"></svg><div class="t">a <b>curve</b> that gets steeper and steeper</div></div>
    </div>
</div>
<script>
    const NS = 'http://www.w3.org/2000/svg';
    function g(id, yl, draw) {
        const s = document.getElementById(id);
        const add = (tag, a, t) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (t !== undefined) e.textContent = t; s.appendChild(e); };
        draw(add);
        add('line', { x1: 40, y1: 210, x2: 320, y2: 210, stroke: '#23373B', 'stroke-width': 2.5 });
        add('line', { x1: 40, y1: 210, x2: 40, y2: 15, stroke: '#23373B', 'stroke-width': 2.5 });
        add('text', { x: 315, y: 230, 'text-anchor': 'end', 'font-size': 17, 'font-weight': 700 }, 't');
        add('text', { x: 15, y: 25, 'font-size': 17, 'font-weight': 700 }, yl);
    }
    g('a', 'v', add => { add('polygon', { points: '40,210 280,40 280,210', fill: '#AED6F1' }); add('line', { x1: 40, y1: 210, x2: 280, y2: 40, stroke: '#2471A3', 'stroke-width': 5 }); add('text', { x: 200, y: 180, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 800, fill: '#1B4F72' }, 'distance'); });
    g('b', 'v', add => { add('rect', { x: 40, y: 150, width: 240, height: 60, fill: '#F5CBA7' }); add('polygon', { points: '40,150 280,40 280,150', fill: '#AED6F1' });
        add('line', { x1: 40, y1: 150, x2: 280, y2: 40, stroke: '#2471A3', 'stroke-width': 5 }); add('text', { x: 160, y: 188, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 700, fill: '#A04000' }, 'v₀ · t');
        add('text', { x: 220, y: 130, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 700, fill: '#1B4F72' }, '(v − v₀)·t / 2'); add('text', { x: 18, y: 155, 'font-size': 14 }, 'v₀'); });
    g('c', 'x', add => { let d = ''; for (let t = 0; t <= 1.0001; t += 0.05) d += (t ? 'L' : 'M') + (40 + t * 240) + ' ' + (210 - 170 * t * t); add('path', { d, fill: 'none', stroke: '#8E44AD', 'stroke-width': 5 }); });
</script>
</body>
</html>

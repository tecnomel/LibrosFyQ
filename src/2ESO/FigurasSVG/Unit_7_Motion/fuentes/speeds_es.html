<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>¿A qué velocidad?</title>
<link rel="stylesheet" href="style.css">
<style>
    body { width: 1200px; }
    .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 9px; }
    .bar .ic { font-size: 34px; width: 50px; text-align: center; }
    .bar .n { width: 210px; font-size: 17px; font-weight: 700; }
    .bar .track { flex: 1; height: 30px; background: #F4F6F7; border-radius: 15px; position: relative; overflow: hidden; }
    .bar .fill { height: 100%; border-radius: 15px; background: linear-gradient(90deg, #58D68D, #F5B041, #E74C3C); }
    .bar .v { width: 250px; font-size: 17px; text-align: right; }
    .bar .v b { color: var(--blue); }
    .formula { margin-top: 12px; text-align: center; font-size: 22px; }
</style>
<script src="../../comun/pagina.js"></script>
</head>
<body>
<div class="canvas">
    <h1>¿A qué velocidad se mueven las cosas?</h1>
    <div id="bars"></div>
    <div class="formula">rapidez = <span class="frac"><span>distancia recorrida</span><span>tiempo empleado</span></span> &nbsp; · &nbsp; unidad SI: <b>m/s</b> &nbsp; · &nbsp; 1 m/s = 3,6 km/h</div>
</div>
<script>
    const items = [['🐌','Caracol',0.01],['🚶','Persona andando',1.4],['🚴','Ciclista',6],['🐆','Guepardo',30],['🚗','Coche en autovía',33],['🏎️','Coche de Fórmula 1',88],['✈️','Avión',250],['🔊','Sonido en el aire',340]];
    const box = document.getElementById('bars');
    const max = Math.log10(340 * 1.2), min = Math.log10(0.005);
    const es = x => String(x).replace('.', ',');
    items.forEach(([ic, n, v]) => {
        const w = 100 * (Math.log10(v) - min) / (max - min);
        box.insertAdjacentHTML('beforeend', `<div class="bar"><div class="ic">${ic}</div><div class="n">${n}</div><div class="track"><div class="fill" style="width:${w}%"></div></div><div class="v"><b>${es(v)} m/s</b> = ${es(+(v * 3.6).toFixed(v < 1 ? 2 : 0))} km/h</div></div>`);
    });
</script>
</body>
</html>

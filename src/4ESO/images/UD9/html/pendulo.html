<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Péndulo simple</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 760px; } </style>
</head>
<body>
<div class="canvas">
    <svg id="s" width="720" height="360"></svg>
</div>
<script src="fig.js"></script>
<script>
    const add = svgAdder('s');
    // soporte
    add('rect', { x: 40, y: 330, width: 230, height: 14, rx: 3, fill: '#909497' });
    add('rect', { x: 70, y: 30, width: 10, height: 300, fill: '#5D6D7E' });
    add('rect', { x: 70, y: 40, width: 150, height: 9, fill: '#5D6D7E' });
    add('rect', { x: 62, y: 34, width: 26, height: 20, rx: 3, fill: '#2C3E50' });
    label(add, 75, 26, 'nuez', { 'font-size': 12, fill: '#525252' });
    const ox = 205, oy = 49, L = 230, amp = 12;
    add('rect', { x: ox - 8, y: oy - 2, width: 16, height: 10, fill: '#2C3E50' });
    // posición de equilibrio y posiciones extremas
    add('line', { x1: ox, y1: oy, x2: ox, y2: oy + L + 30, stroke: '#AAB7B8', 'stroke-dasharray': '5 4' });
    [-amp, amp].forEach(a => {
        const [x, y] = pol(ox, oy, L, -90 + a);
        add('line', { x1: ox, y1: oy, x2: x, y2: y, stroke: '#AAB7B8', 'stroke-width': 1.2 });
        add('circle', { cx: x, cy: y, r: 12, fill: 'none', stroke: '#AAB7B8', 'stroke-dasharray': '3 3' });
    });
    const [bx, by] = pol(ox, oy, L, -90 + amp);
    add('line', { x1: ox, y1: oy, x2: bx, y2: by, stroke: '#23373B', 'stroke-width': 1.8 });
    bead(add, bx, by, 12, '#7F8C8D');
    add('path', { d: arcD(ox, oy, L + 26, -90 - amp, -90 + amp), fill: 'none', stroke: '#C0392B', 'stroke-width': 2 });
    arcArrow(add, ox, oy, L + 26, -90, -90 + amp, '#C0392B', 2, 9);
    arcArrow(add, ox, oy, L + 26, -90, -90 - amp, '#C0392B', 2, 9);
    add('path', { d: arcD(ox, oy, 60, -90, -90 + amp), fill: 'none', stroke: '#B9770E', 'stroke-width': 2 });
    label(add, ox + 14, oy + 80, 'θ ≈ 10°', { 'font-size': 13, fill: '#B9770E', 'text-anchor': 'start' });
    // longitud
    arrow(add, ox - 80, oy + L / 2, ox - 80, oy + 2, '#2471A3', 1.8, 9); arrow(add, ox - 80, oy + L / 2, ox - 80, oy + L, '#2471A3', 1.8, 9);
    label(add, ox - 94, oy + L / 2 + 6, 'L', { 'font-size': 17, fill: '#2471A3', 'font-style': 'italic' });
    // texto
    const tx = 360;
    [['#000070', 'Péndulo simple', 18], ['', '', 8],
     ['#23373B', 'Período (tiempo de una oscilación completa):', 14], ['#C0392B', 'T = 2π · √(L / g)', 18], ['', '', 8],
     ['#23373B', 'Despejando la gravedad:', 14], ['#C0392B', 'g = 4π² · L / T²', 18], ['', '', 8],
     ['#525252', 'Se mide el tiempo de 40 oscilaciones', 13], ['#525252', 'y se divide entre 40 para hallar T.', 13], ['', '', 4],
     ['#525252', 'Para oscilaciones pequeñas (θ < 15°),', 13], ['#525252', 'T no depende de la masa de la bola', 13], ['#525252', 'ni de la amplitud.', 13]]
        .reduce((y, [c, s, f]) => { label(add, tx, y, s, { 'font-size': f, fill: c || '#000', 'text-anchor': 'start' }); return y + f + 10; }, 60);
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Caída libre y lanzamiento vertical hacia arriba</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 900px; } </style>
</head>
<body>
<div class="canvas">
    <svg id="s" width="860" height="380"></svg>
</div>
<script src="fig.js"></script>
<script>
    const add = svgAdder('s');
    add('rect', { x: 30, y: 345, width: 360, height: 12, fill: '#ABEBC6' });
    const Y = h => 340 - h * 3.0;   // h en m (0-100)
    // subida (izquierda) y bajada (derecha); v0 = 40 m/s
    const g = 9.8, v0 = 40;
    [0, 1, 2, 3, 4].forEach(t => {
        const h = v0 * t - 0.5 * g * t * t, v = v0 - g * t;
        // subida
        add('circle', { cx: 120, cy: Y(h), r: 8, fill: '#E67E22' });
        if (v > 1) arrow(add, 100, Y(h), 100, Y(h) - v * 1.4, '#2471A3', 3, 10);
        label(add, 150, Y(h) + 5, `t = ${t} s`, { 'font-size': 12, fill: '#525252', 'text-anchor': 'start' });
        // bajada (instantes simétricos)
        add('circle', { cx: 300, cy: Y(h), r: 8, fill: '#E67E22' });
        if (v > 1) arrow(add, 320, Y(h), 320, Y(h) + v * 1.4, '#C0392B', 3, 10);
    });
    label(add, 210, Y(81.6) - 12, 'v = 0 en el punto más alto', { 'font-size': 13, fill: '#000070' });
    label(add, 100, 372, 'subida: MRUR', { 'font-size': 14, fill: '#2471A3' }); label(add, 320, 372, 'bajada: caída libre (MRUA)', { 'font-size': 14, fill: '#C0392B' });
    // gráficas a la derecha
    function graph(x0, y0, title, fn, ymin, ymax, ylab, col) {
        const W = 170, H = 100, X = t => x0 + t / 8.2 * W, Yg = v => y0 - (v - ymin) / (ymax - ymin) * H;
        add('line', { x1: x0, y1: Yg(Math.max(ymin, 0)), x2: x0 + W + 10, y2: Yg(Math.max(ymin, 0)), stroke: '#23373B', 'stroke-width': 1.5 });
        arrow(add, x0, y0, x0, y0 - H - 12, '#23373B', 1.5, 8);
        label(add, x0 + W + 12, Yg(Math.max(ymin, 0)) + 14, 't', { 'font-size': 12, 'text-anchor': 'end' });
        label(add, x0 + 6, y0 - H - 6, ylab, { 'font-size': 12, 'text-anchor': 'start' });
        const pts = []; for (let k = 0; k <= 40; k++) { const t = k / 40 * 8.16; pts.push(`${X(t)},${Yg(fn(t))}`); }
        add('polyline', { points: pts.join(' '), fill: 'none', stroke: col, 'stroke-width': 2.5 });
        label(add, x0 + W / 2, y0 - H - 22, title, { 'font-size': 13, fill: '#000070' });
    }
    graph(470, 130, 'posición-tiempo', t => v0 * t - 0.5 * g * t * t, 0, 85, 'y', '#C0392B');
    graph(670, 130, 'velocidad-tiempo', t => v0 - g * t, -42, 42, 'v', '#2471A3');
    graph(470, 300, 'aceleración-tiempo', t => -g, -12, 2, 'a', '#1E8449');
    label(add, 660, 260, 'La aceleración es siempre', { 'font-size': 13, fill: '#525252', 'text-anchor': 'start' });
    label(add, 660, 278, 'la de la gravedad: −g', { 'font-size': 13, fill: '#525252', 'text-anchor': 'start' });
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Experiencia de Galileo con un plano inclinado</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 760px; } </style>
</head>
<body>
<div class="canvas">
    <svg id="s" width="720" height="290"></svg>
</div>
<script src="fig.js"></script>
<script>
    const add = svgAdder('s');
    add('rect', { x: 20, y: 260, width: 680, height: 10, fill: '#D5DBDB' });
    // soporte y carril inclinado
    add('rect', { x: 70, y: 70, width: 10, height: 190, fill: '#7F8C8D' });
    add('path', { d: 'M60 70 L640 250 L640 262 L60 82 Z', fill: '#C0392B', stroke: '#922B21', 'stroke-width': 1.5 });
    for (let k = 1; k < 12; k++) { const x = 60 + k * 48, y = 70 + k * 48 * 180 / 580; add('line', { x1: x, y1: y, x2: x, y2: y + 12, stroke: '#FADBD8' }); }
    add('circle', { cx: 120, cy: 75, r: 12, fill: '#AAB7B8', stroke: '#5D6D7E' });
    arrow(add, 145, 70, 210, 90, '#23373B', 2.5, 10);
    // distancia d
    add('line', { x1: 120, y1: 55, x2: 640, y2: 216, stroke: '#2471A3', 'stroke-dasharray': '6 4' });
    label(add, 380, 120, 'd', { 'font-size': 18, fill: '#2471A3', 'font-style': 'italic' });
    // embudo con llave y probeta (reloj de agua)
    add('path', { d: 'M440 40 L520 40 L486 90 L486 115 L474 115 L474 90 Z', fill: '#D6EAF8', stroke: '#5D6D7E', 'stroke-width': 2 });
    add('rect', { x: 466, y: 100, width: 28, height: 6, rx: 2, fill: '#1E8449' });
    add('rect', { x: 462, y: 150, width: 36, height: 110, fill: '#FDFEFE', stroke: '#5D6D7E', 'stroke-width': 2 });
    add('rect', { x: 464, y: 215, width: 32, height: 43, fill: '#AED6F1' });
    for (let k = 0; k < 6; k++) add('line', { x1: 462, y1: 165 + k * 16, x2: 470, y2: 165 + k * 16, stroke: '#5D6D7E' });
    for (let k = 0; k < 4; k++) add('circle', { cx: 480, cy: 122 + k * 8, r: 2, fill: '#5DADE2' });
    label(add, 560, 60, 'reloj de agua:', { 'font-size': 14, fill: '#525252', 'text-anchor': 'start' });
    label(add, 560, 78, 'el tiempo se mide', { 'font-size': 14, fill: '#525252', 'text-anchor': 'start' });
    label(add, 560, 96, 'por el volumen de agua', { 'font-size': 14, fill: '#525252', 'text-anchor': 'start' });
    label(add, 360, 285, 'Galileo comprobó que la distancia recorrida es proporcional al cuadrado del tiempo: d ∝ t²', { 'font-size': 14, fill: '#000070' });
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Conservación de la energía mecánica</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 860px; } .card .t { font-size: 13.5px; } .card h3 { font-size: 15px; color: var(--blue); margin-bottom: 4px; } </style>
</head>
<body>
<div class="canvas">
    <div class="row">
        <div class="card"><h3>Tobogán (25 kg, 2 m de altura, sin rozamiento)</h3><svg id="a" width="380" height="360"></svg>
            <div class="t">La energía potencial se transforma en cinética, pero la suma, <i>E</i><sub>m</sub> = 490 J, no cambia.</div></div>
        <div class="card"><h3>Montaña rusa (302 kg, sin rozamiento)</h3><svg id="b" width="400" height="360"></svg>
            <div class="t">La energía mecánica, <i>E</i><sub>m</sub> = 59 192 J, es la misma en A, B y C.</div></div>
    </div>
</div>
<script src="fig.js"></script>
<script>
    {
        const add = svgAdder('a');
        const g = 235, top = 40, x0 = 40, x1 = 300;
        // tobogán (curva) y escalera
        const curve = t => [x0 + 30 + t * (x1 - x0 - 30), top + (g - 10 - top) * (1 - Math.cos(t * Math.PI)) / 2];
        let d = ''; for (let i = 0; i <= 40; i++) { const [x, y] = curve(i / 40); d += (i ? ' L' : 'M') + x + ' ' + y; }
        add('path', { d, fill: 'none', stroke: '#E74C3C', 'stroke-width': 7, 'stroke-linecap': 'round' });
        add('line', { x1: x0 + 20, y1: top + 4, x2: x0 + 20, y2: g, stroke: '#7F8C8D', 'stroke-width': 4 });
        add('rect', { x: 0, y: g, width: 380, height: 10, fill: '#A9DFBF' });
        // tres posiciones (1, 2, 3) y, debajo, sus barras de energía (en julios: total 490)
        const pts = [[0, 490, 0, 'arriba (h = 2 m)'], [0.5, 245, 245, 'mitad (h = 1 m)'], [1, 0, 490, 'abajo (h = 0)']];
        pts.forEach(([t, ep, ec, hl], i) => {
            const [x, y] = curve(t);
            bead(add, x, y - 13, 11, '#F4D03F');
            label(add, x + (i === 2 ? 0 : 20), y - 26, String(i + 1), { 'font-size': 13, fill: '#525252' });
            const bx = 75 + i * 120;
            energyBars(add, bx - 28, 320, ep, ec, 490, 45, { w: 16, gap: 4 });
            label(add, bx, 352, (i + 1) + ': ' + hl, { 'font-size': 11, fill: '#525252', 'font-weight': 400 });
        });
    }
    {
        const add = svgAdder('b');
        const g = 250, s = 9; // 1 m = 7,5 px
        const yA = g - 20 * s, yC = g - 12 * s;
        const pts = [[10, yA], [60, yA], [130, g - 4], [190, g - 4], [265, yC], [320, yC + 30], [395, g - 2]];
        add('path', { d: `M10 ${yA} L60 ${yA} C 95 ${yA}, 100 ${g - 4}, 140 ${g - 4} L180 ${g - 4} C 220 ${g - 4}, 230 ${yC}, 265 ${yC} C 300 ${yC}, 320 ${g - 30}, 395 ${g - 10}`, fill: 'none', stroke: '#2471A3', 'stroke-width': 4 });
        for (let x = 20; x < 395; x += 22) add('line', { x1: x, y1: g, x2: x, y2: g - 6, stroke: '#AAB7B8' });
        add('rect', { x: 0, y: g, width: 400, height: 10, fill: '#A9DFBF' });
        const cart = (x, y) => { add('rect', { x: x - 14, y: y - 16, width: 28, height: 14, rx: 3, fill: '#E67E22' }); add('circle', { cx: x - 8, cy: y - 2, r: 3, fill: '#2C3E50' }); add('circle', { cx: x + 8, cy: y - 2, r: 3, fill: '#2C3E50' }); };
        cart(45, yA); cart(160, g - 4); cart(265, yC);
        label(add, 45, yA - 26, 'A', { 'font-size': 15 });
        label(add, 160, g - 28, 'B', { 'font-size': 15 });
        label(add, 265, yC - 26, 'C', { 'font-size': 15 });
        vdim(add, 10, yA, g, '20 m', '#525252', true);
        add('line', { x1: 280, y1: yC, x2: 352, y2: yC, stroke: '#AAB7B8', 'stroke-dasharray': '3 3' });
        vdim(add, 345, yC, g, '12 m', '#525252', true);
        const Em = 59192;
        [['A', Em, 0], ['B', 0, Em], ['C', 35515, 23677]].forEach(([n, ep, ec], i) => {
            const bx = 85 + i * 120;
            energyBars(add, bx - 28, 320, ep, ec, Em, 45, { w: 16, gap: 4 });
            label(add, bx, 352, 'en ' + n, { 'font-size': 11, fill: '#525252', 'font-weight': 400 });
        });
    }
</script>
</body>
</html>

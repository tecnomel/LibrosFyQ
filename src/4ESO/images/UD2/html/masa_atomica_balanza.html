<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Unidad de masa atómica</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 640px; } </style>
</head>
<body>
<div class="canvas">
    <svg id="a" width="580" height="300"></svg>
</div>
<script src="fig.js"></script>
<script>
    const add = svgAdder('a');
    // soporte
    add('path', { d: 'M250 280 L330 280 L300 250 L280 250 Z', fill: '#7F8C8D' });
    add('rect', { x: 284, y: 90, width: 12, height: 162, fill: '#95A5A6' });
    add('polygon', { points: '290,70 300,90 280,90', fill: '#5D6D7E' });
    add('rect', { x: 80, y: 86, width: 420, height: 10, rx: 4, fill: '#5D6D7E' });
    // platillos
    [[130, 'L'], [450, 'R']].forEach(([x]) => {
        add('line', { x1: x - 60, y1: 190, x2: x, y2: 96, stroke: '#7F8C8D', 'stroke-width': 2 });
        add('line', { x1: x + 60, y1: 190, x2: x, y2: 96, stroke: '#7F8C8D', 'stroke-width': 2 });
        add('path', { d: `M${x - 80} 190 Q${x} 225 ${x + 80} 190 Z`, fill: '#AEB6BF', stroke: '#5D6D7E', 'stroke-width': 2 });
    });
    // 12 cubitos de 1 u
    for (let i = 0; i < 12; i++) {
        const row = Math.floor(i / 5), col = i % 5;
        const n = [5, 4, 3][row], x = 130 - n * 13 + col * 26, y = 168 - row * 24;
        if (col >= n) continue;
        add('rect', { x, y, width: 24, height: 22, rx: 4, fill: '#F9E79F', stroke: '#B7950B', 'stroke-width': 1.5 });
        add('text', { x: x + 12, y: y + 16, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 800, fill: '#7D6608' }, 'u');
    }
    // átomo de carbono-12
    add('defs', {}).innerHTML = '<radialGradient id="cg" cx=".35" cy=".35"><stop offset="0" stop-color="#ABB2B9"/><stop offset="1" stop-color="#1C2833"/></radialGradient>';
    add('circle', { cx: 450, cy: 150, r: 42, fill: 'url(#cg)' });
    const t = add('text', { x: 450, y: 160, 'text-anchor': 'middle', 'font-size': 26, 'font-weight': 800, fill: '#fff' }, '');
    t.innerHTML = '<tspan baseline-shift="super" font-size="15">12</tspan>C';
    add('text', { x: 130, y: 250, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 800, fill: '#7D6608' }, '12 × 1 u');
    add('text', { x: 450, y: 250, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 800, fill: '#23373B' }, '1 átomo de carbono-12');
    add('text', { x: 290, y: 30, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 800, fill: '#000070' }, '1 u = 1/12 de la masa de un átomo de carbono-12');
    add('text', { x: 290, y: 54, 'text-anchor': 'middle', 'font-size': 14, fill: '#525252' }, '1 u ≈ 1,66 · 10⁻²⁷ kg');
</script>
</body>
</html>

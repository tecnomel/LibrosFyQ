<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Experimento de Rutherford, Geiger y Marsden</title>
<link rel="stylesheet" href="style.css">
<style>
    body { width: 1240px; }
    .row { display: flex; gap: 16px; }
    .card { text-align: center; }
    .t { font-size: 15px; color: var(--grey); margin-top: 4px; }
</style>
</head>
<body>
<div class="canvas">
    <div class="row">
        <div class="card"><h2>Montaje experimental</h2><svg id="a" width="620" height="330"></svg></div>
        <div class="card"><h2>Lo que ocurre en la lámina (ampliado)</h2><svg id="b" width="520" height="330"></svg></div>
    </div>
</div>
<script src="fig.js"></script>
<script>
    let add = svgAdder('a');
    // pantalla fluorescente circular (vista en perspectiva)
    add('ellipse', { cx: 400, cy: 170, rx: 190, ry: 130, fill: 'none', stroke: '#1E8449', 'stroke-width': 10, opacity: .35 });
    add('text', { x: 400, y: 318, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 700, fill: '#1E8449' }, 'pantalla de sulfuro de zinc (destellos)');
    // fuente
    add('rect', { x: 20, y: 140, width: 80, height: 60, rx: 6, fill: '#7F8C8D' });
    add('rect', { x: 92, y: 162, width: 12, height: 16, fill: '#F7F9F9' });
    add('text', { x: 60, y: 130, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 700, fill: '#23373B' }, 'fuente α');
    add('text', { x: 60, y: 218, 'text-anchor': 'middle', 'font-size': 12, fill: '#525252' }, '(bloque de plomo)');
    // lámina de oro
    add('path', { d: 'M392 110 L408 100 L408 230 L392 240 Z', fill: '#F4D03F', stroke: '#B7950B', 'stroke-width': 2 });
    add('text', { x: 400, y: 92, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 800, fill: '#B7950B' }, 'lámina de oro');
    // haz
    add('line', { x1: 104, y1: 170, x2: 396, y2: 170, stroke: '#C0392B', 'stroke-width': 4 });
    // trayectorias
    const ray = (x2, y2, w = 2) => add('line', { x1: 400, y1: 170, x2, y2, stroke: '#C0392B', 'stroke-width': w });
    ray(585, 170, 4); ray(580, 190, 2.5); ray(580, 150, 2.5);
    ray(520, 60); ray(500, 290); ray(270, 70);
    [[585, 170], [580, 190], [580, 150], [520, 60], [500, 290], [270, 70]].forEach(([x, y]) => add('circle', { cx: x, cy: y, r: 6, fill: '#F9E79F', stroke: '#F39C12', 'stroke-width': 2 }));
    // B: zoom con núcleos de oro
    add = svgAdder('b');
    for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) {
        const cx = 200 + c * 70 + (r % 2) * 35, cy = 60 + r * 70;
        add('circle', { cx, cy, r: 33, fill: '#FEF9E7', stroke: '#F4D03F', 'stroke-width': 2 });
        add('circle', { cx, cy, r: 4, fill: '#C0392B' });
    }
    const traj = (d, lab, lx, ly) => {
        add('path', { d, fill: 'none', stroke: '#2471A3', 'stroke-width': 2.5, 'marker-end': 'url(#ar)' });
        add('text', { x: lx, y: ly, 'font-size': 18, 'font-weight': 800, fill: '#2471A3' }, lab);
    };
    const defs = add('defs', {});
    defs.innerHTML = '<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2471A3"/></marker>';
    traj('M20 95 L500 95', '1', 480, 88);
    traj('M20 165 L215 165 Q240 168 270 160 L490 120', '2', 470, 112);
    traj('M20 270 L223 272 Q232 272 223 266 L40 228', '3', 40, 220);
    add('text', { x: 20, y: 320, 'font-size': 14, 'font-weight': 700, fill: '#2471A3' }, 'partículas α');
    add('text', { x: 300, y: 322, 'font-size': 14, 'font-weight': 700, fill: '#B7950B' }, 'átomos de oro (núcleo en rojo)');
</script>
</body>
</html>

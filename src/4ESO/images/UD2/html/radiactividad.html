<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Radiaciones alfa, beta y gamma</title>
<link rel="stylesheet" href="style.css">
<style>
    body { width: 1220px; }
    .row { display: flex; gap: 16px; }
    .card { text-align: center; }
</style>
</head>
<body>
<div class="canvas">
    <div class="row">
        <div class="card"><h2>Separación en un campo eléctrico</h2><svg id="a" width="520" height="340"></svg></div>
        <div class="card"><h2>Poder de penetración</h2><svg id="b" width="660" height="340"></svg></div>
    </div>
</div>
<script src="fig.js"></script>
<script>
    let add = svgAdder('a');
    const C = { a: '#C0392B', b: '#2471A3', g: '#8E44AD' };
    // fuente en bloque de plomo (abajo)
    add('rect', { x: 215, y: 270, width: 90, height: 55, rx: 4, fill: '#7F8C8D' });
    add('rect', { x: 253, y: 262, width: 14, height: 20, fill: '#F7F9F9' });
    add('circle', { cx: 260, cy: 285, r: 7, fill: '#F1C40F' });
    add('text', { x: 260, y: 318, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 700, fill: '#fff' }, 'plomo');
    add('text', { x: 320, y: 300, 'font-size': 13, 'font-weight': 700, fill: '#23373B' }, 'material radiactivo');
    // placas
    add('rect', { x: 120, y: 90, width: 14, height: 150, fill: '#2471A3' });
    add('rect', { x: 386, y: 90, width: 14, height: 150, fill: '#C0392B' });
    add('text', { x: 127, y: 82, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 800, fill: '#2471A3' }, '−');
    add('text', { x: 393, y: 82, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 800, fill: '#C0392B' }, '+');
    // trayectorias: α (+) curva poco hacia −; β (−) curva mucho hacia +; γ recta
    add('path', { d: 'M260 262 Q258 140 190 30', fill: 'none', stroke: C.a, 'stroke-width': 4 });
    add('path', { d: 'M260 262 Q270 170 360 100', fill: 'none', stroke: C.b, 'stroke-width': 3, 'stroke-dasharray': '8 5' });
    add('path', { d: 'M260 262 L260 20', fill: 'none', stroke: C.g, 'stroke-width': 3 });
    add('text', { x: 160, y: 30, 'font-size': 22, 'font-weight': 800, fill: C.a }, 'α');
    add('text', { x: 360, y: 92, 'font-size': 22, 'font-weight': 800, fill: C.b }, 'β');
    add('text', { x: 268, y: 26, 'font-size': 22, 'font-weight': 800, fill: C.g }, 'γ');
    // B: penetración
    add = svgAdder('b');
    const rows = [[70, 'α', 'partículas alfa (2 p + 2 n)', C.a, 232], [170, 'β', 'partículas beta (electrones)', C.b, 392], [270, 'γ', 'rayos gamma (radiación)', C.g, 532]];
    rows.forEach(([y, s, txt, col, stop]) => {
        add('circle', { cx: 25, cy: y, r: 16, fill: col });
        add('text', { x: 25, y: y + 7, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 800, fill: '#fff' }, s);
        add('text', { x: 48, y: y - 26, 'font-size': 13, 'font-weight': 700, fill: col }, txt);
        let d = `M45 ${y}`;
        for (let x = 45; x < stop; x += 10) d += ` q5 ${-8} 10 0`;
        add('path', { d, fill: 'none', stroke: col, 'stroke-width': 3 });
    });
    const wall = (x, w, fill, label) => {
        add('rect', { x, y: 30, width: w, height: 270, fill, stroke: '#5D6D7E', 'stroke-width': 1.5 });
        add('text', { x: x + w / 2, y: 325, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 700, fill: '#23373B' }, label);
    };
    wall(234, 10, '#FDFEFE', 'papel');
    wall(394, 18, '#D5D8DC', 'aluminio');
    wall(534, 60, '#5D6D7E', 'plomo / hormigón');
</script>
</body>
</html>

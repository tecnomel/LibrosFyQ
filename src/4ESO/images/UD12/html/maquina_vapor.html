<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Máquina de vapor</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 820px; } </style>
</head>
<body>
<div class="canvas">
    <svg id="s" width="770" height="385"></svg>
</div>
<script src="fig.js"></script>
<script>
    const add = svgAdder('s');
    const pipe = (d, col) => {
        add('path', { d, fill: 'none', stroke: '#5D6D7E', 'stroke-width': 14, 'stroke-linejoin': 'round' });
        add('path', { d, fill: 'none', stroke: col, 'stroke-width': 9, 'stroke-linejoin': 'round' });
    };
    // tuberías (debajo de todo)
    pipe('M100 120 L100 50 L330 50 L330 105', '#F5B7B1');          // vapor caliente: caldera -> cilindro
    pipe('M370 105 L370 60 L540 60', '#D6EAF8');                   // vapor frío: cilindro -> condensador
    pipe('M640 300 L640 320 L218 320', '#85C1E9');                 // agua: condensador -> bomba
    pipe('M200 302 L200 270 L158 270', '#85C1E9');                 // bomba -> caldera
    // caldera
    add('rect', { x: 40, y: 110, width: 120, height: 190, rx: 30, fill: '#F2F3F4', stroke: '#5D6D7E', 'stroke-width': 3 });
    add('rect', { x: 43, y: 190, width: 114, height: 105, rx: 26, fill: '#85C1E9' });
    for (let i = 0; i < 4; i++) flame(add, 60 + i * 27, 350, 0.85);
    label(add, 100, 160, 'caldera', { 'font-size': 15 });
    // cilindro y pistón
    add('rect', { x: 290, y: 105, width: 120, height: 80, rx: 6, fill: '#F9E79F', stroke: '#7D6608', 'stroke-width': 3 });
    add('rect', { x: 298, y: 125, width: 50, height: 52, fill: '#FADBD8' });
    add('rect', { x: 348, y: 118, width: 18, height: 60, fill: '#B7950B', stroke: '#7D6608', 'stroke-width': 2 });
    add('line', { x1: 366, y1: 148, x2: 470, y2: 148, stroke: '#424949', 'stroke-width': 6 });
    // biela y volante
    add('circle', { cx: 520, cy: 210, r: 60, fill: 'none', stroke: '#424949', 'stroke-width': 8 });
    add('circle', { cx: 520, cy: 210, r: 8, fill: '#424949' });
    add('line', { x1: 470, y1: 148, x2: 560, y2: 180, stroke: '#424949', 'stroke-width': 5 });
    add('line', { x1: 520, y1: 210, x2: 560, y2: 180, stroke: '#424949', 'stroke-width': 5 });
    add('circle', { cx: 560, cy: 180, r: 5, fill: '#C0392B' });
    arcArrow(add, 520, 210, 78, 120, 60, '#1E8449', 2.5, 10);
    // condensador (serpentín) en un depósito de agua fría
    add('rect', { x: 600, y: 40, width: 90, height: 260, rx: 8, fill: '#EBF5FB', stroke: '#5D6D7E', 'stroke-width': 2 });
    let dd = 'M540 60 L640 60';
    for (let i = 0; i < 6; i++) dd += ` C ${i % 2 ? 610 : 680} ${80 + i * 38}, ${i % 2 ? 610 : 680} ${98 + i * 38}, 645 ${98 + i * 38}`;
    dd += ' L640 300';
    add('path', { d: dd, fill: 'none', stroke: '#2E86C1', 'stroke-width': 7 });
    // bomba
    add('circle', { cx: 200, cy: 320, r: 18, fill: '#D5D8DC', stroke: '#424949', 'stroke-width': 2.5 });
    for (let a = 0; a < 360; a += 60) { const [x, y] = pol(200, 320, 14, a); add('line', { x1: 200, y1: 320, x2: x, y2: y, stroke: '#424949', 'stroke-width': 2 }); }
    // flechas de sentido de circulación
    arrow(add, 180, 30, 250, 30, '#C0392B', 2, 9);
    arrow(add, 420, 82, 490, 82, '#2471A3', 2, 9);
    arrow(add, 480, 344, 400, 344, '#2471A3', 2, 9);
    // rótulos
    label(add, 215, 22, 'vapor caliente', { 'font-size': 14, fill: '#C0392B' });
    label(add, 455, 100, 'vapor frío', { 'font-size': 14, fill: '#2471A3' });
    label(add, 350, 205, 'cilindro y pistón', { 'font-size': 14 });
    label(add, 520, 295, 'volante', { 'font-size': 14 });
    label(add, 645, 28, 'condensador', { 'font-size': 14 });
    label(add, 400, 312, 'agua', { 'font-size': 14, fill: '#2471A3' });
    label(add, 200, 360, 'bomba', { 'font-size': 14 });
    label(add, 100, 375, 'calor', { 'font-size': 14, fill: '#CA6F1E' });
</script>
</body>
</html>

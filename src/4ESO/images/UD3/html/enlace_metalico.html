<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Enlace metálico: mar de electrones</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 900px; } </style>
</head>
<body>
<div class="canvas">
    <svg id="s" width="840" height="280"></svg>
</div>
<script src="fig.js"></script>
<script src="chem.js"></script>
<script>
    const add = svgAdder('s');
    add('rect', { x: 20, y: 20, width: 520, height: 240, rx: 40, fill: '#D6EAF8', stroke: '#85C1E9', 'stroke-width': 2 });
    // cationes Cu2+
    for (let r = 0; r < 3; r++) for (let c = 0; c < 6; c++) {
        const x = 70 + c * 82 + (r % 2) * 40, y = 70 + r * 70;
        if (x > 510) continue;
        add('circle', { cx: x, cy: y, r: 24, fill: '#F0B27A', stroke: '#A04000', 'stroke-width': 2 });
        label(add, x, y + 6, 'Cu²⁺', { 'font-size': 15, 'font-weight': 800, fill: '#6E2C00' });
    }
    // electrones libres (posiciones pseudoaleatorias en los huecos)
    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const cat = [], el = [];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 6; c++) {
        const x = 70 + c * 82 + (r % 2) * 40; if (x <= 510) cat.push([x, 70 + r * 70]);
    }
    const far = (x, y, pts, d) => pts.every(([a, b]) => Math.hypot(x - a, y - b) > d);
    for (let k = 0; k < 2000 && el.length < 30; k++) {
        const x = 40 + rnd() * 480, y = 35 + rnd() * 210;
        if (far(x, y, cat, 33) && far(x, y, el, 20)) { el.push([x, y]); particle(add, x, y, 'e', 7); }
    }
    label(add, 640, 90, 'cationes fijos', { 'font-size': 16, fill: '#A04000' });
    label(add, 640, 110, 'y ordenados', { 'font-size': 16, fill: '#A04000' });
    label(add, 680, 180, '«mar» de electrones', { 'font-size': 16, fill: '#2471A3' });
    label(add, 680, 200, 'libres y deslocalizados', { 'font-size': 16, fill: '#2471A3' });
    add('line', { x1: 575, y1: 95, x2: 520, y2: 108, stroke: '#A04000', 'stroke-width': 1.5 });
    add('line', { x1: 590, y1: 186, x2: 500, y2: 200, stroke: '#2471A3', 'stroke-width': 1.5 });
</script>
</body>
</html>

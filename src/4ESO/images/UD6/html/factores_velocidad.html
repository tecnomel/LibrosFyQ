<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Factores que influyen en la velocidad de reacción</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 1100px; } .card h2 { font-size: 17px; } </style>
</head>
<body>
<div class="canvas">
    <div class="row">
        <div class="card"><h2>Superficie de contacto</h2><svg id="a" width="320" height="240"></svg><div class="t">El carbonato pulverizado reacciona más deprisa que en trozos.</div></div>
        <div class="card"><h2>Concentración</h2><svg id="b" width="320" height="240"></svg><div class="t">Con HCl más concentrado, la reacción es más rápida.</div></div>
        <div class="card"><h2>Temperatura</h2><svg id="c" width="320" height="240"></svg><div class="t">A 100 °C la reacción es más rápida que a 75 °C.</div></div>
    </div>
</div>
<script src="fig.js"></script>
<script>
    // Ejes V(CO2) frente a t, de 0 a 8 min y de 0 a 30 cm³
    function axes(add) {
        const X = t => 50 + t * 30, Y = v => 200 - v * 5.6;
        for (let t = 0; t <= 8; t++) add('line', { x1: X(t), y1: Y(0), x2: X(t), y2: Y(32), stroke: '#EBF5FB' });
        for (let v = 0; v <= 30; v += 5) { add('line', { x1: X(0), y1: Y(v), x2: X(8.3), y2: Y(v), stroke: '#EBF5FB' }); label(add, X(0) - 6, Y(v) + 4, v, { 'font-size': 12, 'text-anchor': 'end', 'font-weight': 600 }); }
        for (let t = 0; t <= 8; t += 2) label(add, X(t), Y(0) + 17, t, { 'font-size': 12, 'font-weight': 600 });
        arrow(add, X(0), Y(0), X(8.6), Y(0), '#23373B', 2, 9); arrow(add, X(0), Y(0), X(0), Y(34), '#23373B', 2, 9);
        label(add, X(8.6), Y(0) + 34, 't (min)', { 'font-size': 13, 'text-anchor': 'end' });
        add('text', { x: X(0) + 6, y: Y(34) + 4, 'font-size': 13, 'font-weight': 700, fill: '#23373B' }).innerHTML = 'V<tspan baseline-shift="sub" font-size="70%">CO₂</tspan> (cm³)';
        return [X, Y];
    }
    function curve(add, X, Y, pts, col, txt, tx, ty) {
        add('polyline', { points: pts.map(([t, v]) => `${X(t)},${Y(v)}`).join(' '), fill: 'none', stroke: col, 'stroke-width': 3, 'stroke-linejoin': 'round' });
        pts.forEach(([t, v]) => add('circle', { cx: X(t), cy: Y(v), r: 3, fill: col }));
        label(add, tx, ty, txt, { 'font-size': 13, fill: col, 'text-anchor': 'start' });
    }
    // Datos del experimento (cm³ de CO2)
    let add = svgAdder('a'); let [X, Y] = axes(add);
    curve(add, X, Y, [[0, 0], [1, 15.25], [3, 26.2], [5, 29.25], [6, 30.25], [7, 30.5], [8, 30.5]], '#C0392B', 'en trozos', X(4), Y(8));
    curve(add, X, Y, [[0, 0], [1, 22.4], [2, 28], [3, 30.25], [4, 30.5], [5, 30.5], [8, 30.5]], '#2471A3', 'pulverizado', X(4), Y(15));
    // concentración y temperatura: curvas cualitativas del mismo tipo
    const sat = (k, t) => 30.5 * (1 - Math.exp(-k * t));
    const pts = k => Array.from({ length: 17 }, (_, i) => [i / 2, sat(k, i / 2)]);
    add = svgAdder('b'); [X, Y] = axes(add);
    curve(add, X, Y, pts(0.55), '#C0392B', 'HCl diluido', X(4), Y(8));
    curve(add, X, Y, pts(1.3), '#1E8449', 'HCl concentrado', X(4), Y(15));
    add = svgAdder('c'); [X, Y] = axes(add);
    curve(add, X, Y, pts(0.6), '#C0392B', '75 °C', X(4), Y(8));
    curve(add, X, Y, pts(1.4), '#E67E22', '100 °C', X(4), Y(15));
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pila alcalina y electrólisis del agua</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 960px; } .card h2 { font-size: 18px; } </style>
</head>
<body>
<div class="canvas">
    <div class="row">
        <div class="card"><h2>Pila alcalina</h2><svg id="a" width="400" height="290"></svg><div class="t">Energía química → energía eléctrica</div></div>
        <div class="card"><h2>Electrólisis del agua</h2><svg id="b" width="400" height="290"></svg><div class="t">Energía eléctrica → energía química</div></div>
    </div>
</div>
<script src="fig.js"></script>
<script>
    // ---------- pila alcalina en corte ----------
    let add = svgAdder('a');
    const cx = 110;
    add('rect', { x: cx - 60, y: 30, width: 120, height: 240, rx: 10, fill: '#5D6D7E' });                       // cubierta metálica
    add('rect', { x: cx - 53, y: 37, width: 106, height: 226, rx: 6, fill: '#AAB7B8' });                        // zinc
    add('rect', { x: cx - 44, y: 44, width: 88, height: 212, rx: 4, fill: '#2E4053' });                         // pasta MnO2
    add('rect', { x: cx - 30, y: 44, width: 60, height: 212, fill: '#5DADE2' });                                // electrolito
    add('rect', { x: cx - 8, y: 20, width: 16, height: 236, fill: '#273746' });                                 // barra de grafito
    add('rect', { x: cx - 14, y: 10, width: 28, height: 14, rx: 3, fill: '#BFC9CA', stroke: '#5D6D7E' });       // borne +
    label(add, cx, 6, '+', { 'font-size': 18, fill: '#C0392B' });
    label(add, cx, 290, '−', { 'font-size': 20, fill: '#2471A3' });
    const rot = [[60, 'cubierta metálica', cx + 60], [95, 'zinc (electrodo −): se oxida', cx + 53], [135, 'electrolito', cx + 20],
        [180, 'pasta de MnO₂ (electrodo +):', cx + 40], [198, 'se reduce', null], [235, 'barra de grafito', cx + 6]];
    rot.forEach(([y, t, xp]) => {
        if (xp) add('line', { x1: xp, y1: y - 4, x2: 205, y2: y - 4, stroke: '#7F8C8D', 'stroke-width': 1.2 });
        label(add, 210, y, t, { 'font-size': 13, 'text-anchor': 'start', fill: '#23373B', 'font-weight': 600 });
    });
    // ---------- electrólisis del agua ----------
    add = svgAdder('b');
    beaker(add, 60, 110, 230, 160, { fill: 0.75, color: '#D6EAF8' });
    function tube(x, gas, h) {
        add('rect', { x: x - 16, y: 40, width: 32, height: 200, rx: 14, fill: '#FDFEFE', stroke: '#5D6D7E', 'stroke-width': 2 });
        add('rect', { x: x - 14, y: 42 + h, width: 28, height: 196 - h, fill: '#D6EAF8' });
        label(add, x, 34, gas, { 'font-size': 15, fill: '#000070' });
        add('line', { x1: x, y1: 255, x2: x, y2: 215, stroke: '#7F8C8D', 'stroke-width': 4 });
        const r = rng(x);
        for (let k = 0; k < 8; k++) add('circle', { cx: x - 8 + r() * 16, cy: 120 + r() * 90, r: 2.5, fill: 'none', stroke: '#2471A3', 'stroke-width': 1.2 });
    }
    tube(130, 'H₂', 120); tube(220, 'O₂', 60);
    // pila y cables
    add('rect', { x: 320, y: 140, width: 50, height: 70, rx: 6, fill: '#2C3E50' });
    label(add, 345, 135, '+', { 'font-size': 16, fill: '#C0392B' }); label(add, 345, 228, '−', { 'font-size': 18, fill: '#2471A3' });
    add('path', { d: 'M335 140 L335 285 L130 285 L130 255', fill: 'none', stroke: '#2471A3', 'stroke-width': 2 });
    add('path', { d: 'M355 140 L355 100 L245 100 L245 270 L220 270 L220 255', fill: 'none', stroke: '#C0392B', 'stroke-width': 2 });
    label(add, 175, 302, 'se forma el doble de volumen de H₂ que de O₂', { 'font-size': 12, fill: '#525252' });
</script>
</body>
</html>

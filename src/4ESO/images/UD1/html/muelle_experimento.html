<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Alargamiento de un muelle</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 700px; } .note { font-size: 13.5px; text-align: center; } </style>
</head>
<body>
<div class="canvas">
    <svg id="s" width="650" height="360"></svg>
    <div class="note">Variable independiente: el peso que colgamos (<i>F</i>). Variable dependiente: el alargamiento (<i>l</i> − <i>l</i><sub>0</sub>). Variables controladas: el mismo muelle y el mismo montaje.</div>
</div>
<script src="fig.js"></script>
<script>
    const add = svgAdder('s');
    function spring(x, y1, y2, n = 14) {
        let d = `M${x} ${y1} L${x} ${y1 + 8}`;
        const L = y2 - y1 - 16;
        for (let i = 0; i < n; i++) d += ` L${x + (i % 2 ? 11 : -11)} ${y1 + 8 + (i + 0.5) * L / n}`;
        d += ` L${x} ${y2 - 8} L${x} ${y2}`;
        add('path', { d, fill: 'none', stroke: '#2C3E50', 'stroke-width': 2, 'stroke-linejoin': 'round' });
    }
    // soporte común
    add('rect', { x: 30, y: 335, width: 590, height: 14, rx: 3, fill: '#909497' });
    add('rect', { x: 40, y: 20, width: 10, height: 315, fill: '#5D6D7E' });
    add('rect', { x: 40, y: 20, width: 560, height: 10, fill: '#5D6D7E' });
    const y0 = 30, l0 = 70;
    // regla
    add('rect', { x: 70, y: 40, width: 26, height: 260, fill: '#F9E79F', stroke: '#B7950B', 'stroke-width': 1.2 });
    for (let k = 0; k <= 26; k++) add('line', { x1: 70, y1: 40 + k * 10, x2: 70 + (k % 5 ? 7 : 13), y2: 40 + k * 10, stroke: '#7D6608', 'stroke-width': 1 });
    // muelles con 0, 1, 2, 3 y 4 pesas (alargamiento proporcional)
    const xs = [160, 250, 340, 430, 520], dx = 28;
    xs.forEach((x, n) => {
        const yEnd = y0 + l0 + n * dx;
        spring(x, y0, yEnd);
        add('line', { x1: x, y1: yEnd, x2: x, y2: yEnd + 8, stroke: '#5D6D7E', 'stroke-width': 2 });
        for (let k = 0; k < n; k++) add('rect', { x: x - 16, y: yEnd + 8 + k * 16, width: 32, height: 14, rx: 2, fill: '#B9770E', stroke: '#7E5109' });
        add('line', { x1: x - 30, y1: yEnd, x2: x + 30, y2: yEnd, stroke: '#C0392B', 'stroke-width': 1, 'stroke-dasharray': '3 3' });
        label(add, x, 30 + 70 + 4 * 28 + 8 + 4 * 16 + 18, n === 0 ? 'sin peso' : `F = ${n} N`, { 'font-size': 12 });
    });
    // longitud natural
    vdim(add, 125, y0, y0 + l0, 'l_0', '#2471A3');
    // alargamiento del último
    add('line', { x1: 500, y1: y0 + l0, x2: 590, y2: y0 + l0, stroke: '#2471A3', 'stroke-width': 1, 'stroke-dasharray': '3 3' });
    vdim(add, 585, y0 + l0, y0 + l0 + 4 * dx, 'l − l_0', '#C0392B');
</script>
</body>
</html>

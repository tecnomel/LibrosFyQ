<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Compuestos oxigenados</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 860px; } .card h3 { font-size: 14px; color: var(--blue); } .card .t { font-size: 12.5px; } .f { font-size: 14px; font-weight: 700; } </style>
</head>
<body>
<div class="canvas">
    <div class="row">
        <div class="card"><h3>Alcohol</h3><svg id="a" width="180" height="140"></svg>
            <div class="f">etanol: CH₃–CH₂OH</div><div class="t">grupo hidroxilo, –OH</div></div>
        <div class="card"><h3>Aldehído</h3><svg id="b" width="180" height="140"></svg>
            <div class="f">etanal: CH₃–CHO</div><div class="t">grupo carbonilo en un extremo</div></div>
        <div class="card"><h3>Cetona</h3><svg id="c" width="180" height="140"></svg>
            <div class="f">propanona: CH₃–CO–CH₃</div><div class="t">grupo carbonilo en el interior</div></div>
        <div class="card"><h3>Ácido carboxílico</h3><svg id="d" width="180" height="140"></svg>
            <div class="f">ácido etanoico: CH₃–COOH</div><div class="t">grupo carboxilo, –COOH</div></div>
    </div>
</div>
<script src="fig.js"></script>
<script src="mol.js"></script>
<script>
    const c60 = Math.cos(Math.PI / 6), s60 = Math.sin(Math.PI / 6);
    const etanal = molecule([
        { el: 'C', p: [-1.5, 0, 0], h: 3, phi: 0 },
        { el: 'C', p: [0, 0, 0], hyb: 'sp2', h: 1 },
        { el: 'O', p: [1.22 * s60, 1.22 * c60, 0] }], [[0, 1, 1], [1, 2, 2]]);
    const propanona = molecule([
        { el: 'C', p: [-1.5 * c60, -1.5 * s60, 0], h: 3, phi: 60 },
        { el: 'C', p: [0, 0, 0], hyb: 'sp2' },
        { el: 'C', p: [1.5 * c60, -1.5 * s60, 0], h: 3, phi: 60 },
        { el: 'O', p: [0, 1.22, 0] }], [[0, 1, 1], [1, 2, 1], [1, 3, 2]]);
    const acido = molecule([
        { el: 'C', p: [-1.5 * c60, -1.5 * s60, 0], h: 3, phi: 60 },
        { el: 'C', p: [0, 0, 0], hyb: 'sp2' },
        { el: 'O', p: [0, 1.22, 0] },
        { el: 'O', p: [1.34 * c60, -1.34 * s60, 0], h: 1, phi: 0 }], [[0, 1, 1], [1, 2, 2], [1, 3, 1]]);
    drawMolecule(svgAdder('a'), MOL.etanol(), 90, 72, { scale: 34, yaw: 25, pitch: 15 });
    drawMolecule(svgAdder('b'), etanal, 90, 72, { scale: 36, yaw: 20, pitch: 15 });
    drawMolecule(svgAdder('c'), propanona, 90, 80, { scale: 34, yaw: 20, pitch: 15 });
    drawMolecule(svgAdder('d'), acido, 90, 80, { scale: 34, yaw: 20, pitch: 15 });
</script>
</body>
</html>

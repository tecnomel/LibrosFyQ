<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Polimerización del etileno</title>
<link rel="stylesheet" href="style.css">
<style> body { width: 860px; } .note { font-size: 13.5px; text-align: center; } </style>
</head>
<body>
<div class="canvas">
    <svg id="s" width="810" height="190"></svg>
    <div class="note">En la polimerización, se rompe uno de los dos enlaces del doble enlace C=C de cada molécula de etileno (el monómero) y las moléculas se unen formando una cadena muy larga: el polietileno (el polímero).</div>
</div>
<script src="fig.js"></script>
<script src="mol.js"></script>
<script>
    const add = svgAdder('s');
    // monómeros
    [50, 160, 270].forEach(x => drawMolecule(add, MOL.eteno(), x, 80, { scale: 30, yaw: 0, pitch: 0 }));
    label(add, 160, 160, 'n moléculas de etileno (eteno), CH₂=CH₂', { 'font-size': 13 });
    label(add, 160, 182, 'monómero', { 'font-size': 12, fill: '#525252', 'font-weight': 400 });
    arrow(add, 330, 80, 392, 80, '#C0392B', 3, 12);
    label(add, 361, 64, 'polimerización', { 'font-size': 12, fill: '#C0392B' });
    // polímero: cadena en zigzag
    const n = 10, z = zigzag(n, 1.54);
    const poly = molecule(z.map((p, i) => ({ el: 'C', p, h: 2 })), z.slice(1).map((_, i) => [i, i + 1, 1]));
    drawMolecule(add, poly, 603, 80, { scale: 27, yaw: 0, pitch: 12 });
    label(add, 418, 86, '···', { 'font-size': 26 }); label(add, 792, 86, '···', { 'font-size': 26 });
    label(add, 605, 160, 'polietileno: (–CH₂–CH₂–)ₙ', { 'font-size': 13 });
    label(add, 605, 182, 'polímero (n del orden de decenas de miles)', { 'font-size': 12, fill: '#525252', 'font-weight': 400 });
</script>
</body>
</html>

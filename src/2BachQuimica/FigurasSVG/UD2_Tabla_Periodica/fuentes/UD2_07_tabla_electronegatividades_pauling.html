<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UD2_07 · Tabla de electronegatividades de Pauling</title>
    <link rel="stylesheet" href="../../comun/figura.css">
    <script src="../../comun/svg.js"></script>
</head>
<body>
<script>
// Electronegatividades de Pauling (mismos elementos que la tabla original:
// Z = 1-88 sin gases nobles ni lantánidos). Se guardan como texto para
// respetar las cifras significativas.
const EN = {
    H: "2.20", Li: "0.98", Be: "1.57", B: "2.04", C: "2.55", N: "3.04", O: "3.44", F: "3.98",
    Na: "0.93", Mg: "1.31", Al: "1.61", Si: "1.90", P: "2.19", S: "2.58", Cl: "3.16",
    K: "0.82", Ca: "1.00", Sc: "1.36", Ti: "1.54", V: "1.63", Cr: "1.66", Mn: "1.55", Fe: "1.83",
    Co: "1.88", Ni: "1.91", Cu: "1.90", Zn: "1.65", Ga: "1.81", Ge: "2.01", As: "2.18", Se: "2.55", Br: "2.96",
    Rb: "0.82", Sr: "0.95", Y: "1.22", Zr: "1.33", Nb: "1.6", Mo: "2.16", Tc: "1.9", Ru: "2.2",
    Rh: "2.28", Pd: "2.20", Ag: "1.93", Cd: "1.69", In: "1.78", Sn: "1.96", Sb: "2.05", Te: "2.1", I: "2.66",
    Cs: "0.79", Ba: "0.89", La: "1.10", Hf: "1.3", Ta: "1.5", W: "2.36", Re: "1.9", Os: "2.2",
    Ir: "2.20", Pt: "2.28", Au: "2.54", Hg: "2.00", Tl: "1.62", Pb: "2.33", Bi: "2.02", Po: "2.0", At: "2.2",
    Fr: "0.7", Ra: "0.9",
};

const C = 56, G = 2, P = C + G;
const X0 = 30, Y0 = 34;
const W = X0 + 17 * P - G + 16, H = Y0 + 7 * P + 12;
const svg = crearFigura(W, H);

// Escala de color secuencial: EN baja (clara) -> EN alta (oscura)
const MIN = 0.7, MAX = 4.0;
const PARADAS = ["#FBF6DC", "#9ED3B4", "#2E7D8C", "#1B3F66"];
function colorEN(v) {
    const t = Math.min(1, Math.max(0, (v - MIN) / (MAX - MIN))) * (PARADAS.length - 1);
    const i = Math.min(PARADAS.length - 2, Math.floor(t));
    return mezclar(PARADAS[i], PARADAS[i + 1], t - i);
}
const textoSobre = v => ((v - MIN) / (MAX - MIN) > 0.5 ? "#ffffff" : COLORES.texto);

// Números de grupo y periodo
const gris = { fill: "#8A8A8A", "font-size": 12, "text-anchor": "middle" };
for (let p = 1; p <= 7; p++) texto(svg, X0 - 14, Y0 + (p - 1) * P + C / 2 + 4, String(p), gris);

for (let Z = 1; Z <= 88; Z++) {
    const e = posicionElemento(Z);
    if (!(e.simbolo in EN) || e.bloqueF) continue;
    const v = parseFloat(EN[e.simbolo]);
    const x = X0 + (e.grupo - 1) * P, y = Y0 + (e.periodo - 1) * P;
    const fg = textoSobre(v);
    el("rect", { x, y, width: C, height: C, rx: 4, fill: colorEN(v),
        stroke: mezclar(colorEN(v), "#000000", 0.2), "stroke-width": 0.8 }, svg);
    texto(svg, x + 5, y + 14, String(Z), { "font-size": 11, fill: fg, opacity: 0.85 });
    texto(svg, x + C / 2, y + 33, e.simbolo, { "text-anchor": "middle", "font-size": 19,
        "font-weight": "bold", fill: fg });
    texto(svg, x + C / 2, y + 50, EN[e.simbolo], { "text-anchor": "middle", "font-size": 13, fill: fg });
}
// Números de grupo encima de la primera casilla de cada columna
for (let g = 1; g <= 17; g++) {
    const fila = g === 1 ? 1 : (g === 2 || g >= 13) ? 2 : 4;
    texto(svg, X0 + (g - 1) * P + C / 2, Y0 + (fila - 1) * P - 6, String(g), gris);
}

// Título y barra de color en el hueco central (grupos 3-12, periodos 1-3)
const hx = X0 + 2 * P + 10, hw = 10 * P - G - 20;
texto(svg, hx + hw / 2, Y0 + 30, "Electronegatividad", { "text-anchor": "middle", "font-size": 26,
    "font-weight": "bold", fill: COLORES.texto });
texto(svg, hx + hw / 2, Y0 + 54, "(escala de Pauling)", { "text-anchor": "middle", "font-size": 15,
    fill: COLORES.gris });

const bx = hx + 50, bw = hw - 110, by = Y0 + 2 * P + 4, bh = 16;
const grad = el("linearGradient", { id: "escala", x1: 0, y1: 0, x2: 1, y2: 0 }, defs(svg));
for (let k = 0; k <= 20; k++) {
    const v = MIN + (MAX - MIN) * k / 20;
    el("stop", { offset: `${k * 5}%`, "stop-color": colorEN(v) }, grad);
}
el("rect", { x: bx, y: by, width: bw, height: bh, rx: 3, fill: "url(#escala)", stroke: "#9A9A9A", "stroke-width": 0.6 }, svg);
for (const v of [1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0]) {
    const xx = bx + bw * (v - MIN) / (MAX - MIN);
    el("line", { x1: xx, y1: by + bh, x2: xx, y2: by + bh + 5, stroke: "#6A6A6A", "stroke-width": 1 }, svg);
    texto(svg, xx, by + bh + 18, v.toFixed(1), { "text-anchor": "middle", "font-size": 12, fill: COLORES.gris });
}
texto(svg, bx - 8, by + 13, "menor", { "text-anchor": "end", "font-size": 12, fill: COLORES.gris });
texto(svg, bx + bw + 8, by + 13, "mayor", { "font-size": 12, fill: COLORES.gris });
</script>
</body>
</html>

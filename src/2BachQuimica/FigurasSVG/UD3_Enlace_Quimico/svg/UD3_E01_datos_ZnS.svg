<svg id="figura" xmlns="http://www.w3.org/2000/svg" width="620" height="120" viewBox="0 0 620 120"><style>text{font-family:"Century Gothic","URW Gothic","Avant Garde",Arial,sans-serif}</style><defs></defs><text x="10" y="30" font-size="19" fill="#23373B" font-family="Times New Roman, serif"><tspan>Δ</tspan><tspan font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="70%">f, ZnS (s)</tspan><tspan> = −182 kJ/mol</tspan></text><text x="10" y="65" font-size="19" fill="#23373B" font-family="Times New Roman, serif"><tspan>Δ</tspan><tspan font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="70%">(1.ª EI + 2.ª EI) Zn</tspan><tspan> = 2 680 kJ/mol</tspan></text><text x="10" y="100" font-size="19" fill="#23373B" font-family="Times New Roman, serif"><tspan>Δ</tspan><tspan font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="70%">S, S</tspan><tspan> = 264 kJ/mol</tspan></text><text x="330" y="30" font-size="19" fill="#23373B" font-family="Times New Roman, serif"><tspan>Δ</tspan><tspan font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="70%">(1.ª AE + 2.ª AE) S</tspan><tspan> = 246 kJ/mol</tspan></text><text x="330" y="65" font-size="19" fill="#23373B" font-family="Times New Roman, serif"><tspan>Δ</tspan><tspan font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="70%">U, ZnS</tspan><tspan> = −3 488 kJ/mol</tspan></text></svg>

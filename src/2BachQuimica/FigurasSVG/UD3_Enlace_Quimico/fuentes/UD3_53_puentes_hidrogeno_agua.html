<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UD3_53 · Puente de hidrógeno entre moléculas de agua</title>
    <link rel="stylesheet" href="../../comun/figura.css">
    <script src="../../comun/svg.js"></script>
    <script src="../../comun/lewis.js"></script>
</head>
<body>
<script>
// Dos moléculas de agua unidas por un puente de hidrógeno (O−H···O): el H, unido a un átomo
// muy electronegativo (O), es atraído por un par de electrones libre del O de la otra molécula.
const svg = crearFigura(760, 180);
const O = degradadoEsfera(svg, "O", "#D8261E"), H = degradadoEsfera(svg, "H", "#D0D0D0");
function agua(x, y, a1) {           // a1: ángulo (grados) del primer O−H; el segundo a 104,5°
    for (const a of [a1, a1 + 104.5]) {
        const r = a * Math.PI / 180, hx = x + 40 * Math.cos(r), hy = y - 40 * Math.sin(r);
        el("line", { x1: x, y1: y, x2: hx, y2: hy, stroke: "#999", "stroke-width": 7 }, svg);
        el("circle", { cx: hx, cy: hy, r: 13, fill: H, stroke: "#888", "stroke-width": 0.6 }, svg);
    }
    el("circle", { cx: x, cy: y, r: 22, fill: O }, svg);
}
agua(70, 90, 0);                  // su H de la derecha apunta al O de la otra molécula
agua(250, 90, -52);
el("line", { x1: 125, y1: 90, x2: 224, y2: 90, stroke: "#4FB0E0", "stroke-width": 5, "stroke-dasharray": "3 3" }, svg);
dibujarLewis(svg, 440, 100, { atomos: [{ s: "O", id: "o1", x: 0, y: 0, pares: [150, 210] }, { s: "H", id: "h1", x: 0, y: 1 }, { s: "H", id: "h2", x: 1, y: 0 }],
    enlaces: [{ a: "o1", b: "h1" }, { a: "o1", b: "h2" }] }, { L: 45 });
dibujarLewis(svg, 630, 100, { atomos: [{ s: "O", id: "o2", x: 0, y: 0, pares: [180, 270] }, { s: "H", id: "h3", x: 0, y: 1 }, { s: "H", id: "h4", x: 1, y: 0 }],
    enlaces: [{ a: "o2", b: "h3" }, { a: "o2", b: "h4" }] }, { L: 45 });
el("line", { x1: 498, y1: 100, x2: 602, y2: 100, stroke: "#4FB0E0", "stroke-width": 5, "stroke-dasharray": "3 3" }, svg);
texto(svg, 550, 160, "puente de hidrógeno", { "text-anchor": "middle", "font-size": 14, fill: "#1E88E5" });
texto(svg, 175, 160, "puente de hidrógeno", { "text-anchor": "middle", "font-size": 14, fill: "#1E88E5" });
</script>
</body>
</html>

<script>
// AB3X: pirámide trigonal; ángulo de 107,3° (< 109,5° por el par no enlazante).
const svg = crearFigura(560, 340);
const cam = [1, -0.25, 0.3];
const d = rotarZ(piramide(107.3), 46);
esquemaGeometria(svg, 10, 10, 170, 150, [...d.map(p => ({ p, t: "B" })), { p: [0, 0, 1], t: "X" }], { camara: cam, escala: 55, angulo: "< 109,5°", poliedro: false });
const m = molAB("N", "H", d, 1.3, { angEtq: [20, 150, 20] });
m.pares = [{ en: 0, dir: [0, 0, 1] }];
m.angulos = [{ a: 1, c: 0, b: 2, texto: "107,3°", radio: 0.55, dx: 20, dy: 10 }];
dibujarMolecula(svg, m, { cx: 380, cy: 130, escala: 115, camara: cam });
</script>

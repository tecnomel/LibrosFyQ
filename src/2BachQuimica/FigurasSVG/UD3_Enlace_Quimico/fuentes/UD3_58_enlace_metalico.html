<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UD3_58 · Enlace metálico: nube electrónica</title>
    <link rel="stylesheet" href="../../comun/figura.css">
    <script src="../../comun/svg.js"></script>
    <script src="../../comun/3d.js"></script>
</head>
<body>
<script>
// Modelo del mar de electrones: red de cationes metálicos inmersa en una nube de
// electrones de valencia deslocalizados que se mueven libremente.
const svg = crearFigura(760, 250);
el("rect", { x: 10, y: 10, width: 740, height: 200, rx: 14, fill: "#D6ECFA" }, svg);
const gc = degradadoEsfera(svg, "cat", "#A64D79");
const rnd = aleatorio(3);
for (let i = 0; i < 17; i++) for (let j = 0; j < 5; j++) {
    const x = 42 + i * 42 + (j % 2 ? 21 : 0), y = 38 + j * 36;
    if (x > 735) continue;
    el("circle", { cx: x, cy: y, r: 16, fill: gc }, svg);
    texto(svg, x, y + 5, "+", { "text-anchor": "middle", "font-size": 16, "font-weight": "bold", fill: "#fff" });
}
for (let k = 0; k < 170; k++) {
    const x = 20 + rnd() * 720, y = 18 + rnd() * 184;
    el("circle", { cx: x, cy: y, r: 3, fill: "#1A237E" }, svg);
}
el("circle", { cx: 40, cy: 232, r: 10, fill: gc }, svg);
texto(svg, 56, 237, "catión metálico", { "font-size": 14, fill: COLORES.texto });
el("circle", { cx: 230, cy: 232, r: 3.5, fill: "#1A237E" }, svg);
texto(svg, 242, 237, "electrón deslocalizado (\"mar de electrones\")", { "font-size": 14, fill: COLORES.texto });
</script>
</body>
</html>

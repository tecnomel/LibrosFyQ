<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UD3_10 · Octeto ampliado: H2SO4, SF6 y PCl5</title>
    <link rel="stylesheet" href="../../comun/figura.css">
    <script src="../../comun/svg.js"></script>
    <script src="../../comun/lewis.js"></script>
</head>
<body>
<script>
// El átomo central (S, P) se rodea de más de 8 electrones.
const svg = crearFigura(800, 260);
// H2SO4
dibujarLewis(svg, 50, 125, { atomos: [
    { s: "H", id: "h1", x: 0, y: 0 }, { s: "O", id: "o1", x: 1, y: 0, pares: [90, 270] }, { s: "S", id: "s", x: 2, y: 0 },
    { s: "O", id: "o2", x: 3, y: 0, pares: [90, 270] }, { s: "H", id: "h2", x: 4, y: 0 },
    { s: "O", id: "o3", x: 2, y: 1, libres: 2 }, { s: "O", id: "o4", x: 2, y: -1, libres: 2 }],
    enlaces: [{ a: "h1", b: "o1" }, { a: "o1", b: "s" }, { a: "s", b: "o2" }, { a: "o2", b: "h2" },
        { a: "s", b: "o3", orden: 2 }, { a: "s", b: "o4", orden: 2 }] }, { L: 50 });
// SF6
const oct = [[0, 1], [0, -1], [1, 0.25], [-1, -0.25], [0.62, -0.55], [-0.62, 0.55]];
dibujarLewis(svg, 430, 125, { atomos: [{ s: "S", id: "s", x: 0, y: 0 },
    ...oct.map(([x, y], i) => ({ s: "F", id: "f" + i, x, y, libres: 3 }))],
    enlaces: oct.map((_, i) => ({ a: "s", b: "f" + i })) }, { L: 72 });
// PCl5
const bip = [[0, 1], [0, -1], [-1, 0.1], [0.85, 0.35], [0.7, -0.45]];
dibujarLewis(svg, 670, 125, { atomos: [{ s: "P", id: "p", x: 0, y: 0 },
    ...bip.map(([x, y], i) => ({ s: "Cl", id: "c" + i, x, y, libres: 3 }))],
    enlaces: bip.map((_, i) => ({ a: "p", b: "c" + i })) }, { L: 72 });
[["H₂SO₄", 150], ["SF₆", 430], ["PCl₅", 670]].forEach(([t, x]) => texto(svg, x, 255, t, { "text-anchor": "middle", "font-size": 14, fill: COLORES.gris }));
</script>
</body>
</html>

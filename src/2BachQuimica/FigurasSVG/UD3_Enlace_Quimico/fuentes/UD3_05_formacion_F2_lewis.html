<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UD3_05 · Formación de la molécula de F2 (Lewis)</title>
    <link rel="stylesheet" href="../../comun/figura.css">
    <script src="../../comun/svg.js"></script>
    <script src="../../comun/lewis.js"></script>
</head>
<body>
<script>
// Dos átomos de flúor comparten un par de electrones y ambos completan el octeto.
const svg = crearFigura(640, 130);
const ROJO = "#D32F2F", VERDE = "#2E9D6A";
dibujarLewis(svg, 40, 62, { atomos: [{ s: "F", x: 0, y: 0, pares: [90, 180, 270], e: [0], colorPares: ROJO }] });
dibujarLewis(svg, 130, 62, { atomos: [{ s: "F", x: 0, y: 0, pares: [90, 0, 270], e: [180], colorPares: VERDE, forma: "aspa" }] });
texto(svg, 85, 70, "+", { "text-anchor": "middle", "font-size": 22, fill: COLORES.texto });
flecha(svg, 175, 62, 225, 62, { punta: 10 });
// Molécula: dos círculos que se solapan, par compartido en la zona común
const cx1 = 285, cx2 = 345, R = 40;
[cx1, cx2].forEach(cx => el("circle", { cx, cy: 62, r: R, fill: "none", stroke: "#555", "stroke-width": 1.4 }, svg));
dibujarLewis(svg, cx1 - 8, 62, { atomos: [
    { s: "F", id: "a", x: 0, y: 0, pares: [90, 180, 270], colorPares: ROJO },
    { s: "F", id: "b", x: 76 / 60, y: 0, pares: [90, 0, 270], colorPares: VERDE, forma: "aspa" }] });
punto1(svg, 315, 56, ROJO);
punto1(svg, 315, 68, VERDE, "aspa");
texto(svg, 420, 70, "o también", { "font-size": 18, fill: COLORES.texto });
dibujarLewis(svg, 540, 62, { atomos: [
    { s: "F", id: "a", x: 0, y: 0, pares: [90, 180, 270] },
    { s: "F", id: "b", x: 1.1, y: 0, pares: [90, 0, 270] }],
    enlaces: [{ a: "a", b: "b", orden: 1 }] }, { estilo: "rayas" });
</script>
</body>
</html>

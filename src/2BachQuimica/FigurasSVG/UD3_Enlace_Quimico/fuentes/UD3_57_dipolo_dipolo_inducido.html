<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UD3_57 · Fuerzas dipolo-dipolo inducido</title>
    <link rel="stylesheet" href="../../comun/figura.css">
    <script src="../../comun/svg.js"></script>
</head>
<body>
<script>
// Un dipolo permanente deforma la nube electrónica de una molécula apolar vecina e induce en ella un dipolo.
const svg = crearFigura(640, 260);
const g = el("radialGradient", { id: "dip", cx: "65%", cy: "35%", r: "75%" }, defs(svg));
[["0%", "#FFB0A8"], ["35%", "#F0453A"], ["100%", "#B71C1C"]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, g));
const f = el("filter", { id: "difuso", x: "-30%", y: "-30%", width: "160%", height: "160%" }, defs(svg));
el("feGaussianBlur", { stdDeviation: 9 }, f);
el("ellipse", { cx: 150, cy: 120, rx: 110, ry: 62, fill: "url(#dip)" }, svg);
texto(svg, 80, 130, "−", { "text-anchor": "middle", "font-size": 30, fill: "#1A1A1A" });
texto(svg, 220, 130, "+", { "text-anchor": "middle", "font-size": 30, fill: "#1A1A1A" });
// Nube deformada (más densa en el lado próximo al polo +)
el("path", { d: "M350,120 C350,60 420,50 470,78 C520,100 560,100 590,106 C610,112 610,128 590,134 C560,140 520,140 470,162 C420,190 350,180 350,120 Z",
    fill: "#E53935", filter: "url(#difuso)", opacity: 0.95 }, svg);
const sg = (x, y, s) => texto(svg, x, y, [{ t: "δ" }, { t: s, sup: true }], { "text-anchor": "middle", "font-size": 24, "font-family": "Times New Roman, serif", fill: COLORES.texto });
sg(60, 40, "−"); sg(240, 40, "+"); sg(380, 40, "−"); sg(590, 40, "+");
texto(svg, 150, 225, "dipolo", { "text-anchor": "middle", "font-size": 22, fill: COLORES.texto });
texto(svg, 480, 225, "dipolo inducido", { "text-anchor": "middle", "font-size": 22, fill: COLORES.texto });
</script>
</body>
</html>

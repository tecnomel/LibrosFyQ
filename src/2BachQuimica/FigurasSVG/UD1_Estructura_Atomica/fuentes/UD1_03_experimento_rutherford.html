<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UD1_03 · Experimento de Rutherford</title>
    <link rel="stylesheet" href="../../comun/figura.css">
    <script src="../../comun/svg.js"></script>
</head>
<body>
<script>
// Experimento de Rutherford (1911): partículas α contra una lámina fina de oro.
// La mayoría la atraviesa sin desviarse, algunas se desvían y muy pocas rebotan.
const W = 900, H = 470;
const svg = crearFigura(W, H);
const E = { cx: 560, cy: 300, rx: 300, ry: 105, h: 70 };   // pantalla detectora (cilindro)
const pt = (t, alto = 0) => ({ x: E.cx + E.rx * Math.cos(t), y: E.cy + E.ry * Math.sin(t) - alto });
const ROSA = "#D6247A";

function banda(t1, t2, relleno) {
    const n = 80, a = [], b = [];
    for (let k = 0; k <= n; k++) {
        const t = t1 + (t2 - t1) * k / n;
        a.push(pt(t)); b.push(pt(t, E.h));
    }
    const d = "M" + a.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" L") +
        " L" + b.reverse().map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" L") + " Z";
    return el("path", { d, fill: relleno, stroke: "#333", "stroke-width": 1.4, "stroke-linejoin": "round" }, svg);
}
// Degradados: interior dorado (se ve la cara interna del fondo) y exterior gris
const gOro = el("linearGradient", { id: "oro", x1: 0, y1: 0, x2: 1, y2: 0 }, defs(svg));
[["0%", "#F7C948"], ["30%", "#FFE680"], ["60%", "#E8A915"], ["100%", "#FFD84D"]]
    .forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, gOro));
const gGris = el("linearGradient", { id: "gris", x1: 0, y1: 0, x2: 1, y2: 0 }, defs(svg));
[["0%", "#6B6B6B"], ["40%", "#D9D9D9"], ["70%", "#9A9A9A"], ["100%", "#4A4A4A"]]
    .forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, gGris));

// 1) Mitad trasera de la pantalla (vemos su cara interior, que brilla al recibir partículas)
banda(Math.PI, 2 * Math.PI, "url(#oro)");

// 2) Lámina de oro (en el centro)
const F = { x: 520, y: 262 };                       // centro de la lámina
const lam = [[F.x - 18, F.y - 70], [F.x + 38, F.y - 105], [F.x + 38, F.y + 45], [F.x - 18, F.y + 80]];
const gLam = el("linearGradient", { id: "lamina", x1: 0, y1: 0, x2: 1, y2: 1 }, defs(svg));
[["0%", "#FFE27A"], ["50%", "#E9A81B"], ["100%", "#FFD24A"]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, gLam));

// 3) Trayectorias. Fuente -> lámina
const S = { x: 95, y: 395 };
const dir = { x: F.x - S.x, y: F.y - S.y };
const L = Math.hypot(dir.x, dir.y);
const u = { x: dir.x / L, y: dir.y / L };
// Haz incidente (varias líneas paralelas)
for (let k = -2; k <= 2; k++) {
    el("line", { x1: S.x + 18, y1: S.y - 8 + k * 1.6, x2: F.x + 10, y2: F.y + k * 1.6,
        stroke: ROSA, "stroke-width": 1.1, opacity: 0.9 }, svg);
}
el("polygon", { points: lam.map(p => p.join(",")).join(" "), fill: "url(#lamina)", stroke: "#B07A00",
    "stroke-width": 1, opacity: 0.92 }, svg);

// Punto de impacto en la pared interior del fondo para un ángulo de salida dado
function impacto(ang, alto) {
    const c = Math.cos(ang), s = Math.sin(ang);
    for (let d = 5; d < 1500; d += 1) {
        const x = F.x + c * d, y = F.y + s * d * 0.45;
        const q = ((x - E.cx) / E.rx) ** 2 + ((y + alto - E.cy) / E.ry) ** 2;
        if (q >= 1) return { x, y };
    }
}
const angBase = Math.atan2(u.y / 0.45, u.x);
const trayectorias = [
    { a: angBase, alto: 28, w: 2.2 }, { a: angBase - 0.05, alto: 30 }, { a: angBase + 0.05, alto: 26 },
    { a: angBase - 0.35, alto: 34 }, { a: angBase + 0.55, alto: 10 },    // desviadas
    { a: -1.6, alto: 45 },                                               // muy desviada (arriba)
    { a: Math.PI + 0.25, alto: 40 },                                     // rebota
];
const salidas = trayectorias.map(t => {
    const p = impacto(t.a, t.alto);
    el("line", { x1: F.x + 10, y1: F.y, x2: p.x, y2: p.y, stroke: ROSA, "stroke-width": t.w ?? 1.6 }, svg);
    el("circle", { cx: p.x, cy: p.y, r: 3, fill: "#FFF6B0", stroke: ROSA, "stroke-width": 1 }, svg);
    return p;
});

// 4) Mitad delantera (cara exterior), con la rendija por donde entra el haz
banda(0, Math.PI * 0.80, "url(#gris)");
banda(Math.PI * 0.86, Math.PI, "url(#gris)");

// 5) Fuente de partículas α (caja de plomo)
const bx = S.x - 40, by = S.y - 40;
el("polygon", { points: `${bx},${by} ${bx + 60},${by} ${bx + 80},${by - 18} ${bx + 20},${by - 18}`, fill: "#9C9C9C", stroke: "#444" }, svg);
el("polygon", { points: `${bx + 60},${by} ${bx + 80},${by - 18} ${bx + 80},${by + 42} ${bx + 60},${by + 60}`, fill: "#6E6E6E", stroke: "#444" }, svg);
el("rect", { x: bx, y: by, width: 60, height: 60, fill: "#8A8A8A", stroke: "#444" }, svg);
el("circle", { cx: bx + 30, cy: by + 30, r: 11, fill: degradadoEsfera(svg, "radio", "#4BAA6A") }, svg);

// 6) Etiquetas
// "α" con fuente serif (Century Gothic no tiene letras griegas)
const griega = l => typeof l === "string" && l.includes("α")
    ? l.split(/(α)/).filter(Boolean).map(t => t === "α" ? { t, attrs: { "font-family": "Times New Roman, serif", "font-style": "italic" } } : { t })
    : l;
const T = (x, y, lineas, attrs = {}) => lineas.forEach((l, i) =>
    texto(svg, x, y + i * 21, griega(l), { "font-size": 18, fill: COLORES.texto, ...attrs }));
T(18, 272, ["Fuente de", "partículas α"]);
T(160, 452, ["Haz de partículas α (+)"]);
indicador(svg, 230, 435, 300, 342);
T(610, 40, ["Pantalla detectora"]);
indicador(svg, 680, 48, 660, 222);
T(370, 110, ["Lámina de oro"], { "text-anchor": "end" });
indicador(svg, 372, 104, F.x - 5, F.y - 60);
T(745, 55, ["La mayoría la", "atraviesan sin", "desviarse"], { "font-size": 16 });
indicador(svg, 790, 100, salidas[0].x, salidas[0].y);
T(700, 440, ["Algunas se desvían"], { "font-size": 16 });
indicador(svg, 740, 424, salidas[4].x, salidas[4].y);
T(225, 190, ["Muy pocas", "rebotan"], { "font-size": 16 });
indicador(svg, 270, 222, salidas[6].x, salidas[6].y);
</script>
</body>
</html>

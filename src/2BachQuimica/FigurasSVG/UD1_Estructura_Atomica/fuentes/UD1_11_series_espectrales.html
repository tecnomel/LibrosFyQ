<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UD1_11 · Series espectrales del hidrógeno</title>
    <link rel="stylesheet" href="../../comun/figura.css">
    <script src="../../comun/svg.js"></script>
</head>
<body>
<script>
// Series espectrales del átomo de hidrógeno. Las longitudes de onda se CALCULAN
// con la fórmula de Rydberg:  1/λ = R (1/n1² − 1/n2²),  R = 1,09677566·10^7 m^-1
const R = 1.09677566e7;
const lambda = (n1, n2) => 1e9 / (R * (1 / n1 ** 2 - 1 / n2 ** 2));   // nm
const NMAX = 8;

const W = 900, H = 560;
const svg = crearFigura(W, H);
const XL = 70, XR = 820, YT = 58, YB = 490;
// Escala vertical NO proporcional (y ∝ n^-0,35) para que se distingan los niveles altos
const f = n => Math.pow(n, -0.35);
const y = n => YB - (YB - YT) * (1 - f(n)) / (1 - f(NMAX));

const SERIES = [
    { n1: 1, nombre: "Lyman", fondo: "#DDE6EE", zona: "ultravioleta" },
    { n1: 2, nombre: "Balmer", fondo: "#ECEDEF", zona: "visible" },
    { n1: 3, nombre: "Paschen", fondo: "#F6F6F4", zona: "infrarrojo" },
    { n1: 4, nombre: "Brackett", fondo: "#FDEEF1", zona: "infrarrojo" },
    { n1: 5, nombre: "Pfund", fondo: "#FFF3DF", zona: "infrarrojo" },
];
// Bandas de fondo entre niveles (la de cada serie empieza en su nivel inferior)
SERIES.forEach((s, i) => {
    const ya = y(s.n1), yb = y(s.n1 + 1);
    el("rect", { x: XL, y: yb, width: XR - XL, height: ya - yb, fill: s.fondo }, svg);
});
// Niveles de energía
for (let n = 1; n <= NMAX; n++) {
    el("line", { x1: XL, y1: y(n), x2: XR, y2: y(n), stroke: "#D32F2F", "stroke-width": 1.6 }, svg);
    texto(svg, XR + 8, y(n) + 5, [{ t: "n", attrs: { "font-style": "italic" } }, { t: ` = ${n}` }],
        { "font-size": 14, fill: COLORES.texto, "font-family": "Times New Roman, serif" });
}

// Color de cada transición: visible -> color real; UV violeta oscuro; IR granate
const colorTr = nm => nm < 380 ? "#4B2A7B" : nm > 750 ? "#7A1F1F" : colorLongitudOnda(nm);
const fmt = v => (v >= 1000 ? v.toFixed(0) : v.toFixed(v < 200 ? 2 : 1)).replace(".", ",");

// Columnas de flechas
let x = XL + 26;
const PASO = 23;
SERIES.forEach(s => {
    const x0 = x;
    for (let n2 = s.n1 + 1; n2 <= NMAX; n2++) {
        const l = lambda(s.n1, n2), col = colorTr(l);
        flecha(svg, x, y(n2), x, y(s.n1) - 1, { color: col, ancho: 2, punta: 9 });
        if (s.n1 <= 3) {         // etiqueta de λ en vertical
            const ty = y(s.n1) - 8;
            texto(svg, x - 4, ty, fmt(l) + (n2 === s.n1 + 1 && s.n1 === 1 ? " nm" : ""), { "font-size": 11,
                fill: COLORES.texto, transform: `rotate(-90 ${x - 4} ${ty})` });
        }
        x += PASO;
    }
    // Nombre de la serie
    const xc = (x0 + x - PASO) / 2;
    // Lyman: a la derecha de sus flechas; el resto: debajo de su nivel de llegada
    // Pfund (la última): encima de todo, porque abajo no cabe
    const xlab = s.n1 === 1 ? x + 4 : x0 - 6;
    const ylab = s.n1 === 1 ? y(1) - 52 : s.n1 === 5 ? YT - 34 : y(s.n1) + 22;
    texto(svg, xlab, ylab, "serie de " + s.nombre, { "font-size": 15, "font-weight": "bold", fill: COLORES.texto });
    texto(svg, xlab, ylab + 17, [{ t: "→ " }, { t: "n", attrs: { "font-style": "italic" } }, { t: ` = ${s.n1}` }],
        { "font-size": 13, fill: COLORES.gris });
    x += 26;
});

// Eje de energía
flecha(svg, 30, YB, 30, YT, { color: COLORES.ocre, ancho: 5, punta: 18 });
texto(svg, 22, (YT + YB) / 2, "energía", { "text-anchor": "middle", "font-size": 16, fill: COLORES.texto,
    transform: `rotate(-90 22 ${(YT + YB) / 2})` });
// Leyenda de zonas del espectro
[["#4B2A7B", "ultravioleta"], [colorLongitudOnda(520), "visible (color real)"], ["#7A1F1F", "infrarrojo"]].forEach(([c, t], i) => {
    el("rect", { x: XL + i * 150, y: H - 50, width: 14, height: 14, fill: c }, svg);
    texto(svg, XL + 20 + i * 150, H - 38, t, { "font-size": 12, fill: COLORES.gris });
});
texto(svg, XL, H - 12, "λ en nm, calculadas con la fórmula de Rydberg · escala no proporcional",
    { "font-size": 12, fill: COLORES.gris });
</script>
</body>
</html>

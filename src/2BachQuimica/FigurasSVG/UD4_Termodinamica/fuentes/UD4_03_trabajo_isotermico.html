<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UD4_03 · Trabajo en un proceso isotérmico</title>
    <link rel="stylesheet" href="../../comun/figura.css">
    <script src="../../comun/svg.js"></script>
    <script src="../../comun/graficas.js"></script>
</head>
<body>
<script>
// Proceso isotérmico (T = cte): la isoterma es una hipérbola p·V = nRT.
// El trabajo es el área bajo la curva: |W| = nRT·ln(V2/V1)
const svg = crearFigura(380, 290);
const g = grafica(svg, { x: 50, y: 25, w: 290, h: 220, xmin: 0, xmax: 10, ymin: 0, ymax: 10, etqX: "V", etqY: "p" });
const k = 16, f = v => k / v;
const pts = [[2.2, 0]]; for (let v = 2.2; v <= 6.6; v += 0.05) pts.push([v, f(v)]); pts.push([6.6, 0]);
g.puntos(pts, { color: "none", relleno: "#8FD3F4", ancho: 0 });
[2.2, 6.6].forEach(v => el("line", { x1: g.px(v), y1: g.py(0), x2: g.px(v), y2: g.py(f(v)), stroke: "#222", "stroke-dasharray": "5 4", "stroke-width": 1.4 }, svg));
g.curva(f, { desde: 1.65, hasta: 8.8, ancho: 3 });
[[2.2, "1"], [6.6, "2"]].forEach(([v, t]) => texto(svg, g.px(v) + 10, g.py(f(v)) - 8, t, { "font-size": 17, "font-weight": "bold", fill: COLORES.texto }));
texto(svg, g.px(4.2), g.py(1.6), "W", { "text-anchor": "middle", "font-size": 24, "font-style": "italic", "font-family": "Times New Roman, serif", fill: COLORES.texto });
texto(svg, g.px(8.6), g.py(2.6), "T = cte", { "text-anchor": "middle", "font-size": 13, fill: "#D32F2F" });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UD4_02 · Trabajo en un proceso isobárico</title>
    <link rel="stylesheet" href="../../comun/figura.css">
    <script src="../../comun/svg.js"></script>
    <script src="../../comun/graficas.js"></script>
</head>
<body>
<script>
// Proceso isobárico (p = cte): el trabajo es el área del rectángulo bajo la recta: |W| = p·ΔV
const svg = crearFigura(380, 290);
const g = grafica(svg, { x: 50, y: 25, w: 290, h: 220, xmin: 0, xmax: 10, ymin: 0, ymax: 10, etqX: "V", etqY: "p" });
g.puntos([[3, 0], [3, 7], [7, 7], [7, 0]], { color: "none", relleno: "#8FD3F4", ancho: 0 });
[[3], [7]].forEach(([v]) => el("line", { x1: g.px(v), y1: g.py(0), x2: g.px(v), y2: g.py(7), stroke: "#222", "stroke-dasharray": "5 4", "stroke-width": 1.4 }, svg));
g.puntos([[3, 7], [7, 7]], { color: "#D32F2F", ancho: 3 });
[[3, "1"], [7, "2"]].forEach(([v, t]) => texto(svg, g.px(v), g.py(7) - 10, t, { "text-anchor": "middle", "font-size": 17, "font-weight": "bold", fill: COLORES.texto }));
texto(svg, g.px(5), g.py(3.5), "W", { "text-anchor": "middle", "font-size": 24, "font-style": "italic", "font-family": "Times New Roman, serif", fill: COLORES.texto });
texto(svg, g.px(5), g.py(8) , "p = cte", { "text-anchor": "middle", "font-size": 13, fill: "#D32F2F" });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UD4_04 · Proceso isocórico: trabajo nulo</title>
    <link rel="stylesheet" href="../../comun/figura.css">
    <script src="../../comun/svg.js"></script>
    <script src="../../comun/graficas.js"></script>
</head>
<body>
<script>
// Proceso isocórico (V = cte): el sistema pasa de la isoterma T1 a la T2 sin cambiar de
// volumen; no hay área bajo el camino 1 → 2, luego W = 0.
const svg = crearFigura(380, 290);
const g = grafica(svg, { x: 50, y: 25, w: 290, h: 220, xmin: 0, xmax: 10, ymin: 0, ymax: 10, etqX: "V", etqY: "p" });
const T1 = v => 12 / v, T2 = v => 22 / v;
g.curva(T1, { desde: 1.3, hasta: 8, ancho: 2.5 });
g.curva(T2, { desde: 2.3, hasta: 9, ancho: 2.5 });
const V = 3.8;
el("line", { x1: g.px(V), y1: g.py(T1(V)), x2: g.px(V), y2: g.py(T2(V)), stroke: "#222", "stroke-dasharray": "5 4", "stroke-width": 1.6,
    "marker-end": puntaFlecha(svg, "pn", "#222", 10) }, svg);
texto(svg, g.px(V) - 8, g.py(T1(V)) + 16, "1", { "text-anchor": "end", "font-size": 17, "font-weight": "bold", fill: COLORES.texto });
texto(svg, g.px(V) - 8, g.py(T2(V)) - 2, "2", { "text-anchor": "end", "font-size": 17, "font-weight": "bold", fill: COLORES.texto });
texto(svg, g.px(8.1), g.py(T1(8.1)) + 20, [{ t: "T" }, { t: "1", sub: true }], { "font-size": 17, "font-style": "italic", fill: COLORES.texto });
texto(svg, g.px(9.1), g.py(T2(9.1)) + 20, [{ t: "T" }, { t: "2", sub: true }], { "font-size": 17, "font-style": "italic", fill: COLORES.texto });
texto(svg, g.px(6.5), g.py(8.5), "V = cte  →  W = 0", { "text-anchor": "middle", "font-size": 14, fill: "#D32F2F" });
</script>
</body>
</html>

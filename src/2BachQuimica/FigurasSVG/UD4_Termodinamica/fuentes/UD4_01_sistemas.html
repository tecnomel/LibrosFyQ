<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UD4_01 · Tipos de sistemas termodinámicos</title>
    <link rel="stylesheet" href="../../comun/figura.css">
    <script src="../../comun/svg.js"></script>
</head>
<body>
<script>
// Sistema abierto (intercambia materia y energía), cerrado (solo energía: calor y trabajo)
// y aislado (no intercambia ni materia ni energía).
const svg0 = crearFigura(760, 360);
const svg = el("g", { transform: "translate(0 32)" }, svg0);
const defs0 = defs(svg0);
const NA = "#F28C28", AZ = "#8FD3F4";
const vidrio = el("linearGradient", { id: "vidrio", x1: 0, y1: 0, x2: 1, y2: 0 }, defs0);
[["0%", "#D8EEF6"], ["25%", "#FFFFFF"], ["70%", "#E4F3F9"], ["100%", "#B9DCEA"]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, vidrio));
const liquido = el("linearGradient", { id: "liq", x1: 0, y1: 0, x2: 1, y2: 0 }, defs0);
[["0%", "#6EC3EA"], ["35%", "#BFE7F7"], ["100%", "#5AB4DE"]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, liquido));
function recipiente(cx, op = {}) {
    const w = 70, top = 70, bot = 250, ry = 10;
    // soporte
    [[-40, 30], [40, 30], [0, 40]].forEach(([dx, dy]) => el("line", { x1: cx + dx * 0.5, y1: bot - 20, x2: cx + dx, y2: bot + dy, stroke: "#555", "stroke-width": 3 }, svg));
    el("ellipse", { cx, cy: bot - 20, rx: w / 2 + 6, ry: 6, fill: "none", stroke: "#555", "stroke-width": 3 }, svg);
    if (op.aislado) {                    // pared doble (termo)
        el("rect", { x: cx - w / 2 - 6, y: top - 4, width: w + 12, height: bot - top + 4, rx: 8, fill: "#C9CDD1", stroke: "#666" }, svg);
    }
    el("rect", { x: cx - w / 2, y: top, width: w, height: bot - top, fill: "url(#vidrio)", stroke: "#7AAFC6", "stroke-width": 1.4 }, svg);
    el("rect", { x: cx - w / 2 + 1, y: 150, width: w - 2, height: bot - 151, fill: "url(#liq)" }, svg);
    el("ellipse", { cx, cy: 150, rx: w / 2 - 1, ry, fill: "#A8DDF2", stroke: "#7AAFC6" }, svg);
    el("ellipse", { cx, cy: bot, rx: w / 2, ry, fill: "#6EC3EA", stroke: "#7AAFC6" }, svg);
    if (op.tapa) {
        el("ellipse", { cx, cy: top + (op.piston ? 40 : 0), rx: w / 2, ry, fill: "#9E9E9E", stroke: "#555" }, svg);
        if (op.piston) {
            el("rect", { x: cx - 6, y: top - 40, width: 12, height: 80, fill: "#8A8A8A", stroke: "#555" }, svg);
            el("rect", { x: cx - w / 2 + 1, y: top + 38, width: w - 2, height: 8, fill: "#9E9E9E" }, svg);
        }
    } else el("ellipse", { cx, cy: top, rx: w / 2, ry, fill: "#E8F6FB", stroke: "#7AAFC6" }, svg);
}
const fl = (x1, y1, x2, y2) => flecha(svg, x1, y1, x2, y2, { color: NA, ancho: 3.2, punta: 12, doble: true });
const T = (x, y, t, a = {}) => texto(svg, x, y, t, { "text-anchor": "middle", "font-size": 14, fill: COLORES.texto, ...a });
// Abierto
recipiente(150);
fl(140, 60, 140, 20); fl(160, 20, 160, 60);
T(150, 12, "materia");
fl(70, 190, 110, 190); T(55, 170, "calor");
T(150, 315, "Abierto", { "font-size": 17, "font-weight": "bold" });
T(150, 298, "materia y energía", { fill: COLORES.gris, "font-size": 12 });
// Cerrado
recipiente(400, { tapa: true, piston: true });
fl(390, 20, 390, 0 + 55 - 35); fl(410, 20, 410, 22);
fl(385, 18, 385, 50); fl(415, 50, 415, 18);
T(400, 12, "trabajo");
fl(320, 190, 360, 190); T(305, 170, "calor");
T(400, 315, "Cerrado", { "font-size": 17, "font-weight": "bold" });
T(400, 298, "solo energía", { fill: COLORES.gris, "font-size": 12 });
// Aislado
recipiente(640, { tapa: true, aislado: true });
T(640, 315, "Aislado", { "font-size": 17, "font-weight": "bold" });
T(640, 298, "ni materia ni energía", { fill: COLORES.gris, "font-size": 12 });
</script>
</body>
</html>

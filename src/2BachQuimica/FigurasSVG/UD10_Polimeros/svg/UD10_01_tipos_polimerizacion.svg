x="535" y="128" text-anchor="middle" font-size="19" fill="#D32F2F" font-family="Times New Roman, serif" font-weight="bold">Condensación</text><text x="535" y="162" text-anchor="middle" font-size="17" fill="#23373B" font-family="Times New Roman, serif"><tspan font-style="italic">n</tspan><tspan> A + </tspan><tspan font-style="italic">n</tspan><tspan> B  →  −[A−B]</tspan><tspan font-style="italic" baseline-shift="sub" font-size="70%">n</tspan><tspan>− + H</tspan><tspan baseline-shift="sub" font-size="70%">2</tspan><tspan>O</tspan></text><text x="535" y="192" text-anchor="middle" font-size="14" fill="#525252" font-family="Times New Roman, serif">se pierde una molécula pequeña (H₂O)</text><text x="535" y="214" text-anchor="middle" font-size="14" fill="#525252" font-family="Times New Roman, serif">monómeros con dos grupos funcionales</text><text x="535" y="234" text-anchor="middle" font-size="14" fill="#525252" font-family="Times New Roman, serif">copolímeros (poliésteres, poliamidas)</text></svg>

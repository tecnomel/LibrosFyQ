<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UD0_02 · El mol como magnitud central de los cálculos</title>
    <link rel="stylesheet" href="../../comun/figura.css">
    <script src="../../comun/svg.js"></script>
</head>
<body>
<script>
// El número de moles conecta la masa, el número de partículas, el volumen de un gas
// y el volumen de una disolución. Cada pareja de flechas indica la operación de ida y vuelta.
const svg = crearFigura(760, 440);
const T = (x, y, t, a = {}) => texto(svg, x, y, t, { "text-anchor": "middle", "font-size": 15, fill: COLORES.texto, ...a });
const cx = 380, cy = 220;
const caja = (x, y, w, h, color, fondo, titulo, linea) => {
    el("rect", { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 10, fill: fondo, stroke: color, "stroke-width": 2 }, svg);
    T(x, y - 4, titulo, { "font-weight": "bold", fill: color, "font-size": 17 });
    T(x, y + 18, linea, { "font-size": 14 });
};
const ida = (x1, y1, x2, y2, col) => flecha(svg, x1, y1, x2, y2, { color: col, ancho: 2, punta: 11 });

// Centro
el("circle", { cx, cy, r: 62, fill: "#FFF3EA", stroke: COLORES.ocre, "stroke-width": 3 }, svg);
T(cx, cy - 4, "n", { "font-size": 34, "font-style": "italic", "font-weight": "bold", fill: COLORES.ocre });
T(cx, cy + 24, "(mol)", { "font-size": 15 });

// Masa (izquierda)
const AZ = COLORES.myBlue;
caja(105, cy, 170, 70, AZ, "#EEF3FC", "Masa", "m (g)");
ida(192, cy - 12, 316, cy - 12, AZ); ida(316, cy + 12, 192, cy + 12, AZ);
T(254, cy - 22, [{ t: "÷ M" }, { t: "m", sub: true }], { fill: AZ, "font-weight": "bold" });
T(254, cy + 34, [{ t: "× M" }, { t: "m", sub: true }], { fill: AZ, "font-weight": "bold" });
T(105, cy + 60, [{ t: "M" }, { t: "m", sub: true }, { t: " = masa molar (g/mol)" }], { "font-size": 12, fill: COLORES.gris });

// Partículas (derecha)
const VE = COLORES.myGreen;
caja(655, cy, 190, 70, VE, "#EAF7F1", "Partículas", "N (átomos, moléculas…)");
ida(444, cy - 12, 558, cy - 12, VE); ida(558, cy + 12, 444, cy + 12, VE);
T(501, cy - 22, [{ t: "× N" }, { t: "A", sub: true }], { fill: VE, "font-weight": "bold" });
T(501, cy + 34, [{ t: "÷ N" }, { t: "A", sub: true }], { fill: VE, "font-weight": "bold" });
T(655, cy + 60, [{ t: "N" }, { t: "A", sub: true }, { t: " = 6,022·10" }, { t: "23", sup: true }, { t: " mol" }, { t: "−1", sup: true }], { "font-size": 12, fill: COLORES.gris });

// Gas (arriba)
const RO = COLORES.myRed;
caja(cx, 52, 230, 70, RO, "#FCEEEE", "Volumen de un gas", "V (L), p (atm), T (K)");
ida(cx - 12, 90, cx - 12, cy - 66, RO); ida(cx + 12, cy - 66, cx + 12, 90, RO);
T(cx - 24, 128, "n = pV / RT", { fill: RO, "font-weight": "bold", "text-anchor": "end", "font-size": 14 });
T(cx - 24, 146, "c.n.: ÷ 22,4 L/mol", { fill: RO, "text-anchor": "end", "font-size": 13 });
T(cx + 24, 128, "V = nRT / p", { fill: RO, "font-weight": "bold", "text-anchor": "start", "font-size": 14 });
T(cx + 24, 146, "c.n.: × 22,4 L/mol", { fill: RO, "text-anchor": "start", "font-size": 13 });

// Disolución (abajo)
const VI = "#7B4FA0";
caja(cx, 388, 250, 70, VI, "#F3EEF8", "Disolución", "V (L) y molaridad M (mol/L)");
ida(cx - 12, 350, cx - 12, cy + 66, VI); ida(cx + 12, cy + 66, cx + 12, 350, VI);
T(cx - 24, 300, "n = M · V", { fill: VI, "font-weight": "bold", "text-anchor": "end", "font-size": 14 });
T(cx + 24, 300, "V = n / M", { fill: VI, "font-weight": "bold", "text-anchor": "start", "font-size": 14 });
</script>
</body>
</html>

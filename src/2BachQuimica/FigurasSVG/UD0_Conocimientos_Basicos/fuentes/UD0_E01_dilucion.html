<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UD0_E01 · Preparación de una disolución por dilución</title>
    <link rel="stylesheet" href="../../comun/figura.css">
    <script src="../../comun/svg.js"></script>
</head>
<body>
<script>
// Se toma un volumen V1 de la disolución concentrada con una pipeta y se enrasa con agua
// en un matraz aforado hasta V2. Los moles de soluto no cambian: M1·V1 = M2·V2.
const svg = crearFigura(760, 330);
const T = (x, y, t, a = {}) => texto(svg, x, y, t, { "text-anchor": "middle", "font-size": 15, fill: COLORES.texto, ...a });
const VID = "#6E9FB3", CONC = "#E0742C", DIL = "#F6C9A6";

// 1) Frasco de disolución concentrada
el("rect", { x: 40, y: 90, width: 120, height: 170, rx: 14, fill: "#fff", stroke: VID, "stroke-width": 3 }, svg);
el("rect", { x: 72, y: 62, width: 56, height: 30, fill: "#fff", stroke: VID, "stroke-width": 3 }, svg);
el("rect", { x: 43, y: 140, width: 114, height: 117, rx: 10, fill: CONC, "fill-opacity": 0.85 }, svg);
el("rect", { x: 55, y: 175, width: 90, height: 46, rx: 4, fill: "#fff", stroke: "#999" }, svg);
T(100, 194, "concentrada", { "font-size": 12 });
T(100, 212, [{ t: "M" }, { t: "1", sub: true }], { "font-size": 14, "font-weight": "bold" });
T(100, 290, "Disolución madre", { "font-weight": "bold" });

// 2) Pipeta con V1
el("path", { d: "M300,30 L300,120 Q300,128 292,134 L292,190 Q300,196 300,204 L300,250 L304,262 L308,250 L308,204 Q316,196 316,190 L316,134 Q308,128 308,120 L308,30 Z",
    fill: "#fff", stroke: VID, "stroke-width": 2 }, svg);
el("path", { d: "M301.5,150 L294,150 L294,189 Q301.5,195 301.5,204 L301.5,250 L304,258 L306.5,250 L306.5,204 Q306.5,195 314,189 L314,150 Z", fill: CONC }, svg);
el("line", { x1: 290, y1: 150, x2: 318, y2: 150, stroke: "#333", "stroke-width": 1.4 }, svg);
texto(svg, 328, 155, [{ t: "V" }, { t: "1", sub: true }], { "font-size": 15, "font-weight": "bold", fill: CONC });
T(304, 290, "Pipeta");
flecha(svg, 170, 160, 280, 160, { ancho: 2, punta: 11, trazo: "6 4" });
T(225, 150, "se toma", { "font-size": 13, fill: COLORES.gris });

// 3) Matraz aforado con V2
flecha(svg, 345, 220, 470, 220, { ancho: 2, punta: 11, trazo: "6 4" });
T(408, 210, "+ agua", { "font-size": 13, fill: COLORES.gris });
const mx = 590;
el("path", { d: `M${mx - 12},40 L${mx - 12},150 Q${mx - 90},190 ${mx - 90},230 Q${mx - 90},265 ${mx},265 Q${mx + 90},265 ${mx + 90},230 Q${mx + 90},190 ${mx + 12},150 L${mx + 12},40`,
    fill: "#fff", stroke: VID, "stroke-width": 3 }, svg);
el("path", { d: `M${mx - 10},92 L${mx - 10},151 Q${mx - 87},191 ${mx - 87},230 Q${mx - 87},262 ${mx},262 Q${mx + 87},262 ${mx + 87},230 Q${mx + 87},191 ${mx + 10},151 L${mx + 10},92 Z`,
    fill: DIL }, svg);
el("line", { x1: mx - 18, y1: 92, x2: mx + 18, y2: 92, stroke: "#333", "stroke-width": 1.6 }, svg);
texto(svg, mx + 24, 97, "enrase", { "font-size": 12, fill: COLORES.gris });
T(mx, 222, [{ t: "M" }, { t: "2", sub: true }, { t: " < M" }, { t: "1", sub: true }], { "font-size": 14, "font-weight": "bold" });
T(mx, 290, [{ t: "Matraz aforado de V" }, { t: "2", sub: true }], { "font-weight": "bold" });

// Conclusión
el("rect", { x: 160, y: 300, width: 440, height: 28, rx: 8, fill: "#FFF3EA", stroke: COLORES.ocre }, svg);
T(380, 320, [{ t: "n" }, { t: "soluto", sub: true }, { t: " se conserva:   M" }, { t: "1", sub: true }, { t: " · V" }, { t: "1", sub: true },
    { t: " = M" }, { t: "2", sub: true }, { t: " · V" }, { t: "2", sub: true }], { "font-size": 15, "font-weight": "bold" });
</script>
</body>
</html>

-size="70%">C</tspan><tspan> teórico</tspan></text><text x="735" y="106" text-anchor="middle" font-size="13" fill="#23373B">(mol)</text><line x1="145" y1="90" x2="225" y2="90" stroke="#F36619" stroke-width="2" marker-end="url(#pf_F36619_11)"></line><text x="185" y="53" text-anchor="middle" font-size="13" fill="#F36619" font-weight="bold">× riqueza/100</text><line x1="365" y1="90" x2="445" y2="90" stroke="#F36619" stroke-width="2" marker-end="url(#pf_F36619_11)"></line><text x="405" y="53" text-anchor="middle" font-size="13" fill="#F36619" font-weight="bold"><tspan>÷ M</tspan><tspan baseline-shift="sub" font-size="70%">m</tspan><tspan>(A)</tspan></text><line x1="585" y1="90" x2="665" y2="90" stroke="#F36619" stroke-width="2" marker-end="url(#pf_F36619_11)"></line><text x="625" y="53" text-anchor="middle" font-size="13" fill="#F36619" font-weight="bold">× c / a</text><text x="625" y="133" text-anchor="middle" font-size="11" fill="#525252">coeficientes</text><rect x="665" y="176" width="140" height="58" rx="10" fill="#EAF7F1" stroke="#32AB77" stroke-width="2"></rect><text x="735" y="201" text-anchor="middle" font-size="15" fill="#32AB77" font-weight="bold"><tspan>n</tspan><tspan baseline-shift="sub" font-size="70%">C</tspan><tspan> obtenido</tspan></text><text x="735" y="221" text-anchor="middle" font-size="13" fill="#23373B">(mol)</text><line x1="735" y1="119" x2="735" y2="176" stroke="#F36619" stroke-width="2" marker-end="url(#pf_F36619_11)"></line><text x="735" y="152.5" text-anchor="end" font-size="13" fill="#F36619" font-weight="bold">× rendimiento/100</text><rect x="35" y="301" width="140" height="58" rx="10" fill="#F3EEF8" stroke="#7B4FA0" stroke-width="2"></rect><text x="105" y="326" text-anchor="middle" font-size="15" fill="#7B4FA0" font-weight="bold">Masa de C</text><text x="105" y="346" text-anchor="middle" font-size="13" fill="#23373B"><tspan>m = n · M</tspan><tspan baseline-shift="sub" font-size="70%">m</tspan></text><rect x="255" y="301" width="140" height="58" rx="10" fill="#F3EEF8" stroke="#7B4FA0" stroke-width="2"></rect><text x="325" y="326" text-anchor="middle" font-size="15" fill="#7B4FA0" font-weight="bold">Gas C</text><text x="325" y="346" text-anchor="middle" font-size="13" fill="#23373B">V = nRT / p</text><rect x="475" y="301" width="140" height="58" rx="10" fill="#F3EEF8" stroke="#7B4FA0" stroke-width="2"></rect><text x="545" y="326" text-anchor="middle" font-size="15" fill="#7B4FA0" font-weight="bold">Disolución de C</text><text x="545" y="346" text-anchor="middle" font-size="13" fill="#23373B">V = n / M</text><rect x="665" y="301" width="140" height="58" rx="10" fill="#F3EEF8" stroke="#7B4FA0" stroke-width="2"></rect><text x="735" y="326" text-anchor="middle" font-size="15" fill="#7B4FA0" font-weight="bold">Partículas de C</text><text x="735" y="346" text-anchor="middle" font-size="13" fill="#23373B"><tspan>N = n · N</tspan><tspan baseline-shift="sub" font-size="70%">A</tspan></text><line x1="675" y1="230" x2="125" y2="299" stroke="#7B4FA0" stroke-width="1.6" marker-end="url(#pf_7B4FA0_10)"></line><line x1="675" y1="230" x2="345" y2="299" stroke="#7B4FA0" stroke-width="1.6" marker-end="url(#pf_7B4FA0_10)"></line><line x1="675" y1="230" x2="565" y2="299" stroke="#7B4FA0" stroke-width="1.6" marker-end="url(#pf_7B4FA0_10)"></line><line x1="735" y1="234" x2="735" y2="301" stroke="#7B4FA0" stroke-width="1.6" marker-end="url(#pf_7B4FA0_10)"></line><rect x="20" y="180" width="470" height="52" rx="8" fill="#FFF8E1" stroke="#E0A800" stroke-dasharray="5 4"></rect><text x="255" y="201" text-anchor="middle" font-size="13" fill="#23373B">Si hay datos de dos reactivos, se calcula primero cuál es el</text><text x="255" y="221" text-anchor="middle" font-size="13" fill="#23373B" font-weight="bold">reactivo limitante y los cálculos se hacen con él</text></svg>

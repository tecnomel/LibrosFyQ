<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UD9_08 · Configuración absoluta R y S (butan-2-ol)</title>
    <link rel="stylesheet" href="../../comun/figura.css">
    <script src="../../comun/svg.js"></script>
    <script src="../../comun/organica.js"></script>
</head>
<body>
<script>
// Butan-2-ol. Prioridades CIP: OH (1) > CH2CH3 (2) > CH3 (3) > H (4). Con el H hacia el fondo,
// si 1 → 2 → 3 gira en sentido antihorario la configuración es S; si gira en sentido horario, R.
const svg = crearFigura(640, 200);
const T = (x, y, p, a = {}) => texto(svg, x, y, p, { "text-anchor": "middle", "font-size": 18, fill: COLORES.texto, "font-family": TNR, ...a });
function cuña(p, q, rayada, color = "#222") {
    const dx = q[0] - p[0], dy = q[1] - p[1], d = Math.hypot(dx, dy), nx = -dy / d, ny = dx / d;
    if (!rayada) el("polygon", { points: `${p[0]},${p[1]} ${q[0] + nx * 5},${q[1] + ny * 5} ${q[0] - nx * 5},${q[1] - ny * 5}`, fill: color }, svg);
    else for (let k = 1; k <= 7; k++) { const t = k / 7, w = 5 * t, x = p[0] + dx * t, y = p[1] + dy * t;
        el("line", { x1: x + nx * w, y1: y + ny * w, x2: x - nx * w, y2: y - ny * w, stroke: color, "stroke-width": 1.3 }, svg); }
}
const num = (x, y, n) => texto(svg, x, y, String(n), { "text-anchor": "middle", "font-size": 12, fill: "#333", "font-family": TNR });
function enantiomero(cx, R) {
    const cy = 100;
    el("line", { x1: cx, y1: cy - 6, x2: cx, y2: cy - 38, stroke: "#222", "stroke-width": 1.6 }, svg);
    T(cx, cy - 44, [{ t: "OH" }]); num(cx - 2, cy - 64, 1);
    cuña([cx + 4, cy - 2], [cx + 34, cy - 12], true, ROJO); T(cx + 44, cy - 8, "H", { fill: ROJO, "font-weight": "bold" });
    el("line", { x1: cx - 6, y1: cy, x2: cx - 38, y2: cy + 8, stroke: "#222", "stroke-width": 1.6 }, svg);
    cuña([cx + 3, cy + 5], [cx + 30, cy + 30]);
    if (!R) { T(cx - 70, cy + 16, quim("H3CH2C")); num(cx - 52, cy + 32, 2); T(cx + 50, cy + 44, quim("CH3")); num(cx + 44, cy + 60, 3); }
    else { T(cx - 58, cy + 16, quim("H3C")); num(cx - 52, cy + 32, 3); T(cx + 62, cy + 44, quim("CH2CH3")); num(cx + 44, cy + 60, 2); }
    T(cx - 12, cy - 6, R ? "R" : "S", { "font-style": "italic", fill: AZUL, "font-size": 15 });
    // flecha de giro 1 → 2 → 3 (horaria para R, antihoraria para S)
    const r = 88;
    const d = R ? `M${cx + 20},${cy - 90} A ${r} ${r} 0 1 1 ${cx + 20},${cy + 85}` : `M${cx - 20},${cy - 90} A ${r} ${r} 0 1 0 ${cx - 20},${cy + 85}`;
    el("path", { d, fill: "none", stroke: "#333", "stroke-width": 1.5, "marker-end": puntaFlecha(svg, "pg", "#333", 10) }, svg);
}
enantiomero(170, false);
el("line", { x1: 320, y1: 10, x2: 320, y2: 190, stroke: "#333", "stroke-dasharray": "4 4" }, svg);
enantiomero(470, true);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UD9_03 · Isomería de función: alcohol/éter y aldehído/cetona</title>
    <link rel="stylesheet" href="../../comun/figura.css">
    <script src="../../comun/svg.js"></script>
    <script src="../../comun/lewis.js"></script>
    <script src="../../comun/organica.js"></script>
    <script src="../../comun/lib/smiles-drawer.min.js"></script>
</head>
<body>
<script>
// Isómeros de función: misma fórmula molecular pero distinto grupo funcional.
const svg = crearFigura(760, 130);
molecula(svg, "CCO", 60, 55, { etiqueta: "alcohol", yEtq: 115 });
flechaIso(svg, 110, 55, 180);
molecula(svg, "COC", 240, 55, { etiqueta: "éter", yEtq: 115 });
el("line", { x1: 330, y1: 10, x2: 330, y2: 120, stroke: "#333", "stroke-dasharray": "4 4" }, svg);
molecula(svg, "CCCC=O", 440, 55, { etiqueta: "aldehído", yEtq: 115, hidrogenos: false });
flechaIso(svg, 540, 55, 610);
molecula(svg, "CCC(C)=O", 690, 55, { etiqueta: "cetona", yEtq: 115 });
texto(svg, 145, 30, [{ t: "C" }, { t: "2", sub: true }, { t: "H" }, { t: "6", sub: true }, { t: "O" }], { "text-anchor": "middle", "font-size": 13, fill: COLORES.gris, "font-family": TNR });
texto(svg, 575, 30, [{ t: "C" }, { t: "4", sub: true }, { t: "H" }, { t: "8", sub: true }, { t: "O" }], { "text-anchor": "middle", "font-size": 13, fill: COLORES.gris, "font-family": TNR });
</script>
</body>
</html>

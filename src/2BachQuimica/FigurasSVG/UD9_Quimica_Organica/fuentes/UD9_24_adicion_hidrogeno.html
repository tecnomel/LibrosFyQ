<script>
// Hidrogenación de alquenos (catalizador: Ni, Pt o Pd): se obtiene el alcano.
const svg = crearFigura(560, 220);
alquenoGen(svg, 40, 50);
mas(svg, 125, 50); fq(svg, 175, 56, [["H−H", AZUL]]);
flechaR(svg, 215, 50, 295, "Pt");
alcanoGen(svg, 350, 50, { i1: ["H", ROJO], d2: ["H", ROJO] });
molecula(svg, "C=CC", 70, 160);
mas(svg, 125, 160); fq(svg, 175, 166, [["H−H", AZUL]]);
flechaR(svg, 215, 160, 295, "Pt");
molecula(svg, "[He]CC([He])C", 390, 160, { grupos: { He: { t: "H", color: ROJO } } });
texto(svg, 70, 210, "propeno", { "text-anchor": "middle", "font-size": 15, fill: COLORES.texto, "font-family": TNR });
texto(svg, 390, 210, "propano", { "text-anchor": "middle", "font-size": 15, fill: COLORES.texto, "font-family": TNR });
</script>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UD9_05 · Reglas CIP: comparación de sustituyentes</title>
    <link rel="stylesheet" href="../../comun/figura.css">
    <script src="../../comun/svg.js"></script>
    <script src="../../comun/lewis.js"></script>
    <script src="../../comun/organica.js"></script>
</head>
<body>
<script>
// Reglas de Cahn-Ingold-Prelog: para comparar dos sustituyentes se avanza átomo a átomo
// (1, 2, ...) desde el punto de unión hasta encontrar la primera diferencia.
const svg = crearFigura(560, 170);
function cadena(x0, n, etq, color) {
    const at = [], en = [];
    for (let i = 0; i < n; i++) {
        at.push({ s: "C", id: "c" + i, x: i, y: 0 }, { s: "H", id: "a" + i, x: i, y: 0.85 }, { s: "H", id: "b" + i, x: i, y: -0.85 });
        en.push({ a: "c" + i, b: "a" + i }, { a: "c" + i, b: "b" + i });
        if (i) en.push({ a: "c" + (i - 1), b: "c" + i });
    }
    at.push({ s: "H", id: "f", x: n, y: 0 }); en.push({ a: "c" + (n - 1), b: "f" });
    at.push({ s: "", id: "w", x: -0.8, y: 0 }); en.push({ a: "w", b: "c0" });
    dibujarLewis(svg, x0, 75, { atomos: at, enlaces: en }, { L: 38, tamLetra: 19, fuente: TNR });
    // enlace de unión (ondulado)
    const xw = x0 - 0.8 * 38;
    el("path", { d: "M" + xw + ",60 q -5,4 0,8 t 0,8 t 0,8 t 0,8", fill: "none", stroke: "#222", "stroke-width": 1.4 }, svg);
    for (let i = 0; i < n; i++) texto(svg, x0 + i * 38 - 12, 97, String(i + 1), { "font-size": 13, fill: "#1E4FC0", "font-family": TNR });
    texto(svg, x0 + (n - 1) * 19, 150, etq, { "text-anchor": "middle", "font-size": 18, "font-weight": "bold", fill: color, "font-family": TNR });
}
cadena(70, 2, "A", ROJO);
cadena(300, 3, "B", AZUL);
</script>
</body>
</html>

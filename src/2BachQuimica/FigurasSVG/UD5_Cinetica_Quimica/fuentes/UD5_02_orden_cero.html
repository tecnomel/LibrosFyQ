<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UD5_02 · Cinética de orden cero</title>
    <link rel="stylesheet" href="../../comun/figura.css">
    <script src="../../comun/svg.js"></script>
    <script src="../../comun/graficas.js"></script>
</head>
<body>
<script>
// Orden cero: [A] = [A]0 − k·t  → recta de pendiente −k.
const svg = crearFigura(330, 270);
texto(svg, 175, 22, "Orden cero", { "text-anchor": "middle", "font-size": 19, fill: COLORES.texto });
const g = grafica(svg, { x: 50, y: 40, w: 250, h: 190, xmin: 0, xmax: 10, ymin: 0, ymax: 10, etqX: "Tiempo", etqY: "[A]" });
g.curva(t => 9.2 - 1.3 * t, { desde: 0.8, hasta: 6.5, ancho: 3 });
texto(svg, g.px(5.5), g.py(7), "pendiente = −k", { "font-size": 13, fill: "#D32F2F" });
</script>
</body>
